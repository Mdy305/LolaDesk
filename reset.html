<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>New password — LolaDesk</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--surface:#0f0f12;--line:#1f1f24;--line2:#2b2b31;--ink:#f5f5f7;--ink2:#a1a1a8;--ink3:#5f5f67;--danger:#ff6b60;color-scheme:dark;
  --ff:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--ink);font-family:var(--ff);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
button,input{font:inherit;color:inherit}
.lola{position:relative;width:150px;height:150px;margin-bottom:18px}
.lola canvas{position:absolute;inset:0;width:100%;height:100%}
form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;text-align:center}
p{font-size:14px;color:var(--ink2);text-align:center;line-height:1.55}
.input{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;font-size:15px;outline:none}
.input:focus{border-color:#6a6a72}
.btn{width:100%;padding:14px;border:0;border-radius:999px;font-size:15px;font-weight:600;background:var(--ink);color:#0a0a0b;cursor:pointer}
.btn:disabled{opacity:.5}
.msg{font-size:13px;min-height:18px;text-align:center;color:var(--ink2)}
.msg.err{color:var(--danger)}
a{color:var(--ink2)}
</style>
</head>
<body>
<div class="lola"><canvas id="c" aria-hidden="true"></canvas></div>
<form id="f">
  <h1>Choose a new password</h1>
  <p>At least 8 characters. You'll go straight into LolaDesk.</p>
  <input class="input" id="pw" type="password" autocomplete="new-password" placeholder="New password" minlength="8" required/>
  <input class="input" id="pw2" type="password" autocomplete="new-password" placeholder="Type it again" minlength="8" required/>
  <button class="btn" id="go" type="submit">Save and sign in</button>
  <p class="msg" id="msg" role="status"></p>
</form>
<script src="/lola-orb.js"></script>
<script>
(function(){
  const $ = (id) => document.getElementById(id);
  try { if (window.LolaOrb) LolaOrb.mount($('c'), { size: 150, bleed: 0.35 }).setState('ambient'); } catch (_) {}
  const h = new URLSearchParams(location.hash.replace(/^#/, ''));
  const token = h.get('access_token');
  try { history.replaceState(null, '', location.pathname); } catch (_) {}
  if (!token || (h.get('type') && h.get('type') !== 'recovery')) {
    $('msg').className = 'msg err';
    $('msg').innerHTML = 'This link has expired or was already used. <a href="/login">Ask Lola for a new one</a>.';
    $('go').disabled = true;
  }
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = $('pw').value, msg = $('msg');
    if (pw.length < 8) { msg.className = 'msg err'; msg.textContent = 'Use at least 8 characters.'; return; }
    if (pw !== $('pw2').value) { msg.className = 'msg err'; msg.textContent = 'The two passwords don’t match.'; return; }
    $('go').disabled = true; msg.className = 'msg'; msg.textContent = 'Saving…';
    try {
      const r = await fetch('/api/auth/reset', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify({ action: 'update', password: pw }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Couldn’t save it. Ask for a new link.');
      msg.textContent = 'Saved. Signing you in…';
      const s = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: d.email, password: pw }) });
      const sd = await s.json().catch(() => ({}));
      if (s.ok && sd.session) {
        localStorage.setItem('loladesk_token', sd.session.access_token || ''); localStorage.setItem('loladesk_refresh', sd.session.refresh_token || '');
        location.href = sd.tenant ? (sd.setup_done === false ? '/onboarding?resume=1' : '/dashboard') : '/onboarding';
      } else location.href = '/login?email=' + encodeURIComponent(d.email || '');
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message; $('go').disabled = false; }
  });
})();
</script>
</body>
</html>
