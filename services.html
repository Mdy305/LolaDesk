<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Services · LolaDesk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/services.css">
</head>
<body data-page="services">
  <div class="ld-app">
    <aside id="sidebar-mount"></aside>
    <main class="ld-main">
      <header class="ld-page-head">
        <div>
          <h1 class="ld-page-title">Services</h1>
          <p class="ld-page-sub">The menu Lola books from. Add, edit, and rearrange.</p>
        </div>
        <div style="display:flex;gap:8px">
          <button class="ld-btn" id="btn-import">Import from Booksy</button>
          <button class="ld-btn pri" id="btn-new">＋ New service</button>
        </div>
      </header>

      <section id="empty" class="ld-empty" hidden>
        <h3>No services yet</h3>
        <p>Add your first service — Lola can start booking it the moment you save.</p>
        <button class="ld-btn pri" id="btn-first">Add your first service</button>
      </section>

      <section id="cats"></section>
    </main>
  </div>
  <script src="/auth-guard.js" defer></script>
  <script src="/page-shell.js" defer></script>
  <script src="/services.js" defer></script>
</body>
</html>
