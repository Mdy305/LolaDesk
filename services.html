<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Services — LolaDesk</title><link rel="stylesheet" href="app.css"/>
<style>
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:20px}
.svc-card{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:18px 20px}
.svc-name{font-size:15px;font-weight:600;margin-bottom:4px}
.svc-price{font-size:22px;font-weight:300;color:var(--accent2);margin-bottom:4px}
.svc-meta{font-size:12px;color:var(--text3);margin-bottom:14px}
.svc-acts{display:flex;gap:8px}
.sbtn{padding:7px 14px;border-radius:9px;font-size:12px;cursor:pointer;border:.5px solid var(--border);background:transparent;color:var(--text2)}
.sbtn.red{color:#ff8a8a;border-color:#ff6b6b33}
.mw{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mw.open{display:flex}
.modal{background:var(--bg2);border:.5px solid var(--border);border-radius:20px;padding:26px;max-width:440px;width:100%}
.modal h3{font-size:18px;font-weight:600;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld textarea{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;width:100%;font-family:inherit}
.fld input:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macts{display:flex;gap:10px;margin-top:6px}
.macts button{flex:1;padding:12px;border-radius:11px;font-size:14px;font-weight:560;cursor:pointer;border:none}
.macts .ghost{background:transparent;border:.5px solid var(--border);color:var(--text2)}
.macts .save{background:var(--text);color:#080809}
.err{color:#ff8a8a;font-size:12px;margin-top:8px;min-height:16px}
.empty{color:var(--text3);padding:60px 0;text-align:center;font-size:14px;line-height:2}
</style>
</head>
<body data-page="services"><div class="app"><main class="main">
<div class="page-head">
  <div><h1 class="page-title">Services</h1><p style="font-size:13px;color:var(--text3);margin-top:4px">Your catalog — shown in booking and quoted by Lola on every call.</p></div>
  <button class="btn btn-primary" onclick="openForm()">+ Add service</button>
</div>
<div class="svc-grid" id="svcGrid"><div class="empty">Loading...</div></div>
</main></div>
<div class="mw" id="modal"><div class="modal">
  <h3 id="mTitle">Add service</h3>
  <div class="fld"><label>Name</label><input id="fName" placeholder="e.g. Luxury Balayage"/></div>
  <div class="row2">
    <div class="fld"><label>Duration (min)</label><input id="fDur" type="number" min="5" max="480" placeholder="60"/></div>
    <div class="fld"><label>Price ($)</label><input id="fPrice" type="number" min="0" placeholder="0"/></div>
  </div>
  <div class="fld"><label>Description (optional)</label><textarea id="fDesc" rows="2" style="resize:vertical"></textarea></div>
  <div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button><button class="save" onclick="save()">Save service</button></div>
  <div class="err" id="err"></div>
</div></div>
<script src="auth-guard.js"></script><script src="sidebar.js"></script>
<script>
let SVCS=[],editId=null;
function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||'';}
function hdr(){return{Authorization:'Bearer '+token()};}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){
  try{const r=await fetch('/api/services',{headers:hdr()});const d=await r.json();SVCS=d.ok?(d.services||[]):[];}catch(e){SVCS=[];}
  render();
}
function render(){
  const g=document.getElementById('svcGrid');
  if(!SVCS.length){g.innerHTML='<div class="empty">No services yet.<br>Add your services so clients can book online<br>and Lola quotes prices on every call.</div>';return;}
  g.innerHTML=SVCS.filter(s=>s.is_active!==false).map(s=>`<div class="svc-card"><div class="svc-name">${esc(s.name)}</div><div class="svc-price">${s.price!=null?'$'+Number(s.price).toLocaleString():'Free'}</div><div class="svc-meta">${s.duration_minutes||60} min${s.description?' · '+esc(s.description):''}</div><div class="svc-acts"><button class="sbtn" onclick="edit('${s.id}')">Edit</button><button class="sbtn red" onclick="del('${s.id}')">Remove</button></div></div>`).join('');
}
function openForm(){editId=null;document.getElementById('mTitle').textContent='Add service';['fName','fDesc'].forEach(i=>document.getElementById(i).value='');document.getElementById('fDur').value='60';document.getElementById('fPrice').value='';document.getElementById('err').textContent='';document.getElementById('modal').classList.add('open');}
function edit(id){const s=SVCS.find(x=>x.id===id);if(!s)return;editId=id;document.getElementById('mTitle').textContent='Edit service';document.getElementById('fName').value=s.name||'';document.getElementById('fDur').value=s.duration_minutes||60;document.getElementById('fPrice').value=s.price!=null?s.price:'';document.getElementById('fDesc').value=s.description||'';document.getElementById('err').textContent='';document.getElementById('modal').classList.add('open');}
function closeModal(){document.getElementById('modal').classList.remove('open');}
async function save(){
  const name=document.getElementById('fName').value.trim();
  const err=document.getElementById('err');
  if(!name){err.textContent='Name is required.';return;}
  err.textContent='';
  try{
    const r=await fetch('/api/services',{method:'POST',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({id:editId||undefined,name,duration_minutes:Number(document.getElementById('fDur').value||60),price:document.getElementById('fPrice').value!==''?Number(document.getElementById('fPrice').value):0,description:document.getElementById('fDesc').value.trim()})});
    const d=await r.json();if(!d.ok)throw new Error(d.error||'Failed');
    closeModal();load();
  }catch(e){err.textContent=e.message||'Something went wrong.';}
}
async function del(id){
  if(!confirm('Remove this service?'))return;
  try{await fetch('/api/services?id='+id,{method:'DELETE',headers:hdr()});load();}catch(e){alert(e.message);}
}
(async()=>{try{await window.LolaAuth.ready;}catch(e){return;}load();})();
</script></body></html>
