<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Services — LolaDesk</title>
<meta name="description" content="Your service menu — what Lola quotes on every call and what clients see when they book online."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="app.css"/>
<style>
/* ═══════════════════════════════════════════════════════════════
   Services — the catalog Lola quotes and clients book from.
   Preserves the original endpoints (GET/POST/DELETE /api/services)
   and adds Jobs-level layer: narrative, categories, search,
   duration/price sorting, add-photo, deposit override per service.
   New fields on the wire (backend TODO — safe to ignore server-side):
     category, photo_url, sort_order, deposit_override_amount,
     deposit_override_type, buffer_after_min, tags[]
   ═══════════════════════════════════════════════════════════════ */
.page-narrative{font-size:14px;color:var(--text2);margin-top:4px;line-height:1.55;max-width:640px}
.page-narrative b{color:var(--text);font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center}

.sv-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chip-row{display:inline-flex;gap:6px;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:4px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;transition:color .15s,background .15s;border:none;background:transparent;min-height:36px;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.chip:hover{color:var(--text)}
.chip.on{color:#10140a;background:var(--accent)}
.chip-count{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.14);color:inherit;min-width:18px;text-align:center}
.chip.on .chip-count{background:rgba(16,20,10,.18);color:#10140a}
.search-box{flex:1;min-width:220px;max-width:360px;position:relative}
.search-box input{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-sm);padding:10px 14px 10px 38px;color:var(--text);font:inherit;min-height:40px}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.svc-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:20px 22px;transition:border-color .15s,transform .15s;cursor:pointer;position:relative;overflow:hidden}
.svc-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.svc-card:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.svc-card.premium::before{content:"PREMIUM";position:absolute;top:14px;right:-24px;font-size:9px;font-weight:700;letter-spacing:.16em;color:#10140a;background:var(--accent);padding:2px 26px;transform:rotate(45deg);box-shadow:0 4px 12px var(--accent-glow)}
.svc-photo{width:100%;height:120px;border-radius:var(--r-sm);background:var(--surface2);margin:-6px 0 14px;overflow:hidden;position:relative}
.svc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.svc-photo.empty{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:12px}
.svc-name{font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:4px}
.svc-cat{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:8px}
.svc-price{font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--accent);margin-bottom:6px;font-variant-numeric:tabular-nums}
.svc-price.free{color:var(--info)}
.svc-meta{font-size:12.5px;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.svc-meta svg{color:var(--text2)}
.svc-desc{font-size:12.5px;color:var(--text2);line-height:1.5;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.svc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.svc-tag{font-size:10.5px;color:var(--text2);background:var(--surface2);padding:3px 8px;border-radius:20px;border:.5px solid var(--border)}
.svc-acts{display:flex;gap:6px}
.sbtn{padding:8px 14px;border-radius:var(--r-sm);font-size:12px;font-weight:600;cursor:pointer;border:.5px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;transition:background .12s,border-color .12s;min-height:34px}
.sbtn:hover{background:var(--bg2);border-color:var(--border2)}
.sbtn.danger{background:transparent;border-color:rgba(255,90,77,.35);color:var(--danger)}
.sbtn.danger:hover{background:rgba(255,90,77,.08)}

/* SKELETON */
.sk-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r);padding:20px 22px}
.sk-bar{background:linear-gradient(90deg,var(--surface2) 0%,var(--surface) 50%,var(--surface2) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:6px}
.sk-photo{height:120px;border-radius:var(--r-sm);margin-bottom:14px}
.sk-name{height:14px;width:60%;margin-bottom:8px}
.sk-price{height:20px;width:35%;margin-bottom:10px}
.sk-meta{height:10px;width:45%;margin-bottom:14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk-bar{animation:none}}

/* EMPTY */
.empty-state{padding:60px 24px;text-align:center;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:14px;grid-column:1/-1}
.empty-orb{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#3a5a00);display:flex;align-items:center;justify-content:center;color:#10140a;font-weight:700;font-size:22px;box-shadow:0 6px 24px var(--accent-glow)}
.empty-title{font-weight:600;color:var(--text);font-size:16px}
.empty-sub{max-width:340px;line-height:1.55;font-size:13.5px;color:var(--text2)}

/* MODAL */
.mw{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.mw.open{display:flex}
.modal{background:var(--bg2);border:.5px solid var(--border);border-radius:22px;padding:28px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 30px 100px rgba(0,0,0,.55)}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.modal h3{font-size:20px;font-weight:600;letter-spacing:-.02em}
.modal-close{width:34px;height:34px;border-radius:50%;background:var(--surface);border:.5px solid var(--border);color:var(--text);font-size:18px;cursor:pointer}
.modal-close:hover{background:var(--surface2)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:10.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.fld input,.fld textarea,.fld select{background:var(--surface);border:.5px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;color:var(--text);font-size:14px;outline:none;width:100%;font-family:inherit;min-height:44px;transition:border-color .15s,box-shadow .15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.fld textarea{min-height:80px;resize:vertical}
.fld .fine{font-size:11px;color:var(--text3);margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-row{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px dashed var(--border2);border-radius:var(--r-sm);margin-bottom:14px}
.photo-preview{width:72px;height:72px;border-radius:var(--r-sm);background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--text3);font-size:11px}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.macts{display:flex;gap:10px;margin-top:8px}
.macts button{flex:1;padding:12px;border-radius:var(--r-sm);font-size:14px;font-weight:600;cursor:pointer;border:.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;min-height:44px}
.macts .primary{background:var(--accent);color:#10140a;border-color:var(--accent);font-weight:700}
.macts .primary:hover{box-shadow:0 4px 14px var(--accent-glow)}
.err{color:var(--danger);font-size:12.5px;margin-top:8px;min-height:16px}
.err.ok{color:var(--accent)}

/* RESPONSIVE */
@media(max-width:720px){
  .chip-row{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .search-box{max-width:none;width:100%}
  .row2{grid-template-columns:1fr}
  .topbar-actions{width:100%}
  .topbar-actions .btn{width:100%;justify-content:center}
}
@media(max-width:420px){
  .main{padding:12px 12px 90px}
  .svc-card{padding:18px 20px}
  .modal{padding:22px 20px}
}
</style>
</head>
<body data-page="services">
<div class="app">
  <main class="main">

    <div class="topbar">
      <div class="page-head">
        <h1 class="page-title">Services</h1>
        <p class="page-narrative" id="narrativeLine">Loading your service catalog…</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" onclick="openForm()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add service
        </button>
      </div>
    </div>

    <div class="sv-toolbar" role="toolbar" aria-label="Filter and search services">
      <div class="chip-row" id="chipRow" role="tablist" aria-label="Filter by category">
        <!-- populated by JS -->
      </div>
      <label class="search-box" aria-label="Search services">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
        <input id="searchInput" type="search" placeholder="Search services by name…" oninput="setQuery(this.value)" autocomplete="off"/>
      </label>
    </div>

    <div class="svc-grid" id="svcGrid" role="list">
      <div class="sk-card"><div class="sk-bar sk-photo"></div><div class="sk-bar sk-name"></div><div class="sk-bar sk-price"></div><div class="sk-bar sk-meta"></div></div>
      <div class="sk-card"><div class="sk-bar sk-photo"></div><div class="sk-bar sk-name"></div><div class="sk-bar sk-price"></div><div class="sk-bar sk-meta"></div></div>
      <div class="sk-card"><div class="sk-bar sk-photo"></div><div class="sk-bar sk-name"></div><div class="sk-bar sk-price"></div><div class="sk-bar sk-meta"></div></div>
    </div>

  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="mw" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="modal-head">
      <div>
        <h3 id="mTitle">Add service</h3>
        <div style="font-size:12.5px;color:var(--text3);margin-top:4px">Shown in booking and quoted by Lola on every call.</div>
      </div>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
    </div>

    <div class="photo-row">
      <div class="photo-preview" id="photoPreview">Photo</div>
      <div>
        <label for="photoInput" class="btn btn-ghost">Upload photo</label>
        <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden/>
        <div style="margin-top:7px;font-size:11px;color:var(--text3)">Optional. Shown on the booking widget · JPEG, PNG, WebP up to 2 MB</div>
      </div>
    </div>

    <div class="fld"><label>Service name *</label><input id="fName" placeholder="e.g. Luxury Balayage"/></div>

    <div class="row2">
      <div class="fld">
        <label>Category</label>
        <select id="fCategory">
          <option value="Hair">Hair</option>
          <option value="Color">Color</option>
          <option value="Extensions">Extensions</option>
          <option value="Nails">Nails</option>
          <option value="Skin">Skin</option>
          <option value="Wax">Wax</option>
          <option value="Lash & brow">Lash & brow</option>
          <option value="Massage">Massage</option>
          <option value="Med spa">Med spa</option>
          <option value="Consultation">Consultation</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="fld"><label>Duration (min)</label><input id="fDur" type="number" min="5" max="480" placeholder="60" inputmode="numeric"/></div>
    </div>

    <div class="row2">
      <div class="fld"><label>Price ($)</label><input id="fPrice" type="number" min="0" step="1" placeholder="0" inputmode="decimal"/></div>
      <div class="fld"><label>Buffer after (min)</label><input id="fBuffer" type="number" min="0" placeholder="10" inputmode="numeric"/><div class="fine">Recovery time. Overrides global default.</div></div>
    </div>

    <div class="fld"><label>Description</label><textarea id="fDesc" placeholder="Two lines shown to clients on the booking page."></textarea></div>

    <div class="row2">
      <div class="fld">
        <label>Deposit override</label>
        <select id="fDepType">
          <option value="">Use policy default</option>
          <option value="percent">Percent of service</option>
          <option value="fixed">Fixed amount</option>
          <option value="none">No deposit</option>
        </select>
        <div class="fine">Overrides Banking → Policies for this service only.</div>
      </div>
      <div class="fld"><label>Deposit amount</label><input id="fDepAmt" type="number" min="0" placeholder="25" inputmode="numeric"/></div>
    </div>

    <div class="macts">
      <button onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="save()" id="saveBtn">Save service</button>
    </div>
    <div class="err" id="err"></div>
  </div>
</div>

<script src="auth-guard.js"></script>
<script src="lola-notify.js"></script>
<script src="lola-data.js"></script>
<script src="sidebar.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════
   Services — data + interactivity.
   ═══════════════════════════════════════════════════════════════ */

let SVCS = [];
let editId = null;
let photoData = '';
let FILTER = 'All';
let QUERY = '';

const $ = id => document.getElementById(id);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function authToken(){
  try{
    const auth = await window.LolaAuth.ready;
    return auth?.token || localStorage.getItem('loladesk_token') || '';
  }catch(e){ return localStorage.getItem('loladesk_token') || ''; }
}
function hdr(t){ return { Authorization: 'Bearer ' + t }; }

async function load(){
  try{
    const tok = await authToken();
    const r = await fetch('/api/services', { headers: hdr(tok) });
    const d = await r.json().catch(()=>({}));
    SVCS = d.ok ? (d.services || []) : [];
  }catch(e){ SVCS = []; }
  render();
}

function catOf(s){ return s.category || 'Uncategorized'; }
function priceFmt(s){
  if(s.price == null) return 'Free';
  const n = Number(s.price);
  if(!n) return 'Free';
  return '$' + n.toLocaleString();
}
function isPremium(s){ return Number(s.price||0) >= 250; }
function activeList(){ return SVCS.filter(s => s.is_active !== false); }

function narrative(){
  const list = activeList();
  const t = list.length;
  if(!t) return "No services yet. Add your first service and Lola will start quoting it on every call.";
  const cats = new Set(list.map(catOf));
  const revenue = list.reduce((s,x) => s + Number(x.price||0), 0);
  return `<b>${t}</b> service${t===1?'':'s'} across <b>${cats.size}</b> categor${cats.size===1?'y':'ies'}. Menu total value: <b>$${revenue.toLocaleString()}</b>.`;
}

function paintChips(){
  const cats = ['All'];
  const seen = new Set();
  activeList().forEach(s => { const c = catOf(s); if(!seen.has(c)){ seen.add(c); cats.push(c); } });
  const counts = { All: activeList().length };
  activeList().forEach(s => { const c = catOf(s); counts[c] = (counts[c]||0)+1; });
  $('chipRow').innerHTML = cats.map(c => `
    <button class="chip ${c===FILTER?'on':''}" data-cat="${esc(c)}" onclick="setFilter('${esc(c).replace(/'/g,"\\'")}')" role="tab" aria-selected="${c===FILTER?'true':'false'}">
      ${esc(c)} <span class="chip-count">${counts[c]||0}</span>
    </button>`).join('');
}

function filterList(){
  let list = activeList();
  if(FILTER !== 'All') list = list.filter(s => catOf(s) === FILTER);
  if(QUERY){
    const q = QUERY.toLowerCase();
    list = list.filter(s => [s.name, s.description, s.category].some(v => String(v||'').toLowerCase().includes(q)));
  }
  return list.sort((a,b) => (Number(a.sort_order||9999) - Number(b.sort_order||9999)) || String(a.name||'').localeCompare(String(b.name||'')));
}

function cardHtml(s){
  const dur = s.duration_minutes || 60;
  const desc = s.description ? `<div class="svc-desc">${esc(s.description)}</div>` : '';
  const tags = Array.isArray(s.tags) && s.tags.length
    ? `<div class="svc-tags">${s.tags.map(t => `<span class="svc-tag">${esc(t)}</span>`).join('')}</div>`
    : '';
  const photo = s.photo_url
    ? `<div class="svc-photo"><img src="${esc(s.photo_url)}" alt=""></div>`
    : `<div class="svc-photo empty">No photo</div>`;
  return `
    <div class="svc-card ${isPremium(s)?'premium':''}" role="listitem" tabindex="0"
         onclick="edit('${esc(s.id)}')"
         onkeydown="if(event.key==='Enter'||event.key===' '){edit('${esc(s.id)}');event.preventDefault()}">
      ${photo}
      <div class="svc-cat">${esc(catOf(s))}</div>
      <div class="svc-name">${esc(s.name || 'Untitled')}</div>
      <div class="svc-price ${!Number(s.price||0)?'free':''}">${priceFmt(s)}</div>
      <div class="svc-meta">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        ${dur} min
      </div>
      ${desc}
      ${tags}
      <div class="svc-acts" onclick="event.stopPropagation()">
        <button class="sbtn" onclick="edit('${esc(s.id)}')">Edit</button>
        <button class="sbtn danger" onclick="del('${esc(s.id)}')">Remove</button>
      </div>
    </div>`;
}

function render(){
  $('narrativeLine').innerHTML = narrative();
  paintChips();
  const list = filterList();
  const host = $('svcGrid');
  if(!activeList().length){
    host.innerHTML = `
      <div class="empty-state">
        <div class="empty-orb">L</div>
        <div class="empty-title">No services yet</div>
        <div class="empty-sub">Add your services so clients can book online and Lola can quote prices on every call.</div>
        <button class="btn btn-primary" onclick="openForm()" style="margin-top:8px">Add your first service</button>
      </div>`;
    return;
  }
  if(!list.length){
    host.innerHTML = `<div class="empty-state"><div class="empty-title">Nothing matches</div><div class="empty-sub">Clear the filter or search.</div></div>`;
    return;
  }
  host.innerHTML = list.map(cardHtml).join('');
}

function setFilter(cat){
  FILTER = cat;
  render();
}
function setQuery(q){ QUERY = String(q||'').trim(); render(); }

/* ── MODAL ────────────────────────────────────────────────── */
function openForm(){
  editId = null;
  photoData = '';
  $('mTitle').textContent = 'Add service';
  $('fName').value = '';
  $('fCategory').value = 'Hair';
  $('fDur').value = '60';
  $('fPrice').value = '';
  $('fBuffer').value = '10';
  $('fDesc').value = '';
  $('fDepType').value = '';
  $('fDepAmt').value = '';
  $('photoPreview').textContent = 'Photo';
  $('err').textContent = '';
  $('modal').classList.add('open');
  setTimeout(() => $('fName').focus(), 60);
}
function edit(id){
  const s = SVCS.find(x => x.id === id);
  if(!s) return;
  editId = id;
  photoData = '';
  $('mTitle').textContent = 'Edit service';
  $('fName').value = s.name || '';
  $('fCategory').value = catOf(s);
  $('fDur').value = s.duration_minutes || 60;
  $('fPrice').value = s.price != null ? s.price : '';
  $('fBuffer').value = s.buffer_after_min != null ? s.buffer_after_min : '';
  $('fDesc').value = s.description || '';
  $('fDepType').value = s.deposit_override_type || '';
  $('fDepAmt').value = s.deposit_override_amount || '';
  $('photoPreview').innerHTML = s.photo_url ? `<img src="${esc(s.photo_url)}" alt="">` : 'Photo';
  $('err').textContent = '';
  $('modal').classList.add('open');
  setTimeout(() => $('fName').focus(), 60);
}
function closeModal(){ $('modal').classList.remove('open'); }

$('photoInput').onchange = () => {
  const f = $('photoInput').files[0];
  if(!f) return;
  if(f.size > 2097152){ $('err').textContent = 'Photo must be 2 MB or smaller.'; return; }
  const reader = new FileReader();
  reader.onload = () => { photoData = reader.result; $('photoPreview').innerHTML = `<img src="${reader.result}" alt="">`; };
  reader.readAsDataURL(f);
};

async function save(){
  const name = $('fName').value.trim();
  const err = $('err');
  if(!name){ err.textContent = 'Name is required.'; err.className = 'err'; return; }
  err.textContent = '';
  const btn = $('saveBtn');
  btn.disabled = true;
  const prev = btn.textContent;
  btn.textContent = 'Saving…';
  try{
    const tok = await authToken();
    const body = {
      id: editId || undefined,
      name,
      category: $('fCategory').value,
      duration_minutes: Number($('fDur').value || 60),
      price: $('fPrice').value !== '' ? Number($('fPrice').value) : 0,
      description: $('fDesc').value.trim(),
      buffer_after_min: $('fBuffer').value !== '' ? Number($('fBuffer').value) : null,
      deposit_override_type: $('fDepType').value || null,
      deposit_override_amount: $('fDepAmt').value !== '' ? Number($('fDepAmt').value) : null
    };
    if(photoData) body.photo_data_url = photoData;
    const r = await fetch('/api/services', { method:'POST', headers:{ ...hdr(tok), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    const d = await r.json().catch(()=>({}));
    if(!d.ok) throw new Error(d.error || 'Save failed');
    if(!editId && typeof window.lolaPulse === 'function') window.lolaPulse('Service added — Lola can quote it now');
    err.textContent = 'Saved.';
    err.className = 'err ok';
    setTimeout(closeModal, 600);
    await load();
  }catch(e){
    err.textContent = e.message || 'Something went wrong.';
    err.className = 'err';
  }finally{
    btn.disabled = false; btn.textContent = prev;
  }
}

async function del(id){
  if(!confirm('Remove this service? Clients will no longer see it in booking.')) return;
  try{
    const tok = await authToken();
    await fetch('/api/services?id='+encodeURIComponent(id), { method:'DELETE', headers: hdr(tok) });
    load();
  }catch(e){ alert(e.message); }
}

/* Click outside modal to close */
$('modal').addEventListener('click', e => { if(e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('modal').classList.contains('open')) closeModal(); });

(async () => { load(); })();
</script>
