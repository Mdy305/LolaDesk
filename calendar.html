<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>Today · LolaDesk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/calendar.css">
</head>
<body>

<!-- The Atom — lives top-right, always -->
<button id="atom" class="atom" aria-label="Talk to Lola">
  <canvas id="atomCanvas" width="120" height="120"></canvas>
</button>

<!-- Fullscreen overlay when the atom is engaged -->
<div id="atomOverlay" class="atom-overlay" aria-hidden="true">
  <button id="atomOverlayClose" class="atom-overlay-close" aria-label="Close">&times;</button>
  <div id="atomTranscript" class="atom-transcript"></div>
  <div id="atomCaption" class="atom-caption">Listening&hellip;</div>
</div>

<!-- Calendar view -->
<main class="day">
  <header class="day-head">
    <div class="day-label">Today</div>
    <div id="dayDate" class="day-date">&mdash;</div>
    <nav class="day-nav">
      <button id="navPrev" class="day-nav-btn" aria-label="Previous day">&larr;</button>
      <button id="navToday" class="day-nav-btn day-nav-today">Today</button>
      <button id="navNext" class="day-nav-btn" aria-label="Next day">&rarr;</button>
    </nav>
  </header>

  <section id="daySummary" class="day-summary" hidden></section>

  <section id="dayAgenda" class="day-agenda">
    <div class="day-loading">Loading&hellip;</div>
  </section>
</main>

<script src="/calendar.js" defer></script>
</body>
</html>
