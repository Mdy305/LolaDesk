<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory · LolaDesk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/design.css">
<style>
.iv-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s-4); margin-bottom: var(--s-5); }
.iv-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); }
.iv-stat .n { font: 700 var(--fs-2xl) var(--ff); letter-spacing: -.02em; }
.iv-stat .k { font: 500 var(--fs-sm) var(--ff); color: var(--text2); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
.iv-row { display: grid; grid-template-columns: 1fr 100px 90px 100px 40px; gap: var(--s-3); padding: var(--s-3); align-items: center; border-radius: var(--r-sm); }
.iv-row:hover { background: var(--surface2); }
.iv-row.low .stock { color: var(--dan); font-weight: 700; }
.iv-row .name { font: 600 var(--fs-base) var(--ff); }
.iv-row .sub { color: var(--text2); font-size: var(--fs-sm); margin-top: 2px; }
@media (max-width: 640px) { .iv-row { grid-template-columns: 1fr 80px; } .iv-row .price, .iv-row .cost, .iv-row .adj { display: none; } }
</style>
</head>
<body data-page="inventory">
<div class="ld-app">
  <aside id="sidebar-mount"></aside>
  <main class="ld-main">
    <header class="ld-page-head">
      <div>
        <h1 class="ld-page-title">Inventory</h1>
        <p class="ld-page-sub">Retail products, stock levels, low-stock alerts.</p>
      </div>
      <button class="ld-btn pri" id="btn-new">＋ New product</button>
    </header>

    <section class="iv-hero" id="hero"></section>

    <section class="ld-card">
      <div class="iv-row" style="font: 600 var(--fs-sm) var(--ff); color: var(--text2); text-transform: uppercase; letter-spacing: .04em">
        <div>Product</div><div style="text-align:right">Price</div><div style="text-align:right">Cost</div><div style="text-align:right">Stock</div><div></div>
      </div>
      <div id="rows"></div>
    </section>
  </main>
</div>
<script src="/auth-guard.js" defer></script>
<script src="/page-shell.js" defer></script>
<script>
(function () {
  const wait = () => new Promise(r => window.LolaShell ? r() : window.addEventListener('lola:shell-ready', r, { once: true }));
  wait().then(main);
  let items = [];
  async function main() {
    const S = window.LolaShell; S.initPage();
    await load();
    document.getElementById('btn-new').onclick = () => edit(null);
  }
  async function load() {
    const S = window.LolaShell;
    const r = await S.fetchJson('/api/inventory');
    items = r.ok ? (r.data?.items || r.data || []) : [];
    render();
  }
  function render() {
    const S = window.LolaShell;
    const value = items.reduce((a, i) => a + (i.stock || 0) * (i.cost_cents || 0), 0);
    const low = items.filter(i => i.stock != null && i.min_stock != null && i.stock <= i.min_stock).length;
    document.getElementById('hero').innerHTML = `
      <div class="iv-stat"><div class="n">${items.length}</div><div class="k">Products</div></div>
      <div class="iv-stat"><div class="n">${S.fmtMoney(value)}</div><div class="k">Stock value</div></div>
      <div class="iv-stat" style="border-color:${low > 0 ? 'rgba(255,69,58,.35)' : 'var(--line)'}"><div class="n" style="color:${low > 0 ? 'var(--dan)' : 'var(--text)'}">${low}</div><div class="k">Low stock</div></div>
    `;
    const rows = document.getElementById('rows');
    if (!items.length) {
      rows.innerHTML = `<div class="ld-empty" style="border:none"><h3>Nothing in stock yet</h3><p>Add your retail products to track stock and sales.</p></div>`;
      return;
    }
    rows.innerHTML = items.map(i => `
      <div class="iv-row ${i.stock != null && i.min_stock != null && i.stock <= i.min_stock ? 'low' : ''}" data-id="${i.id}">
        <div>
          <div class="name">${esc(i.name)}</div>
          <div class="sub">${esc(i.brand || '')} ${i.sku ? '· SKU ' + esc(i.sku) : ''}</div>
        </div>
        <div class="price" style="text-align:right; font: 600 var(--fs-md) var(--ff)">${S.fmtMoney(i.price_cents || 0)}</div>
        <div class="cost" style="text-align:right; color: var(--text2)">${S.fmtMoney(i.cost_cents || 0)}</div>
        <div class="stock" style="text-align:right; font: 700 var(--fs-lg) var(--ff)">${i.stock ?? '—'}</div>
        <div class="adj" style="display:flex;gap:4px">
          <button class="ld-btn ld-btn-icon" data-inc="${i.id}">＋</button>
          <button class="ld-btn ld-btn-icon" data-dec="${i.id}">−</button>
        </div>
      </div>
    `).join('');
    rows.querySelectorAll('.iv-row').forEach(r => r.onclick = (e) => {
      if (e.target.closest('button')) return;
      edit(items.find(i => i.id === r.dataset.id));
    });
    rows.querySelectorAll('[data-inc]').forEach(b => b.onclick = (e) => { e.stopPropagation(); adjust(b.dataset.inc, +1); });
    rows.querySelectorAll('[data-dec]').forEach(b => b.onclick = (e) => { e.stopPropagation(); adjust(b.dataset.dec, -1); });
  }
  async function adjust(id, delta) {
    const S = window.LolaShell;
    const it = items.find(i => i.id === id); if (!it) return;
    const r = await S.api(`/api/inventory/${id}`, { stock: Math.max(0, (it.stock || 0) + delta) }, 'PATCH');
    if (!r.ok) return S.toast('Failed: ' + r.error, 'dan');
    await load();
  }
  async function edit(it) {
    const S = window.LolaShell;
    const isNew = !it;
    const cur = it || { name: '', brand: '', sku: '', price_cents: 0, cost_cents: 0, stock: 0, min_stock: 3 };
    const form = S.el('div');
    form.innerHTML = `
      <label class="ld-label">Name</label>
      <input class="ld-input" id="f-name" value="${escAttr(cur.name || '')}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label class="ld-label">Brand</label><input class="ld-input" id="f-brand" value="${escAttr(cur.brand || '')}"></div>
        <div><label class="ld-label">SKU</label><input class="ld-input" id="f-sku" value="${escAttr(cur.sku || '')}"></div>
        <div><label class="ld-label">Retail price ($)</label><input class="ld-input" type="number" id="f-price" value="${((cur.price_cents||0)/100).toFixed(2)}" step="0.01" min="0"></div>
        <div><label class="ld-label">Cost ($)</label><input class="ld-input" type="number" id="f-cost" value="${((cur.cost_cents||0)/100).toFixed(2)}" step="0.01" min="0"></div>
        <div><label class="ld-label">In stock</label><input class="ld-input" type="number" id="f-stock" value="${cur.stock ?? 0}" min="0"></div>
        <div><label class="ld-label">Low-stock alert at</label><input class="ld-input" type="number" id="f-min" value="${cur.min_stock ?? 3}" min="0"></div>
      </div>
    `;
    const actions = [{ label: 'Cancel', value: null }];
    if (!isNew) actions.push({ label: 'Delete', danger: true, onClick: async () => {
      if (!await S.confirm('Delete this product?', { danger: true, confirmLabel: 'Delete' })) return;
      const r = await S.api(`/api/inventory/${it.id}`, {}, 'DELETE');
      if (!r.ok) return S.toast('Delete failed: ' + r.error, 'dan');
      S.toast('Deleted'); await load(); return null;
    }});
    actions.push({ label: isNew ? 'Add' : 'Save', primary: true, onClick: async () => {
      const p = {
        name: form.querySelector('#f-name').value.trim(),
        brand: form.querySelector('#f-brand').value.trim() || null,
        sku: form.querySelector('#f-sku').value.trim() || null,
        price_cents: Math.round(parseFloat(form.querySelector('#f-price').value || '0') * 100),
        cost_cents: Math.round(parseFloat(form.querySelector('#f-cost').value || '0') * 100),
        stock: parseInt(form.querySelector('#f-stock').value, 10) || 0,
        min_stock: parseInt(form.querySelector('#f-min').value, 10) || 0,
      };
      if (!p.name) return S.toast('Name required', 'dan');
      const r = isNew ? await S.api('/api/inventory', p) : await S.api(`/api/inventory/${it.id}`, p, 'PATCH');
      if (!r.ok) return S.toast('Save failed: ' + r.error, 'dan');
      S.toast('Saved'); await load(); return null;
    }});
    S.dialog({ title: isNew ? 'New product' : 'Edit ' + cur.name, body: form, actions });
  }
})();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s) { return esc(s); }
</script>
</body>
</html>
