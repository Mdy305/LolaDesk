<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews · LolaDesk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/design.css">
<style>
.rv-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--s-4); margin-bottom: var(--s-5); }
.rv-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--s-4); }
.rv-stat .n { font: 700 var(--fs-3xl) var(--ff); letter-spacing: -.03em; color: var(--accent); }
.rv-stat .k { font: 500 var(--fs-sm) var(--ff); color: var(--text2); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }

.rv-card { display: flex; flex-direction: column; gap: var(--s-2); }
.rv-head { display: flex; justify-content: space-between; gap: var(--s-3); align-items: baseline; }
.rv-name { font: 600 var(--fs-base) var(--ff); }
.rv-src { font: 500 var(--fs-sm) var(--ff); color: var(--text2); }
.rv-stars { color: var(--warn); letter-spacing: 2px; font-size: var(--fs-md); }
.rv-body { color: var(--text); font-size: var(--fs-md); line-height: 1.5; }
.rv-actions { display: flex; gap: 8px; margin-top: var(--s-2); }
</style>
</head>
<body data-page="reviews">
<div class="ld-app">
  <aside id="sidebar-mount"></aside>
  <main class="ld-main">
    <header class="ld-page-head">
      <div>
        <h1 class="ld-page-title">Reviews</h1>
        <p class="ld-page-sub">Google · Yelp · your own site — one place to reply.</p>
      </div>
      <button class="ld-btn pri" id="btn-request">Ask for reviews</button>
    </header>

    <section class="rv-hero" id="hero"></section>

    <div style="display:flex;gap:8px;margin-bottom:var(--s-4);flex-wrap:wrap" id="filters">
      <button class="ld-btn pri" data-f="all">All</button>
      <button class="ld-btn" data-f="unreplied">Needs reply</button>
      <button class="ld-btn" data-f="5">5 star</button>
      <button class="ld-btn" data-f="low">1–3 star</button>
    </div>

    <section class="ld-grid ld-grid-2" id="list"></section>
  </main>
</div>
<script src="/auth-guard.js" defer></script>
<script src="/page-shell.js" defer></script>
<script>
(function () {
  const wait = () => new Promise(r => window.LolaShell ? r() : window.addEventListener('lola:shell-ready', r, { once: true }));
  wait().then(main);
  let reviews = []; let filter = 'all';
  async function main() {
    const S = window.LolaShell; S.initPage();
    const r = await S.fetchJson('/api/reviews');
    reviews = r.ok ? (r.data?.reviews || r.data || []) : [];
    renderHero(); render();
    document.querySelectorAll('#filters .ld-btn').forEach(b => b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll('#filters .ld-btn').forEach(x => x.classList.remove('pri'));
      b.classList.add('pri'); render();
    });
    document.getElementById('btn-request').onclick = async () => {
      const r2 = await S.api('/api/reviews/request-batch', {});
      if (!r2.ok) return S.toast('Failed: ' + r2.error, 'dan');
      S.toast(`Requested from ${r2.data?.sent || 0} recent clients`, 'ok');
    };
  }

  function renderHero() {
    const avg = reviews.length ? reviews.reduce((a, r) => a + (r.rating || 0), 0) / reviews.length : 0;
    const un = reviews.filter(r => !r.reply).length;
    const p5 = reviews.filter(r => r.rating === 5).length;
    const low = reviews.filter(r => r.rating && r.rating <= 3).length;
    document.getElementById('hero').innerHTML = `
      <div class="rv-stat"><div class="n">${avg ? avg.toFixed(1) : '—'}</div><div class="k">Average</div></div>
      <div class="rv-stat"><div class="n">${reviews.length}</div><div class="k">Total</div></div>
      <div class="rv-stat"><div class="n">${un}</div><div class="k">Needs reply</div></div>
      <div class="rv-stat"><div class="n">${p5}</div><div class="k">5 stars</div></div>
      <div class="rv-stat" style="border-color:${low > 0 ? 'rgba(255,69,58,.35)' : 'var(--line)'}"><div class="n" style="color:${low > 0 ? 'var(--dan)' : 'var(--text2)'}">${low}</div><div class="k">Needs care</div></div>
    `;
  }

  function render() {
    const list = document.getElementById('list');
    let f = reviews.slice();
    if (filter === 'unreplied') f = f.filter(r => !r.reply);
    else if (filter === '5') f = f.filter(r => r.rating === 5);
    else if (filter === 'low') f = f.filter(r => r.rating <= 3);
    if (!f.length) {
      list.innerHTML = `<div class="ld-empty" style="grid-column:1/-1"><h3>Nothing here yet</h3><p>${filter === 'all' ? 'Reviews from Google & Yelp appear here once you connect them.' : 'No reviews match this filter.'}</p></div>`;
      return;
    }
    list.innerHTML = f.map(r => `
      <div class="ld-card rv-card">
        <div class="rv-head">
          <div>
            <div class="rv-name">${esc(r.author || 'Anonymous')}</div>
            <div class="rv-src">${esc(r.source || 'Website')} · ${r.created_at ? new Date(r.created_at).toLocaleDateString() : ''}</div>
          </div>
          <div class="rv-stars">${'★'.repeat(r.rating || 0)}${'☆'.repeat(5 - (r.rating || 0))}</div>
        </div>
        <div class="rv-body">${esc(r.body || '')}</div>
        ${r.reply ? `<div style="padding: 10px 14px; background: var(--surface2); border-radius: var(--r-sm); font-size: var(--fs-md); margin-top: 6px"><div style="font: 600 var(--fs-sm) var(--ff); color: var(--accent); margin-bottom: 4px">Your reply</div>${esc(r.reply)}</div>` : ''}
        <div class="rv-actions">
          ${!r.reply ? `<button class="ld-btn pri" data-reply="${r.id}">Reply</button>` : ''}
          <button class="ld-btn" data-open="${r.id}">Open</button>
        </div>
      </div>
    `).join('');
    list.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => reply(b.dataset.reply));
  }

  async function reply(id) {
    const S = window.LolaShell;
    const rv = reviews.find(r => r.id === id);
    const form = S.el('div');
    form.innerHTML = `
      <div style="margin-bottom: 12px; padding: 12px; background: var(--surface2); border-radius: var(--r-sm); font-size: var(--fs-md); color: var(--text2)">${esc(rv?.body || '')}</div>
      <label class="ld-label">Your reply</label>
      <textarea class="ld-textarea" id="r-text" rows="4" placeholder="Thank them personally — mention what they got, invite them back."></textarea>
      <button class="ld-btn ghost" style="margin-top: 8px" id="r-ai">✨ Draft with Lola</button>
    `;
    S.dialog({
      title: 'Reply to ' + (rv?.author || 'review'),
      body: form,
      actions: [
        { label: 'Cancel', value: null },
        { label: 'Post reply', primary: true, onClick: async () => {
          const text = form.querySelector('#r-text').value.trim();
          if (!text) return S.toast('Write a reply', 'dan');
          const r = await S.api(`/api/reviews/${id}/reply`, { text });
          if (!r.ok) return S.toast('Reply failed: ' + r.error, 'dan');
          S.toast('Reply posted', 'ok');
          location.reload(); return null;
        }},
      ],
    });
    form.querySelector('#r-ai').onclick = async () => {
      form.querySelector('#r-ai').disabled = true;
      form.querySelector('#r-ai').textContent = 'Thinking…';
      const r = await S.api(`/api/reviews/${id}/draft-reply`, {});
      form.querySelector('#r-ai').disabled = false;
      form.querySelector('#r-ai').textContent = '✨ Draft with Lola';
      if (r.ok && r.data?.reply) form.querySelector('#r-text').value = r.data.reply;
      else S.toast('Draft failed: ' + (r.error || 'try again'), 'dan');
    };
  }
})();
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
