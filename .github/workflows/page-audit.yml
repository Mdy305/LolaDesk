name: Page audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - id: audit
        shell: bash
        run: |
          set +e
          find api e2e -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check > audit-output.txt 2>&1
          syntax_code=$?
          npm run build >> audit-output.txt 2>&1
          build_code=$?
          code=$(( syntax_code != 0 || build_code != 0 ))
          cat audit-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.audit.outputs.code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit-output.txt','utf8').slice(-50000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Page audit failed\n\n\`\`\`text\n${output}\n\`\`\``
            });
      - if: steps.audit.outputs.code != '0'
        run: exit 1
