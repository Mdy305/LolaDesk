name: Public Launch Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: public-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-integrity:
    name: Code integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate serverless JavaScript syntax
        run: |
          find api e2e -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
      - name: Verify production build contract
        run: npm run build

  tenant-journey:
    name: Tenant-safe end-to-end journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loladesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loladesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: loladesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: schema
        name: Initialize tenant schema
        shell: bash
        run: |
          set +e
          {
            psql -v ON_ERROR_STOP=1 -f schema.sql
            psql -v ON_ERROR_STOP=1 -f migrations/20260623_tenant_users.sql
            psql -v ON_ERROR_STOP=1 -f migrations/20260701_complete_supabase_wiring.sql
            psql -v ON_ERROR_STOP=1 -f migrations/20260724_onboarding_state.sql
          } > schema-output.txt 2>&1
          code=$?
          cat schema-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.schema.outputs.code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('schema-output.txt','utf8').slice(-50000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`## Schema initialization failed\n\n\`\`\`text\n${output}\n\`\`\``});
      - if: steps.schema.outputs.code != '0'
        run: exit 1
      - id: journey
        name: Run complete launch-readiness journey
        shell: bash
        run: |
          set +e
          npm run test:e2e > e2e-output.txt 2>&1
          code=$?
          cat e2e-output.txt
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - if: steps.journey.outputs.code != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('e2e-output.txt','utf8').slice(-50000);
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body:`## Tenant journey failed\n\n\`\`\`text\n${output}\n\`\`\``});
      - if: steps.journey.outputs.code != '0'
        run: exit 1
