<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Team — LolaDesk</title><link rel="stylesheet" href="app.css"/><style>.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}.head h1{font-size:32px}.head p{color:var(--text3);font-size:13px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.member{border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:18px}.member-top{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:600}.name{font-weight:600}.role{font-size:12px;color:var(--text3)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{font-size:10px;padding:5px 8px;border:1px solid var(--border);border-radius:99px;color:var(--text2)}.member-actions{display:flex;gap:8px;margin-top:16px}.small{padding:8px 10px;font-size:11px;border:1px solid var(--border);border-radius:10px}.empty{padding:70px 20px;text-align:center;color:var(--text3);border:1px dashed var(--border);border-radius:18px}.modal-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);backdrop-filter:blur(12px);z-index:100}.modal-wrap.open{display:flex}.modal{width:min(430px,calc(100% - 32px));background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:22px}.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}.field label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}.field input{height:42px;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);padding:0 12px}.actions{display:flex;gap:10px;margin-top:18px}.status{font-size:12px;color:var(--text3);margin-top:10px}</style></head><body data-page="team"><div class="app"><main class="main"><div class="head"><div><h1>Team</h1><p>Staff, services and schedules for this workspace.</p></div><button class="btn btn-primary" onclick="openAdd()">Add team member</button></div><div class="grid" id="teamGrid"><div class="empty">Loading team…</div></div></main></div><div class="modal-wrap" id="modal"><div class="modal"><h2>Add team member</h2><div class="field"><label>Name</label><input id="memberName"/></div><div class="field"><label>Role</label><input id="memberRole" placeholder="Stylist, provider, specialist…"/></div><div class="actions"><button class="btn btn-primary" onclick="saveMember()">Add member</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div><div class="status" id="status"></div></div></div><script src="auth-guard.js"></script><script src="lola-data.js"></script><script src="sidebar.js"></script><script>
let data={staff:[],staff_services:[],schedules:[],time_off:[]};function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(method='GET',body=null){if(window.LolaAuth?.ready)await window.LolaAuth.ready;const r=await fetch('/api/stylists',{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{data=await api();render()}catch(e){teamGrid.innerHTML='<div class="empty">Team unavailable: '+esc(e.message)+'</div>'}}function render(){if(!data.staff?.length){teamGrid.innerHTML='<div class="empty">No active team members yet.</div>';return}teamGrid.innerHTML=data.staff.map(m=>{const serviceCount=(data.staff_services||[]).filter(x=>x.staff_id===m.id).length;const scheduleCount=(data.schedules||[]).filter(x=>x.staff_id===m.id).length;return `<div class="member"><div class="member-top"><div class="avatar">${esc((m.name||'?').slice(0,1).toUpperCase())}</div><div><div class="name">${esc(m.name)}</div><div class="role">${esc(m.role||'Team member')}</div></div></div><div class="meta"><span class="pill">${serviceCount} service${serviceCount===1?'':'s'}</span><span class="pill">${scheduleCount} schedule rule${scheduleCount===1?'':'s'}</span></div><div class="member-actions"><button class="small" onclick="editMember('${m.id}')">Edit</button><button class="small" onclick="deactivate('${m.id}')">Deactivate</button></div></div>`}).join('')}function openAdd(){memberName.value='';memberRole.value='';status.textContent='';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}async function saveMember(){status.textContent='Saving…';try{await api('POST',{name:memberName.value.trim(),role:memberRole.value.trim()||'Team member'});closeModal();await load()}catch(e){status.textContent=e.message}}async function deactivate(id){if(!confirm('Deactivate this team member?'))return;try{await api('DELETE',{id});await load()}catch(e){alert(e.message)}}async function editMember(id){const m=data.staff.find(x=>x.id===id);if(!m)return;const name=prompt('Name',m.name);if(name===null)return;const role=prompt('Role',m.role||'Team member');if(role===null)return;try{await api('PATCH',{id,name,role});await load()}catch(e){alert(e.message)}}load();
</script></body></html>
