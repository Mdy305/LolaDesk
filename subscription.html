<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Billing — LolaDesk</title><link rel="stylesheet" href="app.css"/>
<style>
.banner{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.banner.warn{border-color:#ffc04344;background:linear-gradient(180deg,rgba(255,192,67,.06),transparent)}
.banner.danger{border-color:#ff6b6b44;background:linear-gradient(180deg,rgba(255,107,107,.06),transparent)}
.banner h3{font-size:17px;font-weight:600;margin-bottom:4px}
.banner p{font-size:13px;color:var(--text3);line-height:1.6}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
@media(max-width:900px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:.5px solid var(--border);border-radius:20px;padding:26px;display:flex;flex-direction:column;transition:.2s}
.plan.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan.featured{border-color:var(--text2)}
.plan-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px;min-height:14px}
.plan-name{font-size:20px;font-weight:600;margin-bottom:6px}
.plan-price{font-size:38px;font-weight:300;letter-spacing:-.03em;margin-bottom:2px}
.plan-price span{font-size:14px;color:var(--text3);font-weight:400}
.plan-feat{list-style:none;padding:0;margin:20px 0;flex:1}
.plan-feat li{font-size:13px;color:var(--text2);padding:7px 0;padding-left:22px;position:relative;line-height:1.5}
.plan-feat li:before{content:'';position:absolute;left:0;top:13px;width:12px;height:2px;background:var(--accent);border-radius:2px}
.plan-btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.plan-btn.primary{background:var(--text);color:#080809}
.plan-btn.ghost{background:transparent;border:.5px solid var(--border);color:var(--text2)}
.plan-btn:disabled{opacity:.4;cursor:not-allowed}
.usage{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:900px){.usage{grid-template-columns:repeat(2,1fr)}}
.u-card{background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:18px}
.u-val{font-size:26px;font-weight:300;letter-spacing:-.02em}
.u-lbl{font-size:11.5px;color:var(--text3);margin-top:3px}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:600;margin-bottom:6px}
.card .desc{font-size:12.5px;color:var(--text3);margin-bottom:16px;line-height:1.6}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-g{background:transparent;border:.5px solid var(--border);color:var(--text2);border-radius:11px;padding:11px 18px;font-size:13.5px;cursor:pointer;font-family:inherit}
.msg{font-size:12.5px;margin-top:12px;min-height:18px}
.msg.ok{color:var(--accent2)}.msg.err{color:#ff8a8a}
</style>
</head>
<body data-page="subscription">
<div class="app"><main class="main">
<div class="page-head">
  <div><h1 class="page-title">Billing</h1>
  <p style="font-size:13px;color:var(--text3);margin-top:4px">Your plan, usage, and payment method.</p></div>
</div>

<div id="statusBanner"></div>

<div class="usage" id="usageGrid"></div>
<div id="lolaBooked"></div>
<div id="referralCard"></div>

<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 14px">
  <h2 style="font-size:15px;font-weight:600;margin:0">Plans</h2>
  <div class="cycle" role="group" aria-label="Billing cycle" style="display:flex;gap:4px;background:var(--surface);border:.5px solid var(--border);border-radius:999px;padding:3px">
    <button type="button" id="cyM" onclick="setCycle('monthly')" style="border:none;border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer">Monthly</button>
    <button type="button" id="cyY" onclick="setCycle('annual')" style="border:none;border-radius:999px;padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer">Annual · 2 months free</button>
  </div>
</div>
<div class="plans" id="plansGrid"></div>

<div class="card">
  <h3>Payment method &amp; invoices</h3>
  <div class="desc">Update your card, download invoices, or change your billing address.</div>
  <div class="btn-row">
    <button class="btn-g" onclick="openPortal()">Manage billing</button>
    <button class="btn-g" id="cancelBtn" onclick="cancelSub()" style="display:none">Cancel subscription</button>
    <button class="btn-g" id="resumeBtn" onclick="resumeSub()" style="display:none">Resume subscription</button>
  </div>
  <div class="msg" id="portalMsg"></div>
</div>

</main></div>
<script src="auth-guard.js"></script><script src="sidebar.js"></script>
<script>
let STATE={}, PLANS=[], CYCLE='monthly';
function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||'';}
function H(){return{'Content-Type':'application/json',Authorization:'Bearer '+token()};}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(id,t,ok){const e=document.getElementById(id);if(e){e.textContent=t;e.className='msg '+(ok?'ok':'err');}}

async function load(){
  try{
    const [sr,pr]=await Promise.all([
      fetch('/api/billing?action=status',{headers:H()}).then(r=>r.json()),
      fetch('/api/billing?action=plans',{headers:H()}).then(r=>r.json())
    ]);
    if(!sr.ok)throw new Error(sr.error||'Could not load billing');
    STATE=sr;
    renderBanner(sr);
    renderUsage(sr.usage||{});
    renderLolaBooked(sr.lola_bookings, sr.status);
    renderReferral(sr.referral);
    PLANS=pr.plans||[]; if(sr.interval==='annual'&&sr.has_subscription) CYCLE='annual';
    renderPlans(PLANS,sr);
    document.getElementById('cancelBtn').style.display=(sr.has_subscription&&!sr.cancel_at_period_end&&sr.status!=='canceled')?'':'none';
    document.getElementById('resumeBtn').style.display=sr.cancel_at_period_end?'':'none';
  }catch(e){
    document.getElementById('statusBanner').innerHTML='<div class="banner danger"><div><h3>Billing unavailable</h3><p>'+esc(e.message)+'</p></div></div>';
  }
}

function renderBanner(s){
  const b=document.getElementById('statusBanner');
  if(s.service&&s.service.ok===false){
    b.innerHTML='<div class="banner danger"><div><h3>Lola is paused</h3><p>Lola is paused because '+esc(s.service.paused_because||'your plan is inactive')+'. Pick a plan below and she is back on right away.</p></div></div>';
    return;
  }
  if(!s.stripe_configured){
    b.innerHTML='<div class="banner warn"><div><h3>Stripe not connected</h3><p>Add STRIPE_SECRET_KEY in Vercel to enable billing.</p></div></div>';
    return;
  }
  if(s.status==='trialing'){
    const d=s.trial_days_left;
    b.innerHTML='<div class="banner'+(d<=3?' warn':'')+'"><div><h3>'+d+' day'+(d===1?'':'s')+' left in your trial</h3>'+
      '<p>Pick a plan below to keep Lola answering your calls without interruption.</p></div></div>';
  }else if(s.status==='active'||s.status==='canceling'){
    const end=s.current_period_end?new Date(s.current_period_end).toLocaleDateString():'';
    b.innerHTML='<div class="banner"><div><h3>'+esc(s.plan_details?.name||s.plan)+' plan — active</h3>'+
      '<p>'+(s.cancel_at_period_end?'Ends on '+end:'Renews '+end)+'</p></div></div>';
  }else if(s.status==='past_due'){
    const g=s.service&&s.service.grace_until?' Lola keeps working until '+new Date(s.service.grace_until).toLocaleDateString()+' while Stripe retries.':'';
    b.innerHTML='<div class="banner danger"><div><h3>Payment failed</h3><p>Update your card to keep Lola running.'+esc(g)+'</p></div>'+
      '<button class="plan-btn primary" style="width:auto;padding:11px 20px" onclick="openPortal()">Update card</button></div>';
  }else if(s.status==='canceled'){
    b.innerHTML='<div class="banner danger"><div><h3>Subscription canceled</h3><p>Choose a plan to reactivate Lola.</p></div></div>';
  }
}

function renderUsage(u){
  document.getElementById('usageGrid').innerHTML=
    '<div class="u-card"><div class="u-val">'+(u.calls_handled||0)+'</div><div class="u-lbl">Calls handled</div></div>'+
    '<div class="u-card"><div class="u-val">'+(u.bookings_made||0)+'</div><div class="u-lbl">Bookings made</div></div>'+
    '<div class="u-card"><div class="u-val">'+(u.sms_sent||0)+'</div><div class="u-lbl">Texts sent</div></div>'+
    '<div class="u-card"><div class="u-val">'+Math.round(u.minutes_used||0)+'</div><div class="u-lbl">Minutes used</div></div>';
}

// Lola's bookings this month and LolaDesk's per-appointment fee — the ROI in one line.
function renderLolaBooked(f, status){
  const el=document.getElementById('lolaBooked');
  if(!el) return;
  if(!f||!f.ready){ el.innerHTML=''; return; }
  const money=(n)=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
  const cents=(n)=>'$'+(Number(n||0)/100).toFixed(2);
  const p=f.policy||{};
  const price=(p.flat_cents?cents(p.flat_cents):'')+(p.percent?(p.flat_cents?' + ':'')+p.percent+'%':'');
  const trial=status==='trialing';
  const fee=trial?'Free during your trial'+(f.waived_cents?' ('+cents(f.waived_cents)+' waived)':''):cents(f.fees_cents)+' this month';
  el.innerHTML='<div class="card" style="margin-bottom:20px"><h3>Lola booked for you</h3>'+
    '<div class="desc">'+(f.lola_bookings||0)+' appointment'+(f.lola_bookings===1?'':'s')+' this month from calls, texts, your website and campaigns — '+money(f.lola_revenue)+' in bookings.</div>'+
    '<div class="desc" style="margin-top:6px">LolaDesk fee'+(price?' ('+price+' per appointment Lola books, only if it happens)':'')+': <b>'+fee+'</b>. Cancelled and no-show appointments are never charged; bookings you add yourself are always free.</div></div>';
}

function setCycle(c){ CYCLE=c; renderPlans(PLANS,STATE); }
function renderPlans(plans,s){
  const on='background:var(--text);color:#080809', offc='background:transparent;color:var(--text2)';
  const m=document.getElementById('cyM'), y=document.getElementById('cyY');
  if(m&&y){ m.style.cssText+=';'+(CYCLE==='monthly'?on:offc); y.style.cssText+=';'+(CYCLE==='annual'?on:offc); }
  const paying=!!s.has_subscription&&s.status!=='canceled';
  document.getElementById('plansGrid').innerHTML=plans.map(p=>{
    const current=paying&&s.plan===p.id&&(s.interval||'monthly')===CYCLE&&!s.cancel_at_period_end;
    const amt=CYCLE==='annual'?(p.annual_display||p.price_display):p.price_display;
    const sub=CYCLE==='annual'?'<div style="font-size:12px;color:var(--text3)">billed $'+((p.annual_cents||0)/100).toLocaleString()+' yearly</div>':'';
    const label=current?'Current plan':(paying?'Switch to '+esc(p.name):'Start '+esc(p.name));
    return '<div class="plan'+(current?' current':'')+(p.id==='pro'?' featured':'')+'">'+
      '<div class="plan-tag">'+(current?'Your plan':(p.id==='pro'?'Most popular':''))+'</div>'+
      '<div class="plan-name">'+esc(p.name)+'</div>'+
      '<div class="plan-price">'+esc(amt)+'<span>/mo</span></div>'+sub+
      '<ul class="plan-feat">'+p.features.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'+
      '<button class="plan-btn '+(current?'ghost':'primary')+'" '+(current?'disabled':'')+
      ' onclick="subscribe(\''+p.id+'\')">'+label+'</button>'+
      '</div>';
  }).join('');
}

async function subscribe(plan){
  const paying=!!STATE.has_subscription&&STATE.status!=='canceled';
  if(paying){
    const p=PLANS.find(x=>x.id===plan)||{name:plan};
    if(!confirm('Switch your subscription to '+p.name+(CYCLE==='annual'?' (annual)':'')+'? Stripe prorates the difference on your next invoice.'))return;
  }
  msg('portalMsg',paying?'Switching your plan...':'Opening secure checkout...',true);
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:paying?'switch':'checkout',plan,interval:CYCLE})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Checkout failed');
    if(d.url){ location.href=d.url; return; }
    msg('portalMsg',d.message||'Plan updated.',true); load();
  }catch(e){msg('portalMsg',e.message,false);}
}

async function openPortal(){
  msg('portalMsg','Opening billing portal...',true);
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'portal'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Could not open portal');
    location.href=d.url;
  }catch(e){msg('portalMsg',e.message,false);}
}

// Give a month, get a month: the salon's own link, one tap to copy (lib/referrals.js).
function renderReferral(r){
  const el=document.getElementById('referralCard');
  if(!el) return;
  if(!r||!r.link){ el.innerHTML=''; return; }
  const earned=(r.months_earned||0)+(r.pending||0);
  const tally=r.joined?(r.joined+' salon'+(r.joined===1?'':'s')+' joined through you'+(earned?' · '+earned+' free month'+(earned===1?'':'s')+(r.pending?' ('+r.pending+' waiting for your first payment)':''):'')):'';
  el.innerHTML='<div class="card" style="margin-bottom:20px"><h3>Give a month, get a month</h3>'+
    '<div class="desc">Send another salon your link. When they subscribe, you both get a month of LolaDesk free.</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">'+
    '<input id="refLink" readonly value="'+esc(r.link)+'" onfocus="this.select()" aria-label="Your referral link" style="flex:1;min-width:0;background:var(--bg2,transparent);border:.5px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;font-size:13px">'+
    '<button type="button" class="plan-btn primary" style="width:auto;padding:10px 16px" onclick="copyRef(this)">Copy link</button></div>'+
    (tally?'<div class="desc" style="margin-top:10px">'+esc(tally)+'</div>':'')+'</div>';
}
function copyRef(btn){
  const i=document.getElementById('refLink'); if(!i) return;
  const done=()=>{btn.textContent='Copied';setTimeout(()=>{btn.textContent='Copy link';},1800);};
  try{ navigator.clipboard.writeText(i.value).then(done,()=>{i.focus();i.select();}); }catch(_){ i.focus(); i.select(); }
}

// Cancelling: show what Lola did first, offer the cheaper plan, then cancel. No browser dialogs.
function cancelSub(){
  closeCancel();
  const st=STATE||{}, lb=st.lola_bookings||{}, u=st.usage||{};
  const money=(n)=>'$'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:0});
  const calls=Number(u.calls_handled||0), booked=Number(lb.lola_bookings||0), rev=Number(lb.lola_revenue||0);
  const did=(calls||booked)?('This month Lola answered '+calls+' call'+(calls===1?'':'s')+' and booked '+booked+' appointment'+(booked===1?'':'s')+(rev?' worth '+money(rev):'')+' for you.'):'Lola is on your line for every call, day and night.';
  const canDown=st.plan&&st.plan!=='starter'&&st.has_subscription;
  const wrap=document.createElement('div'); wrap.id='cancelSheet';
  wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true'); wrap.setAttribute('aria-labelledby','cancelTitle');
  wrap.style.cssText='position:fixed;inset:0;z-index:400;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))';
  wrap.innerHTML='<div class="card" style="max-width:460px;width:100%;margin:0 0 8px;padding:22px">'+
    '<h3 id="cancelTitle" style="font-size:18px;margin:0 0 8px">Before you go</h3>'+
    '<div class="desc" style="font-size:14px;line-height:1.5">'+esc(did)+' If she stops, those calls go to voicemail.</div>'+
    '<div style="display:grid;gap:8px;margin-top:18px">'+
    '<button type="button" class="plan-btn primary" onclick="closeCancel()">Keep Lola</button>'+
    (canDown?'<button type="button" class="plan-btn ghost" onclick="downToStarter(this)">Move to Starter, $99 a month</button>':'')+
    '<button type="button" class="plan-btn ghost" style="color:var(--red,#ff6b6b)" onclick="confirmCancel(this)">Cancel at the end of this billing period</button>'+
    '</div><div class="desc" id="cancelMsg" role="status" style="margin-top:10px"></div></div>';
  wrap.addEventListener('click',(e)=>{ if(e.target===wrap) closeCancel(); });
  document.addEventListener('keydown',escCancel);
  document.body.appendChild(wrap);
  wrap.querySelector('button').focus();
}
function escCancel(e){ if(e.key==='Escape') closeCancel(); }
function closeCancel(){ const w=document.getElementById('cancelSheet'); if(w) w.remove(); document.removeEventListener('keydown',escCancel); }
async function downToStarter(btn){
  btn.disabled=true; const m=document.getElementById('cancelMsg'); m.textContent='Moving you to Starter…';
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'switch',plan:'starter',interval:CYCLE})});
    const d=await r.json(); if(!d.ok) throw new Error(d.error||'Could not switch plans');
    closeCancel(); msg('portalMsg',d.message||'You are on Starter now. Lola keeps answering.',true); load();
  }catch(e){ m.textContent=e.message; btn.disabled=false; }
}
async function confirmCancel(btn){
  btn.disabled=true; const m=document.getElementById('cancelMsg'); m.textContent='Cancelling…';
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'cancel'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Cancel failed');
    closeCancel(); msg('portalMsg',d.message,true);load();
  }catch(e){ m.textContent=e.message; btn.disabled=false; }
}

async function resumeSub(){
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'resume'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Resume failed');
    msg('portalMsg',d.message,true);load();
  }catch(e){msg('portalMsg',e.message,false);}
}

// Sent here because a third stylist needs Pro (lib/plan-gate.js): say so once, point at Pro.
if(new URLSearchParams(location.search).get('upgrade')==='pro'){
  setTimeout(()=>{
    const g=document.getElementById('plansGrid'); if(!g) return;
    const n=document.createElement('div'); n.setAttribute('role','status');
    n.style.cssText='margin:0 0 14px;padding:12px 14px;border-radius:12px;border:1px solid rgba(204,255,0,.35);font-size:14px;line-height:1.45';
    n.textContent='Your team is growing. Pro lets Lola book every stylist, with win-back campaigns and platform sync. Everyone already on the book stays as is.';
    g.parentNode.insertBefore(n,g); g.scrollIntoView({behavior:'smooth',block:'start'});
  },600);
}
if(new URLSearchParams(location.search).get('success')){
  setTimeout(()=>msg('portalMsg','Subscription active. Lola is running.',true),500);
}

(async()=>{try{await window.LolaAuth.ready;}catch(e){return;}load();})();
</script>
<script>
// Came from a sign-up for a salon that already had its free trial: say why there's no new trial.
(function(){try{if(!/[?&]trial_used=1/.test(location.search))return;var m=document.querySelector('main.main');if(!m)return;var d=document.createElement('div');d.setAttribute('role','status');d.style.cssText='margin:0 0 16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(127,127,127,.25);font-size:14px;line-height:1.45';d.textContent='Welcome back! This salon has already used its free LolaDesk trial, so your account is ready but the trial won’t restart. Pick a plan below to turn Lola on.';m.insertBefore(d,m.firstChild);}catch(_){}})();
</script>
</body>
</html>
