<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Billing — LolaDesk</title><link rel="stylesheet" href="app.css"/>
<style>
.banner{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.banner.warn{border-color:#ffc04344;background:linear-gradient(180deg,rgba(255,192,67,.06),transparent)}
.banner.danger{border-color:#ff6b6b44;background:linear-gradient(180deg,rgba(255,107,107,.06),transparent)}
.banner h3{font-size:17px;font-weight:600;margin-bottom:4px}
.banner p{font-size:13px;color:var(--text3);line-height:1.6}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}
@media(max-width:900px){.plans{grid-template-columns:1fr}}
.plan{background:var(--surface);border:.5px solid var(--border);border-radius:20px;padding:26px;display:flex;flex-direction:column;transition:.2s}
.plan.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan.featured{border-color:var(--text2)}
.plan-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);margin-bottom:8px;min-height:14px}
.plan-name{font-size:20px;font-weight:600;margin-bottom:6px}
.plan-price{font-size:38px;font-weight:300;letter-spacing:-.03em;margin-bottom:2px}
.plan-price span{font-size:14px;color:var(--text3);font-weight:400}
.plan-feat{list-style:none;padding:0;margin:20px 0;flex:1}
.plan-feat li{font-size:13px;color:var(--text2);padding:7px 0;padding-left:22px;position:relative;line-height:1.5}
.plan-feat li:before{content:'';position:absolute;left:0;top:13px;width:12px;height:2px;background:var(--accent);border-radius:2px}
.plan-btn{width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.plan-btn.primary{background:var(--text);color:#080809}
.plan-btn.ghost{background:transparent;border:.5px solid var(--border);color:var(--text2)}
.plan-btn:disabled{opacity:.4;cursor:not-allowed}
.usage{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:900px){.usage{grid-template-columns:repeat(2,1fr)}}
.u-card{background:var(--surface);border:.5px solid var(--border);border-radius:14px;padding:18px}
.u-val{font-size:26px;font-weight:300;letter-spacing:-.02em}
.u-lbl{font-size:11.5px;color:var(--text3);margin-top:3px}
.card{background:var(--surface);border:.5px solid var(--border);border-radius:18px;padding:24px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:600;margin-bottom:6px}
.card .desc{font-size:12.5px;color:var(--text3);margin-bottom:16px;line-height:1.6}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-g{background:transparent;border:.5px solid var(--border);color:var(--text2);border-radius:11px;padding:11px 18px;font-size:13.5px;cursor:pointer;font-family:inherit}
.msg{font-size:12.5px;margin-top:12px;min-height:18px}
.msg.ok{color:var(--accent2)}.msg.err{color:#ff8a8a}
</style>
</head>
<body data-page="subscription">
<div class="app"><main class="main">
<div class="page-head">
  <div><h1 class="page-title">Billing</h1>
  <p style="font-size:13px;color:var(--text3);margin-top:4px">Your plan, usage, and payment method.</p></div>
</div>

<div id="statusBanner"></div>

<div class="usage" id="usageGrid"></div>

<h2 style="font-size:15px;font-weight:600;margin:24px 0 14px">Plans</h2>
<div class="plans" id="plansGrid"></div>

<div class="card">
  <h3>Payment method &amp; invoices</h3>
  <div class="desc">Update your card, download invoices, or change your billing address.</div>
  <div class="btn-row">
    <button class="btn-g" onclick="openPortal()">Manage billing</button>
    <button class="btn-g" id="cancelBtn" onclick="cancelSub()" style="display:none">Cancel subscription</button>
    <button class="btn-g" id="resumeBtn" onclick="resumeSub()" style="display:none">Resume subscription</button>
  </div>
  <div class="msg" id="portalMsg"></div>
</div>

</main></div>
<script src="auth-guard.js"></script><script src="sidebar.js"></script>
<script>
let STATE={};
function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||'';}
function H(){return{'Content-Type':'application/json',Authorization:'Bearer '+token()};}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function msg(id,t,ok){const e=document.getElementById(id);if(e){e.textContent=t;e.className='msg '+(ok?'ok':'err');}}

async function load(){
  try{
    const [sr,pr]=await Promise.all([
      fetch('/api/billing?action=status',{headers:H()}).then(r=>r.json()),
      fetch('/api/billing?action=plans',{headers:H()}).then(r=>r.json())
    ]);
    if(!sr.ok)throw new Error(sr.error||'Could not load billing');
    STATE=sr;
    renderBanner(sr);
    renderUsage(sr.usage||{});
    renderPlans(pr.plans||[],sr);
    document.getElementById('cancelBtn').style.display=(sr.status==='active'&&!sr.cancel_at_period_end)?'':'none';
    document.getElementById('resumeBtn').style.display=sr.cancel_at_period_end?'':'none';
  }catch(e){
    document.getElementById('statusBanner').innerHTML='<div class="banner danger"><div><h3>Billing unavailable</h3><p>'+esc(e.message)+'</p></div></div>';
  }
}

function renderBanner(s){
  const b=document.getElementById('statusBanner');
  if(!s.stripe_configured){
    b.innerHTML='<div class="banner warn"><div><h3>Stripe not connected</h3><p>Add STRIPE_SECRET_KEY in Vercel to enable billing.</p></div></div>';
    return;
  }
  if(s.status==='trialing'){
    const d=s.trial_days_left;
    b.innerHTML='<div class="banner'+(d<=3?' warn':'')+'"><div><h3>'+d+' day'+(d===1?'':'s')+' left in your trial</h3>'+
      '<p>Pick a plan below to keep Lola answering your calls without interruption.</p></div></div>';
  }else if(s.status==='active'){
    const end=s.current_period_end?new Date(s.current_period_end).toLocaleDateString():'';
    b.innerHTML='<div class="banner"><div><h3>'+esc(s.plan_details?.name||s.plan)+' plan — active</h3>'+
      '<p>'+(s.cancel_at_period_end?'Ends on '+end:'Renews '+end)+'</p></div></div>';
  }else if(s.status==='past_due'){
    b.innerHTML='<div class="banner danger"><div><h3>Payment failed</h3><p>Update your card to keep Lola running.</p></div>'+
      '<button class="plan-btn primary" style="width:auto;padding:11px 20px" onclick="openPortal()">Update card</button></div>';
  }else if(s.status==='canceled'){
    b.innerHTML='<div class="banner danger"><div><h3>Subscription canceled</h3><p>Choose a plan to reactivate Lola.</p></div></div>';
  }
}

function renderUsage(u){
  document.getElementById('usageGrid').innerHTML=
    '<div class="u-card"><div class="u-val">'+(u.calls_handled||0)+'</div><div class="u-lbl">Calls handled</div></div>'+
    '<div class="u-card"><div class="u-val">'+(u.bookings_made||0)+'</div><div class="u-lbl">Bookings made</div></div>'+
    '<div class="u-card"><div class="u-val">'+(u.sms_sent||0)+'</div><div class="u-lbl">Texts sent</div></div>'+
    '<div class="u-card"><div class="u-val">'+Math.round(u.minutes_used||0)+'</div><div class="u-lbl">Minutes used</div></div>';
}

function renderPlans(plans,s){
  document.getElementById('plansGrid').innerHTML=plans.map(p=>{
    const current=s.plan===p.id&&s.status==='active';
    return '<div class="plan'+(current?' current':'')+(p.id==='pro'?' featured':'')+'">'+
      '<div class="plan-tag">'+(current?'Your plan':(p.id==='pro'?'Most popular':''))+'</div>'+
      '<div class="plan-name">'+esc(p.name)+'</div>'+
      '<div class="plan-price">'+esc(p.price_display)+'<span>/mo</span></div>'+
      '<ul class="plan-feat">'+p.features.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul>'+
      '<button class="plan-btn '+(current?'ghost':'primary')+'" '+(current?'disabled':'')+
      ' onclick="subscribe(\''+p.id+'\')">'+(current?'Current plan':(s.status==='trialing'?'Start '+esc(p.name):'Switch to '+esc(p.name)))+'</button>'+
      '</div>';
  }).join('');
}

async function subscribe(plan){
  msg('portalMsg','Opening secure checkout...',true);
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'checkout',plan})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Checkout failed');
    location.href=d.url;
  }catch(e){msg('portalMsg',e.message,false);}
}

async function openPortal(){
  msg('portalMsg','Opening billing portal...',true);
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'portal'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Could not open portal');
    location.href=d.url;
  }catch(e){msg('portalMsg',e.message,false);}
}

async function cancelSub(){
  if(!confirm('Cancel your subscription? Lola will stop answering calls at the end of your billing period.'))return;
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'cancel'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Cancel failed');
    msg('portalMsg',d.message,true);load();
  }catch(e){msg('portalMsg',e.message,false);}
}

async function resumeSub(){
  try{
    const r=await fetch('/api/billing',{method:'POST',headers:H(),body:JSON.stringify({action:'resume'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Resume failed');
    msg('portalMsg',d.message,true);load();
  }catch(e){msg('portalMsg',e.message,false);}
}

if(new URLSearchParams(location.search).get('success')){
  setTimeout(()=>msg('portalMsg','Subscription active. Lola is running.',true),500);
}

(async()=>{try{await window.LolaAuth.ready;}catch(e){return;}load();})();
</script>
</body>
</html>
