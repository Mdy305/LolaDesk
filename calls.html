<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>Call Center · LolaDesk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/calls.css">
</head>
<body>

<!-- Atom (LolaCore auto-mounts) -->
<div data-lola-atom class="cc-atom-mount"></div>

<div class="cc">

  <!-- Left rail: filters -->
  <aside class="cc-rail">
    <div class="cc-brand">
      <div class="cc-brand-label">Call Center</div>
      <div class="cc-brand-title" id="tenantName">&mdash;</div>
    </div>
    <nav class="cc-tabs">
      <button data-filter="live"      class="cc-tab" data-count="0"><span class="dot dot-live"></span>Live<span class="cc-tab-badge" id="cntLive">0</span></button>
      <button data-filter="missed"    class="cc-tab on" data-count="0"><span class="dot dot-missed"></span>Missed<span class="cc-tab-badge" id="cntMissed">0</span></button>
      <button data-filter="voicemail" class="cc-tab"><span class="dot dot-vm"></span>Voicemail<span class="cc-tab-badge" id="cntVM">0</span></button>
      <button data-filter="handled"   class="cc-tab"><span class="dot dot-handled"></span>Handled<span class="cc-tab-badge" id="cntHandled">0</span></button>
      <button data-filter="all"       class="cc-tab"><span class="dot dot-all"></span>All calls</button>
    </nav>
    <div class="cc-rail-foot">
      <button id="btnRefresh" class="btn-ghost">Refresh</button>
      <label class="cc-live-toggle"><input type="checkbox" id="autoRefresh" checked><span>Auto-refresh</span></label>
    </div>
  </aside>

  <!-- Center: call list -->
  <main class="cc-list-wrap">
    <header class="cc-list-head">
      <input id="callSearch" type="search" placeholder="Search caller name or phone…">
    </header>
    <ul id="callList" class="cc-list">
      <li class="cc-empty">Loading&hellip;</li>
    </ul>
  </main>

  <!-- Right rail: selected call detail -->
  <aside id="callDetail" class="cc-detail">
    <div class="cc-detail-empty">Select a call to see the transcript, recording and actions.</div>
  </aside>

</div>

<script src="/lola-core.js" defer></script>
<script src="/calls.js" defer></script>
</body>
</html>
