<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calls — LolaDesk</title>
<meta name="description" content="Every call Lola answers, in real time — with live transcripts, whisper, callback, and search."/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="app.css"/>
<link rel="stylesheet" href="lola-live-conversation.css"/>
<style>
/* ═══════════════════════════════════════════════════════════════
   Calls — the full call-center surface. Rebuilt from scratch on the
   shared design system (fix #1 tokens). Structure:
     · one narrative line instead of a 4-KPI wall
     · Live Now zone (hidden until an active call) — hosts lola-live-
       conversation.js's live plug-in exactly as dashboard did
     · Today's calls timeline — filter chips, search, expandable
       inline transcripts, per-row callback / text actions
     · Missed & follow-ups (only when non-empty)
   All colors reference shared tokens; no --pink, no hardcoded fake
   data, no dashboard drift.
   ═══════════════════════════════════════════════════════════════ */

/* PAGE HEAD */
.page-narrative{font-size:14px;color:var(--text2);margin-top:4px;line-height:1.55;max-width:640px}
.page-narrative b{color:var(--text);font-weight:600}

/* SEGMENTED (inbox/calls toggle) */
.seg-views{display:inline-flex;gap:4px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:4px;margin:14px 0 20px}
.seg-views a{padding:8px 18px;border-radius:9px;font-size:13px;font-weight:600;text-decoration:none;color:var(--text2);transition:color .15s,background .15s}
.seg-views a.on{color:#10140a;background:var(--accent)}

/* LIVE NOW — dashboard's lola-live panel, at home on the calls page.
   Element IDs (liveStatePill, liveEmpty, liveCalls, liveFeed,
   liveTranscript, whisperInput, whisperBtn, whisperHint, liveMeta)
   MUST match what lola-live-conversation.js binds — do not rename. */
.live-now{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);padding:0;margin-bottom:22px;box-shadow:0 8px 32px rgba(0,0,0,0.4);overflow:hidden;transition:opacity .3s}
.live-now[hidden]{display:none}
.live-now-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:0.5px solid var(--border)}
.live-now-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--text)}
.live-now-title svg{color:var(--accent)}
.live-now-title .lola-live-pill{background:var(--accent-dim);color:var(--accent);border:0.5px solid var(--accent-glow);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em}
.live-now-title .lola-live-pill[data-tone="idle"]{background:var(--surface2);color:var(--text3);border-color:var(--border)}
.live-now-title .lola-live-pill[data-tone="ringing"]{background:rgba(255,179,64,.15);color:var(--warning);border-color:rgba(255,179,64,.35)}
.live-now-meta{font-size:12px;color:var(--text3)}
.live-now-body{padding:18px 20px}
.lola-live-empty{color:var(--text3);font-size:13px;padding:10px 0}
.lola-live-calls .lola-live-call{background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:10px}
.lola-live-feed{margin-top:14px}
.live-feed-head{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.live-feed-scroll{max-height:260px;overflow-y:auto;padding:12px 14px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;line-height:1.6}
.live-feed-scroll .who{font-weight:600;color:var(--accent);margin-right:6px}
.live-feed-scroll .caller .who{color:var(--text2)}
.live-whisper{display:flex;gap:8px;margin-top:12px}
.live-whisper input{flex:1;min-width:0;background:var(--surface2);border:0.5px solid var(--border);border-radius:var(--r-sm);color:var(--text);padding:10px 14px;font:inherit;min-height:44px}
.live-whisper input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.live-whisper button{padding:10px 18px;border-radius:var(--r-sm);background:var(--accent);color:#10140a;font-weight:600;font-size:13px;cursor:pointer;min-height:44px;transition:transform .15s,box-shadow .15s}
.live-whisper button:hover{transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-glow)}
.live-whisper-hint{font-size:11px;color:var(--text3);margin-top:6px}

/* TOOLBAR — filter chips + search */
.calls-toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chip-row{display:inline-flex;gap:6px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:4px}
.chip{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--text2);cursor:pointer;transition:color .15s,background .15s;border:none;background:transparent;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{color:var(--text)}
.chip.on{color:#10140a;background:var(--accent)}
.chip-count{font-size:10px;font-weight:700;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.14);color:inherit;min-width:18px;text-align:center}
.chip.on .chip-count{background:rgba(16,20,10,.18);color:#10140a}
.search-box{flex:1;min-width:220px;max-width:360px;position:relative}
.search-box input{width:100%;background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r-sm);padding:10px 14px 10px 38px;color:var(--text);font:inherit;min-height:40px}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}

/* CALL LIST */
.calls-list{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.call-row{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:16px 20px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .12s;position:relative}
.call-row:last-child{border-bottom:none}
.call-row:hover{background:var(--surface2)}
.call-row:focus-visible{outline:none;background:var(--surface2);box-shadow:inset 3px 0 0 var(--accent)}
.call-dir{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--surface2);color:var(--text2)}
.call-dir.booked{background:var(--accent-dim);color:var(--accent)}
.call-dir.missed{background:rgba(255,90,77,.14);color:var(--danger)}
.call-dir.escalated{background:rgba(255,179,64,.14);color:var(--warning)}
.call-body{min-width:0}
.call-name{font-size:14.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px}
.call-num{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
.call-preview{font-size:12.5px;color:var(--text2);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
.call-outcome{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.call-time{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.call-dur{font-size:11px;color:var(--text3);font-variant-numeric:tabular-nums}
.pill-outcome{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;letter-spacing:.01em}
.pill-outcome.booked{background:var(--accent-dim);color:var(--accent)}
.pill-outcome.handled{background:var(--surface2);color:var(--text)}
.pill-outcome.escalated{background:rgba(255,179,64,.14);color:var(--warning)}
.pill-outcome.missed{background:rgba(255,90,77,.14);color:var(--danger)}
.pill-outcome.lead{background:rgba(90,200,250,.14);color:var(--info)}
.call-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.call-action{width:36px;height:36px;border-radius:10px;background:var(--surface2);border:0.5px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.call-action:hover{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-glow)}
.call-action[disabled]{opacity:.4;cursor:not-allowed}

/* EXPANDED TRANSCRIPT */
.call-transcript{grid-column:1/-1;background:var(--bg);border-top:0.5px solid var(--border);padding:16px 20px;font-size:13px;line-height:1.6;display:none;margin-top:14px;border-radius:var(--r-sm)}
.call-row.open .call-transcript{display:block}
.t-line{margin-bottom:8px}
.t-line .who{font-weight:600;color:var(--accent);margin-right:6px}
.t-line.caller .who{color:var(--text2)}
.transcript-actions{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:0.5px solid var(--border)}
.transcript-btn{padding:8px 14px;border-radius:var(--r-sm);background:var(--surface2);border:0.5px solid var(--border);color:var(--text);font-size:12.5px;font-weight:500;cursor:pointer;min-height:36px}
.transcript-btn.primary{background:var(--accent);color:#10140a;border-color:var(--accent);font-weight:600}
.transcript-btn.primary:hover{box-shadow:0 4px 12px var(--accent-glow)}
.callback-status{font-size:12px;color:var(--text3);margin-top:10px;padding:8px 12px;border-radius:var(--r-sm);background:var(--surface2);display:none}
.callback-status.ok{color:var(--accent);background:var(--accent-dim);display:block}
.callback-status.err{color:var(--danger);background:rgba(255,90,77,.1);display:block}

/* EMPTY STATE */
.empty-state{padding:60px 24px;text-align:center;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:14px}
.empty-orb{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#3a5a00);display:flex;align-items:center;justify-content:center;color:#10140a;font-weight:700;font-size:22px;letter-spacing:-.02em;box-shadow:0 6px 24px var(--accent-glow)}
.empty-title{font-weight:600;color:var(--text);font-size:16px}
.empty-sub{max-width:320px;line-height:1.55;font-size:13.5px;color:var(--text2)}
.empty-cta{margin-top:6px;padding:11px 22px;border-radius:var(--r-sm);background:var(--accent);color:#10140a;font-weight:600;font-size:13px;cursor:pointer;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .15s,box-shadow .15s}
.empty-cta:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}

/* SKELETON */
.sk-row{display:grid;grid-template-columns:36px 1fr 60px 40px;gap:14px;padding:16px 20px;border-bottom:0.5px solid var(--border);align-items:center}
.sk-row:last-child{border-bottom:none}
.sk-bar{background:linear-gradient(90deg,var(--surface2) 0%,var(--surface) 50%,var(--surface2) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:6px;height:12px}
.sk-bar.tall{height:36px;width:36px;border-radius:10px}
.sk-bar.short{width:60%}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk-bar{animation:none}}

/* RESPONSIVE — mobile-first cards below 720 */
@media(max-width:900px){
  .call-preview{max-width:none;white-space:normal}
}
@media(max-width:720px){
  .live-now-head{flex-direction:column;align-items:flex-start;gap:6px}
  .call-row{grid-template-columns:36px 1fr;grid-template-areas:"dir body" "act act" "trans trans";gap:10px;padding:14px 16px}
  .call-dir{grid-area:dir}
  .call-body{grid-area:body}
  .call-outcome{grid-area:body;flex-direction:row;justify-content:flex-start;gap:8px;margin-top:6px}
  .call-outcome .pill-outcome{order:0}
  .call-outcome .call-time,.call-outcome .call-dur{margin-left:auto}
  .call-actions{grid-area:act;justify-content:flex-end}
  .call-transcript{grid-area:trans}
  .calls-toolbar{gap:8px}
  .chip-row{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .search-box{max-width:none;width:100%}
}
@media(max-width:420px){
  .main{padding:12px 12px 90px}
  .call-row{padding:12px 14px}
  .live-now-body{padding:14px 16px}
}

/* MISSED PANEL (only shown when non-empty) */
.missed-panel{background:var(--surface);border:0.5px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--r);padding:16px 20px;margin-bottom:18px}
.missed-panel[hidden]{display:none}
.missed-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.missed-title svg{color:var(--danger)}
.missed-title .count{background:var(--danger);color:#fff;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;margin-left:auto}
.missed-list{display:flex;flex-direction:column;gap:8px}
.missed-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--r-sm)}
.missed-item .who{font-size:13.5px;font-weight:500;color:var(--text)}
.missed-item .when{font-size:11.5px;color:var(--text3);margin-top:2px}
.missed-actions{display:flex;gap:6px}
</style>
</head>
<body data-page="calls">
<div class="app">
  <main class="main">

    <div class="topbar">
      <div class="page-head">
        <h1 class="page-title">Calls</h1>
        <p class="page-narrative" id="narrativeLine">Loading today's calls…</p>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" onclick="location.href='numbers.html'" aria-label="Manage numbers">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M11 18h2"/></svg>
          Manage numbers
        </button>
      </div>
    </div>

    <nav class="seg-views" aria-label="Messages or calls">
      <a href="inbox.html">Messages</a>
      <a href="calls.html" class="on" aria-current="page">Calls</a>
    </nav>

    <!-- LIVE NOW — bound by lola-live-conversation.js. Hidden until a
         call is actually in progress; the plug-in toggles visibility
         via the [hidden] attribute below when state.calls.length > 0. -->
    <section class="live-now" id="livePanel" hidden aria-live="polite">
      <div class="live-now-head">
        <div class="live-now-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="19" cy="18" r="3"/><path d="M19 15v1m0 4v1"/></svg>
          Live now
          <span class="lola-live-pill" id="liveStatePill" data-tone="idle">Connecting…</span>
        </div>
        <div class="live-now-meta" id="liveMeta">Live call state</div>
      </div>
      <div class="live-now-body">
        <div class="lola-live-calls" id="liveCalls">
          <div class="lola-live-empty" id="liveEmpty">Lola is standing by on your lines.</div>
        </div>
        <div class="lola-live-feed" id="liveFeed">
          <div class="live-feed-head">
            <span>Conversation</span>
            <span class="live-feed-hint">Live transcript + whisper</span>
          </div>
          <div class="live-feed-scroll" id="liveTranscript" role="log" aria-live="polite"></div>
          <div class="live-whisper">
            <input id="whisperInput" placeholder="Whisper to Lola mid-call…" aria-label="Whisper to Lola" />
            <button id="whisperBtn" onclick="window.lolaLive && lolaLive.whisper()">Whisper</button>
          </div>
          <div class="live-whisper-hint" id="whisperHint" style="display:none"></div>
        </div>
      </div>
    </section>

    <!-- MISSED — surfaces only when there are truly missed calls -->
    <section class="missed-panel" id="missedPanel" hidden>
      <div class="missed-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
        Need a callback
        <span class="count" id="missedCount">0</span>
      </div>
      <div class="missed-list" id="missedList"></div>
    </section>

    <!-- TOOLBAR — filters + search -->
    <div class="calls-toolbar" role="toolbar" aria-label="Filter and search calls">
      <div class="chip-row" role="tablist" aria-label="Filter by outcome">
        <button class="chip on" data-filter="all" onclick="setFilter('all')" role="tab" aria-selected="true">All <span class="chip-count" id="cnAll">0</span></button>
        <button class="chip" data-filter="booked" onclick="setFilter('booked')" role="tab" aria-selected="false">Booked <span class="chip-count" id="cnBooked">0</span></button>
        <button class="chip" data-filter="missed" onclick="setFilter('missed')" role="tab" aria-selected="false">Missed <span class="chip-count" id="cnMissed">0</span></button>
        <button class="chip" data-filter="escalated" onclick="setFilter('escalated')" role="tab" aria-selected="false">Escalated <span class="chip-count" id="cnEsc">0</span></button>
      </div>
      <label class="search-box" aria-label="Search calls">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>
        <input id="searchInput" type="search" placeholder="Search by name or number…" oninput="setQuery(this.value)" autocomplete="off"/>
      </label>
    </div>

    <!-- LIST -->
    <div class="calls-list" id="callsList" role="list">
      <!-- skeleton until data arrives -->
      <div class="sk-row"><div class="sk-bar tall"></div><div><div class="sk-bar" style="width:40%;margin-bottom:8px"></div><div class="sk-bar short"></div></div><div class="sk-bar short"></div><div class="sk-bar tall"></div></div>
      <div class="sk-row"><div class="sk-bar tall"></div><div><div class="sk-bar" style="width:35%;margin-bottom:8px"></div><div class="sk-bar short"></div></div><div class="sk-bar short"></div><div class="sk-bar tall"></div></div>
      <div class="sk-row"><div class="sk-bar tall"></div><div><div class="sk-bar" style="width:45%;margin-bottom:8px"></div><div class="sk-bar short"></div></div><div class="sk-bar short"></div><div class="sk-bar tall"></div></div>
    </div>

  </main>
</div>

<nav class="mobile-bar" aria-label="Primary">
  <a class="mb-item" href="dashboard.html" aria-label="Home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z"/></svg>
    Home
  </a>
  <a class="mb-item" href="bookings.html" aria-label="Calendar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
    Calendar
  </a>
  <a class="mb-item active" href="calls.html" aria-label="Calls" aria-current="page">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>
    Calls
  </a>
  <a class="mb-item" href="inbox.html" aria-label="Inbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    Inbox
  </a>
  <a class="mb-item" href="settings.html" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06A1.65 1.65 0 0015 19.4a1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.24.58.79.98 1.41 1.02H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Settings
  </a>
</nav>

<script>
/* ═══════════════════════════════════════════════════════════════
   Calls page — data + interactivity.
   State machine:
     · load recent calls via LolaData.load('calls')
     · render into filtered/searched list
     · poll every 30s; if new calls arrive, prepend and pulse the
       shared orb (window.lolaPulse — wired in app.js fix #5)
     · lola-live-conversation.js runs its own 8s poll independently
       into #livePanel — we just show/hide the panel by watching for
       call activity in its bound state (via a tiny observer here)
   ═══════════════════════════════════════════════════════════════ */

let CALLS = [];
let SEEN = new Set();
let FILTER = 'all';
let QUERY = '';
let OPEN_ID = null;

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDur(sec){ if(!sec) return '—'; const m=Math.floor(sec/60),s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function fmtPhone(n){ return String(n||'').replace(/^\+1(\d{3})(\d{3})(\d{4})$/,'($1) $2-$3') || (n||''); }
function relTime(iso){
  if(!iso) return '';
  const t = new Date(iso).getTime();
  if(!t) return '';
  const s = Math.max(0, Math.floor((Date.now() - t)/1000));
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60)+'m ago';
  if(s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}
function outcomeOf(c){
  if(c.booked) return 'booked';
  const o = String(c.outcome||'').toLowerCase();
  if(o === 'missed' || o === 'failed') return 'missed';
  if(o === 'escalated') return 'escalated';
  if(o === 'lead') return 'lead';
  return 'handled';
}
function outcomeLabel(k){
  return { booked:'Booked', missed:'Missed', escalated:'Escalated', lead:'Lead', handled:'Handled' }[k] || 'Handled';
}
function dirIcon(k){
  if(k === 'missed') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/><line x1="23" y1="1" x2="1" y2="23"/></svg>';
  if(k === 'booked') return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>';
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>';
}

function narrative(list){
  if(!list.length) return "Lola is standing by. No calls yet today.";
  const today = new Date(); today.setHours(0,0,0,0);
  const t = list.filter(c => c.createdAt && new Date(c.createdAt) >= today);
  const b = t.filter(c => c.booked).length;
  const m = t.filter(c => ['missed','failed'].includes(String(c.outcome||'').toLowerCase())).length;
  const e = t.filter(c => String(c.outcome||'').toLowerCase() === 'escalated').length;
  if(!t.length) return `<b>${list.length}</b> calls in the last 30 days.`;
  const parts = [`Lola answered <b>${t.length}</b> call${t.length===1?'':'s'} today`];
  if(b) parts.push(`<b>${b}</b> booked`);
  if(e) parts.push(`<b>${e}</b> escalated to you`);
  if(m) parts.push(`<b>${m}</b> missed`);
  return parts.join(' · ') + '.';
}

function filterList(){
  let list = CALLS.slice();
  if(FILTER !== 'all') list = list.filter(c => outcomeOf(c) === FILTER);
  if(QUERY){
    const q = QUERY.toLowerCase();
    list = list.filter(c => (c.from||'').toLowerCase().includes(q) || (c.summary||'').toLowerCase().includes(q));
  }
  return list;
}

function rowHtml(c){
  const kind = outcomeOf(c);
  const phone = c.from || '';
  const preview = c.summary || (Array.isArray(c.transcript) && c.transcript.length ? (c.transcript[0].content || '').slice(0,140) : '');
  const canPhone = !!phone;
  const isOpen = OPEN_ID === c._id;
  return `
    <div class="call-row ${isOpen?'open':''}" data-id="${esc(c._id)}" role="listitem" tabindex="0" onclick="toggleRow('${esc(c._id)}', event)" onkeydown="if(event.key==='Enter'||event.key===' '){toggleRow('${esc(c._id)}', event);event.preventDefault()}">
      <div class="call-dir ${kind}" aria-hidden="true">${dirIcon(kind)}</div>
      <div class="call-body">
        <div class="call-name">${esc(c.from ? fmtPhone(phone) : 'Unknown caller')} ${phone && c.from !== fmtPhone(phone) ? `<span class="call-num">${esc(fmtPhone(phone))}</span>` : ''}</div>
        ${preview ? `<div class="call-preview">${esc(preview)}</div>` : ''}
      </div>
      <div class="call-outcome">
        <span class="pill-outcome ${kind}">${outcomeLabel(kind)}</span>
        <span class="call-time">${esc(relTime(c.createdAt) || c.when || '')}</span>
        <span class="call-dur">${fmtDur(c.durationSec)}</span>
      </div>
      <div class="call-actions" onclick="event.stopPropagation()">
        <button class="call-action" onclick="textBack('${esc(phone)}', event)" aria-label="Text back" title="Text back" ${canPhone?'':'disabled'}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
        </button>
        <button class="call-action" onclick="callBack('${esc(phone)}','${esc(c._id)}', event)" aria-label="Call back" title="Call back" ${canPhone?'':'disabled'}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>
        </button>
      </div>
      ${isOpen ? transcriptHtml(c) : ''}
    </div>
  `;
}

function transcriptHtml(c){
  const t = Array.isArray(c.transcript) ? c.transcript : [];
  const body = t.length
    ? t.map(x => `<div class="t-line ${x.role==='assistant'?'lola':'caller'}"><span class="who">${x.role==='assistant'?'Lola':'Caller'}</span>${esc(x.content||'')}</div>`).join('')
    : `<div class="t-line" style="color:var(--text3)">${c.summary ? esc(c.summary) : 'No transcript captured for this call.'}</div>`;
  return `
    <div class="call-transcript">
      ${body}
      <div class="transcript-actions">
        ${c.from ? `<button class="transcript-btn primary" onclick="callBack('${esc(c.from)}','${esc(c._id)}', event)">Call back</button>` : ''}
        ${c.from ? `<button class="transcript-btn" onclick="textBack('${esc(c.from)}', event)">Text</button>` : ''}
      </div>
      <div class="callback-status" id="cbstatus-${esc(c._id)}"></div>
    </div>
  `;
}

function render(){
  const list = filterList();
  $('narrativeLine').innerHTML = narrative(CALLS);
  // Counts on chips reflect the WHOLE dataset, not the filtered view.
  $('cnAll').textContent = CALLS.length;
  $('cnBooked').textContent = CALLS.filter(c => c.booked).length;
  $('cnMissed').textContent = CALLS.filter(c => ['missed','failed'].includes(String(c.outcome||'').toLowerCase())).length;
  $('cnEsc').textContent = CALLS.filter(c => String(c.outcome||'').toLowerCase() === 'escalated').length;

  // Missed follow-up panel
  const missed = CALLS.filter(c => outcomeOf(c) === 'missed' && c.from).slice(0,5);
  const mp = $('missedPanel');
  if(missed.length){
    mp.hidden = false;
    $('missedCount').textContent = missed.length;
    $('missedList').innerHTML = missed.map(c => `
      <div class="missed-item">
        <div>
          <div class="who">${esc(fmtPhone(c.from))}</div>
          <div class="when">${esc(relTime(c.createdAt) || c.when || '')}</div>
        </div>
        <div class="missed-actions">
          <button class="call-action" onclick="textBack('${esc(c.from)}', event)" aria-label="Text back" title="Text back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></button>
          <button class="call-action" onclick="callBack('${esc(c.from)}','${esc(c._id)}', event)" aria-label="Call back" title="Call back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg></button>
        </div>
      </div>
    `).join('');
  } else {
    mp.hidden = true;
  }

  const host = $('callsList');
  if(!CALLS.length){
    host.innerHTML = `
      <div class="empty-state">
        <div class="empty-orb">L</div>
        <div class="empty-title">No calls yet</div>
        <div class="empty-sub">Get Lola a phone number and every call will land here — with transcripts, outcomes and one-tap callback.</div>
        <a class="empty-cta" href="numbers.html">Get a Lola number →</a>
      </div>`;
    return;
  }
  if(!list.length){
    host.innerHTML = `<div class="empty-state"><div class="empty-title" style="margin-top:20px">Nothing matches</div><div class="empty-sub">Try clearing the filter or search.</div></div>`;
    return;
  }
  host.innerHTML = list.map(rowHtml).join('');
}

function setFilter(f){
  FILTER = f;
  document.querySelectorAll('.chip').forEach(el => {
    const on = el.dataset.filter === f;
    el.classList.toggle('on', on);
    el.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  render();
}
function setQuery(q){ QUERY = String(q||'').trim(); render(); }

function toggleRow(id){
  OPEN_ID = OPEN_ID === id ? null : id;
  render();
}

async function authToken(){
  try{
    const auth = await window.LolaAuth.ready;
    return auth?.token || '';
  }catch(e){ return ''; }
}

async function callBack(phone, id, ev){
  if(ev){ ev.stopPropagation(); }
  const status = $('cbstatus-' + id);
  const setStatus = (msg, ok) => { if(status){ status.className = 'callback-status ' + (ok===false?'err':'ok'); status.textContent = msg; } };
  if(!phone){ setStatus("No number on file for this call.", false); return; }
  setStatus("Placing callback…", true);
  try{
    const t = await authToken();
    const r = await fetch('/api/call-center/callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(t?{Authorization:'Bearer '+t}:{}) },
      body: JSON.stringify({ phone })
    });
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.ok !== false){
      setStatus("Callback placed. Lola will ring you first, then bridge the client.", true);
    } else {
      setStatus(j.error || "Callback failed. Try again in a moment.", false);
    }
  }catch(e){
    setStatus("Network error placing callback.", false);
  }
}
function textBack(phone, ev){
  if(ev){ ev.stopPropagation(); }
  if(!phone) return;
  // Route through inbox with the phone prefilled — the inbox page handles compose.
  location.href = 'inbox.html?compose=' + encodeURIComponent(phone);
}

/* ── DATA LOAD + POLLING ─────────────────────────────────────── */
function normalize(list){
  return list.map((c, i) => ({
    ...c,
    _id: c.id || c.callId || (c.from + '|' + c.createdAt) || ('c-' + i)
  }));
}

async function loadCalls(firstLoad){
  let data;
  try{ data = await LolaData.load('calls'); }
  catch(e){ return; }
  const list = normalize((data && data.calls) || []);
  // Detect new arrivals on subsequent polls and pulse the shared orb.
  if(!firstLoad){
    const fresh = list.filter(c => !SEEN.has(c._id));
    if(fresh.length && typeof window.lolaPulse === 'function'){
      const c = fresh[0];
      const who = c.from ? fmtPhone(c.from) : 'a caller';
      window.lolaPulse(c.booked ? `New booking from ${who}` : `New call from ${who}`);
    }
  }
  list.forEach(c => SEEN.add(c._id));
  CALLS = list;
  render();
}

// Kick off
(async () => {
  await loadCalls(true);
  setInterval(loadCalls, 30000);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) loadCalls();
  });
})();

/* ── LIVE-PANEL SHOW/HIDE ─────────────────────────────────────
   lola-live-conversation.js drives everything inside #livePanel.
   We just watch #liveEmpty vs #liveCalls to decide whether to
   reveal the panel — presentational only, no state duplication. */
(function watchLivePanel(){
  const panel = $('livePanel');
  if(!panel) return;
  const check = () => {
    const calls = $('liveCalls');
    const hasLive = calls && calls.querySelector('.lola-live-call');
    panel.hidden = !hasLive;
  };
  const mo = new MutationObserver(check);
  const calls = $('liveCalls');
  if(calls) mo.observe(calls, { childList:true, subtree:true });
  check();
})();
</script>
</body>
</html>
