<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Book an appointment</title>
<meta name="description" content="Book online with LolaDesk — instant availability, one tap."/>
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)"/>
<meta name="color-scheme" content="light dark"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="LolaDesk"/>
<meta property="og:title" content="Book an appointment"/>
<meta property="og:description" content="See real-time availability and book in seconds."/>
<meta property="og:image" content="https://www.loladesk.com/og-image.png"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="Book an appointment"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:#ffffff;color:#151515;min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.host{max-width:600px;margin:0 auto;padding:0 0 env(safe-area-inset-bottom)}
@media (min-width:640px){body{background:#f3f2ef}.host{padding:48px 24px 64px}}
@media (prefers-color-scheme:dark){body{background:#0d0d0e;color:#f4f3f1}}
@media (prefers-color-scheme:dark) and (min-width:640px){body{background:#070708}}
</style>
</head>
<body>
<main class="host">
  <!--
    LolaDesk booking page — the same engine Lola uses on the phone.
    The salon comes from the path (/b/SLUG), or ?t=SLUG (or ?slug=) on the
    URL, or set data-tenant below for a fixed salon. data-page="1" lets the
    widget set this page's title and share tags to the salon's name.
  -->
  <script src="/booking-widget.js" data-mode="inline" data-page="1"></script>
</main>
</body>
</html>
