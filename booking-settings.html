<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Booking Settings — LolaDesk</title><link rel="stylesheet" href="app.css"/><style>.head{margin-bottom:24px}.head h1{font-size:32px}.head p{color:var(--text3);font-size:13px;margin-top:4px}.panel{max-width:900px;border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:22px}.section{padding:18px 0;border-bottom:1px solid var(--border)}.section:last-child{border-bottom:0}.section h2{font-size:15px;margin-bottom:14px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}.field input,.field select{height:42px;border:1px solid var(--border);border-radius:11px;background:var(--bg2);color:var(--text);padding:0 12px}.switches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.switch{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12px}.switch input{width:18px;height:18px}.actions{display:flex;gap:10px;margin-top:18px}.status{font-size:12px;color:var(--text3);margin-top:12px}@media(max-width:720px){.fields,.switches{grid-template-columns:1fr}}</style></head><body data-page="booking-settings"><div class="app"><main class="main"><div class="head"><h1>Booking settings</h1><p>Rules used by dashboard booking, public booking and Lola.</p></div><div class="panel"><div class="section"><h2>Scheduling</h2><div class="fields"><div class="field"><label>Timezone</label><input id="timezone" placeholder="America/New_York"/></div><div class="field"><label>Slot interval (minutes)</label><input id="slot_interval_minutes" type="number" min="5" max="120"/></div><div class="field"><label>Minimum notice (minutes)</label><input id="minimum_notice_minutes" type="number" min="0"/></div><div class="field"><label>Booking horizon (days)</label><input id="booking_horizon_days" type="number" min="1" max="730"/></div><div class="field"><label>Cancellation window (hours)</label><input id="cancellation_window_hours" type="number" min="0"/></div><div class="field"><label>Buffer after (minutes)</label><input id="default_buffer_after_min" type="number" min="0"/></div></div></div><div class="section"><h2>Channels & client rules</h2><div class="switches"><label class="switch">Public booking <input id="public_booking_enabled" type="checkbox"/></label><label class="switch">Voice booking <input id="voice_booking_enabled" type="checkbox"/></label><label class="switch">SMS booking <input id="sms_booking_enabled" type="checkbox"/></label><label class="switch">Allow staff choice <input id="allow_staff_choice" type="checkbox"/></label><label class="switch">Allow any staff <input id="allow_any_staff" type="checkbox"/></label><label class="switch">Require phone <input id="require_phone" type="checkbox"/></label><label class="switch">Require email <input id="require_email" type="checkbox"/></label><label class="switch">Confirmation SMS <input id="confirmation_sms" type="checkbox"/></label><label class="switch">Reminder SMS <input id="reminder_sms" type="checkbox"/></label><label class="switch">Processing overlap <input id="allow_processing_overlap" type="checkbox"/></label></div></div><div class="actions"><button class="btn btn-primary" onclick="save()">Save settings</button><a class="btn btn-ghost" href="bookings.html">Back to calendar</a></div><div class="status" id="status"></div></div></main></div><script src="auth-guard.js"></script><script src="lola-data.js"></script><script src="sidebar.js"></script><script>
const fields=['timezone','slot_interval_minutes','minimum_notice_minutes','booking_horizon_days','cancellation_window_hours','default_buffer_after_min'];const bools=['public_booking_enabled','voice_booking_enabled','sms_booking_enabled','allow_staff_choice','allow_any_staff','require_phone','require_email','confirmation_sms','reminder_sms','allow_processing_overlap'];function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||''}async function api(method='GET',body=null){if(window.LolaAuth?.ready)await window.LolaAuth.ready;const r=await fetch('/api/booking-settings',{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}async function load(){try{const j=await api();const s=j.settings||{};fields.forEach(k=>{const el=document.getElementById(k);if(el&&s[k]!=null)el.value=s[k]});bools.forEach(k=>{const el=document.getElementById(k);if(el)el.checked=!!s[k]})}catch(e){status.textContent=e.message}}async function save(){status.textContent='Saving…';const body={};fields.forEach(k=>{const el=document.getElementById(k);body[k]=el.type==='number'?Number(el.value||0):el.value.trim()});bools.forEach(k=>body[k]=document.getElementById(k).checked);try{await api('POST',body);status.textContent='Saved'}catch(e){status.textContent=e.message}}load();
</script></body></html>
