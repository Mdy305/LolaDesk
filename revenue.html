<!DOCTYPE html>
<html lang="en">
<head>
<script src="/lola-auth-fetch.js"></script>
<script src="/lola-everywhere.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd">
<title>Revenue · LolaDesk</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/revenue.css">
</head>
<body>

<div data-lola-atom class="rv-atom-mount"></div>

<div class="rv">
  <!-- Header -->
  <header class="rv-head">
    <div>
      <div class="rv-label">Reports</div>
      <div class="rv-title" id="rvTitle">Revenue</div>
    </div>
    <nav class="rv-range" role="tablist">
      <button data-range="7d"  class="rv-r"  role="tab">Week</button>
      <button data-range="30d" class="rv-r on" role="tab">Month</button>
      <button data-range="90d" class="rv-r"  role="tab">Quarter</button>
      <button data-range="365d" class="rv-r" role="tab">Year</button>
    </nav>
  </header>

  <!-- KPI row -->
  <section class="kpi-row">
    <div class="kpi">
      <div class="kpi-label">Revenue</div>
      <div class="kpi-value" id="kpiRevenue">$0</div>
      <div class="kpi-trend" id="kpiRevenueTrend"></div>
      <svg class="kpi-spark" id="sparkRevenue" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
    </div>
    <div class="kpi">
      <div class="kpi-label">Bookings</div>
      <div class="kpi-value" id="kpiBookings">0</div>
      <div class="kpi-trend" id="kpiBookingsTrend"></div>
      <svg class="kpi-spark" id="sparkBookings" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
    </div>
    <div class="kpi">
      <div class="kpi-label">Avg ticket</div>
      <div class="kpi-value" id="kpiAvgTicket">$0</div>
      <div class="kpi-trend" id="kpiAvgTrend"></div>
      <svg class="kpi-spark" id="sparkAvg" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
    </div>
    <div class="kpi">
      <div class="kpi-label">Occupancy</div>
      <div class="kpi-value" id="kpiOccupancy">0%</div>
      <div class="kpi-trend" id="kpiOccTrend"></div>
      <svg class="kpi-spark" id="sparkOcc" viewBox="0 0 200 40" preserveAspectRatio="none"></svg>
    </div>
  </section>

  <!-- Charts row -->
  <section class="chart-row">
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">Revenue trend</div>
        <div class="chart-sub" id="trendSub">&mdash;</div>
      </div>
      <svg class="chart-bar" id="chartTrend" viewBox="0 0 800 220" preserveAspectRatio="none"></svg>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">Revenue by service</div>
        <div class="chart-sub" id="serviceSub">&mdash;</div>
      </div>
      <div class="hbars" id="chartServices"></div>
    </div>
  </section>

  <!-- Staff + retention -->
  <section class="table-row">
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">Staff performance</div>
      </div>
      <table class="rv-table" id="tblStaff">
        <thead><tr><th>Stylist</th><th>Bookings</th><th>Hours</th><th>Revenue</th><th>Avg</th></tr></thead>
        <tbody><tr><td colspan="5" class="empty">Loading&hellip;</td></tr></tbody>
      </table>
    </div>
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">Client retention</div>
        <div class="chart-sub">Rebooking rate by cohort</div>
      </div>
      <table class="rv-table" id="tblRetention">
        <thead><tr><th>Cohort</th><th>Clients</th><th>Rebooked</th><th>Rate</th></tr></thead>
        <tbody><tr><td colspan="4" class="empty">Loading&hellip;</td></tr></tbody>
      </table>
    </div>
  </section>

</div>

<script src="/lola-core.js" defer></script>
<script src="/revenue.js" defer></script>
</body>
</html>
