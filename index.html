<title>MMA Studio &#xb7; MMA Salon Miami Beach</title>
<style>
/* Layout: the client's site behind, MMA Studio as a full-screen sheet on phones and a centered phone-sized sheet on desktop. Single light look by design. */
:root{
  --paper:#ffffff; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
  --line:#ebe9e6; --line-2:#d2d2d7; --surface:#f6f5f3; --bubble:#f1efec;
  --scrim:rgba(20,18,16,.5);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:16px}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
h1,h2{text-wrap:balance}

/* ---------- the site (mock of mmasalon.com) ---------- */
.demo-bar{background:var(--ink);color:#fff;font-size:12px;text-align:center;padding:9px 16px;letter-spacing:.01em}
.site-nav{display:flex;justify-content:space-between;align-items:center;padding:22px clamp(16px,5vw,56px);border-bottom:1px solid var(--line)}
.wordmark{font-size:13px;font-weight:600;letter-spacing:.28em}
.site-nav nav{display:flex;gap:28px;font-size:14px;color:var(--ink-2)}
.site-nav nav a{color:inherit;text-decoration:none}
.site{max-width:1200px;margin:0 auto;padding:clamp(40px,8vw,96px) clamp(16px,5vw,56px) 120px;display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(28px,5vw,72px);align-items:center}
.site h1{margin:14px 0 18px;font-size:clamp(40px,6vw,72px);font-weight:500;letter-spacing:-.045em;line-height:1}
.site p{margin:0 0 30px;max-width:30em;font-size:18px;line-height:1.5;color:var(--ink-2)}
.site-photo{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;max-width:100%;background:var(--surface)}
.site-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block}
.pill{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:transform .15s}
.pill:active{transform:scale(.97)}
.launcher{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 6px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:15px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.launcher img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 20%}
@media (max-width:760px){.site{grid-template-columns:1fr}.site-nav nav{display:none}}

/* ---------- the studio sheet ---------- */
.studio{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center}
.studio-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .3s both}
.sheet{position:relative;width:420px;height:min(880px,calc(100% - 48px));border-radius:32px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:520px){.sheet{width:100%;height:100%;border-radius:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px 24px;flex:none}
.topbar.on-photo{position:absolute;top:0;left:0;right:0;z-index:3;color:#fff;padding-top:calc(14px + env(safe-area-inset-top,0px))}
@media (min-width:521px){.topbar.on-photo{padding-top:14px}}
.bars{display:flex;gap:4px;align-items:center}
.bars span{height:3px;border-radius:2px;background:var(--line-2);width:12px;transition:width .35s,background .35s}
.bars span.on{background:var(--ink)}.bars span.cur{width:22px}
.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;color:inherit}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.scroll{flex:1;min-height:0;overflow-y:auto}
.foot{flex:none;display:flex;gap:10px;align-items:center;padding:12px 24px 24px}
.cta{flex:1;height:56px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-size:17px;font-weight:600;letter-spacing:-.01em;transition:transform .15s,background .2s,color .2s}
.cta:active{transform:scale(.98)}
.cta:disabled{background:#e8e8ed;color:#a1a1a6;cursor:default;transform:none}
.cta.light{background:#fff;color:var(--ink)}
.back{height:56px;padding:0 14px 0 0;border:0;background:transparent;font-size:16px;font-weight:500}
.pad{padding:28px 24px 8px}
.h2{margin:10px 0 0;font-size:34px;font-weight:500;line-height:1.04;letter-spacing:-.04em}
.lede{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--ink-2)}
.link{border:0;background:transparent;padding:0;font-size:14px;font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}

/* rows (method, fullness) */
.rows{display:flex;flex-direction:column;margin-top:14px}
.row{display:flex;align-items:center;gap:16px;width:100%;padding:24px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;transition:opacity .2s}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.row .n{font-size:21px;font-weight:500;letter-spacing:-.025em}
.row .m{font-size:12px;color:var(--ink-3);margin-left:8px;font-weight:400;letter-spacing:0}
.row .d{font-size:14px;line-height:1.45;color:var(--ink-2)}
.row .perk{display:block;margin-top:8px;font-size:13px;line-height:1.4;color:var(--ink);font-weight:500}
.row .p{font-size:16px;white-space:nowrap}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #c7c7cc;transition:border .25s}
.row[aria-pressed="true"] .radio{border:7px solid var(--ink)}

/* lead (full-bleed hero) */
.hero{position:absolute;inset:0;z-index:0}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;display:block;animation:kb 18s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 26%,rgba(0,0,0,.5) 44%,rgba(0,0,0,.86) 100%)}
.lead{position:relative;z-index:1;margin-top:auto;padding:0 24px 28px;color:#fff;display:flex;flex-direction:column;gap:18px}
.lead h1{margin:8px 0 0;font-size:42px;font-weight:500;line-height:1.02;letter-spacing:-.045em}
.lead p{margin:0;font-size:16px;line-height:1.45;color:rgba(255,255,255,.86)}
.field{display:flex;flex-direction:column;gap:4px}
.field span{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.field input{border:0;border-bottom:1px solid rgba(255,255,255,.5);padding:8px 0 10px;font-size:18px;color:#fff;background:transparent;outline:none;border-radius:0}
.field input::placeholder{color:rgba(255,255,255,.5)}
.field input:focus{border-bottom-color:#fff}
.err{font-size:13px;color:#ffd7cf;min-height:0}
.lead .fine{margin:0;font-size:11px;line-height:1.5;color:rgba(255,255,255,.75)}
.lead .cta{flex:none}
.err:empty{display:none}

/* shade */
.shade-hero{position:relative;height:270px;flex:none;background:var(--ink);overflow:hidden}
.shade-hero img{width:100%;height:100%;object-fit:cover;display:block;animation:grow .45s cubic-bezier(.2,.8,.2,1) both}
.shade-hero .m{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:72px;font-weight:600;letter-spacing:-.04em}
.chip{position:absolute;top:14px;left:24px;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.92);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.tabs{display:flex;justify-content:space-between;margin:24px 24px 0;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:9px 0;font-size:14px;font-weight:500;color:var(--ink-3);transition:color .2s,box-shadow .2s}
.tab[aria-pressed="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:20px 24px 4px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;padding:0;border:0;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.tile img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.tile .mono{width:100%;height:100%;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.tile[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink);transform:scale(1.04)}
.tile .ai{position:absolute;top:-7px;right:-7px;height:16px;padding:0 5px;border-radius:8px;background:var(--ink);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center}

/* length */
.inches{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px}
.inches b{font-size:64px;font-weight:300;letter-spacing:-.05em;line-height:.9}
.inches span{font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--ink);padding-bottom:8px;text-align:right}
input[type=range]{width:100%;margin:18px 0 6px;accent-color:var(--ink)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)}

/* try-on */
.frame{position:relative;flex:1;min-height:0;margin:0 12px;border-radius:28px;overflow:hidden;background:var(--surface);display:flex;align-items:center;justify-content:center}
.frame img.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .oval{width:58%;aspect-ratio:3/4;border-radius:50%;border:1.5px dashed #c7c7cc}
.frame.dark{background:#111}
.frame .shade-dot{position:absolute;left:18px;bottom:18px;display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;font-weight:500}
.frame .shade-dot img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.seg{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.35);z-index:2}
.seg button{height:32px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:#fff;font-size:13px;font-weight:500}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600}
.spinner{width:56px;height:56px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .9s linear infinite}
.file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.matches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.match{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:transparent;text-align:left}
.match img{width:100%;aspect-ratio:1/1;max-width:100%;object-fit:cover;border-radius:10px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s}
.match[aria-pressed="true"] img{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.match span{display:flex;flex-direction:column;gap:1px;min-width:0}
.match b{font-size:13px;font-weight:600}
.match small{font-size:11px;color:var(--ink-3)}
.incl{margin-top:20px;border-top:1px solid var(--line)}
.incl div{display:flex;flex-direction:column;gap:4px;padding:16px 0;border-bottom:1px solid var(--line)}
.incl b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.incl span{font-size:14px;line-height:1.45;color:var(--ink-2)}
.scarce{margin:30px 0 10px;padding:18px 20px;border-radius:18px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:8px}
.scarce .eyebrow{color:rgba(255,255,255,.7)}
.scarce p{margin:0;font-size:15px;line-height:1.45}
.status{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink)}
.status span{flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:#b07a2a}
.status.ok span{background:#2f7d4f}
.rail2{display:flex;gap:10px;overflow-x:auto;padding:16px 24px 8px;scrollbar-width:none}
.rail2::-webkit-scrollbar{display:none}
.rail2 button{position:relative;flex:none;width:52px;height:52px;padding:0;border:0;border-radius:12px;background:#fff;box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s,transform .2s}
.rail2 button img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.rail2 button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink);transform:scale(1.05)}
.rail2 i{position:absolute;top:-6px;right:-6px;height:16px;padding:0 5px;border-radius:8px;background:var(--ink);color:#fff;font-size:9px;font-style:normal;font-weight:700;display:flex;align-items:center}
.lenfig{position:relative;flex:none}
.lenfig img{display:block;width:100%;height:auto}
.mark{position:absolute;left:43%;right:20px;transform:translateY(-50%);display:flex;align-items:center;gap:12px;padding:8px 0;border:0;background:transparent;color:#fff;opacity:.5;text-shadow:0 1px 8px rgba(0,0,0,.45);transition:opacity .3s}
.mark .ln{position:relative;flex:1;height:1px;background:currentColor;box-shadow:0 0 6px rgba(0,0,0,.35)}
.mark .ln::before{content:"";position:absolute;left:-4px;top:-3px;width:7px;height:7px;border-radius:50%;background:currentColor}
.mark .lb{min-width:44px;text-align:right;font-size:14px;font-weight:400;letter-spacing:-.01em;transition:font-size .3s}
.mark.on{opacity:1}
.mark.on .lb{font-size:22px;font-weight:500}
.rail{display:flex;gap:10px;overflow-x:auto;padding:6px 24px 4px;scrollbar-width:none;flex:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:42px;height:42px;border-radius:50%;padding:0;border:0;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line);transition:box-shadow .2s,transform .2s}
.rail button img{width:100%;height:100%;object-fit:cover;display:block}
.rail button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink);transform:scale(1.06)}
canvas.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo-note{position:absolute;right:14px;bottom:18px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.8)}

/* reserve */
.look{display:flex;gap:14px;align-items:center}
.look img,.look .mono{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none;background:var(--ink)}
.summary{margin-top:28px;border-radius:18px;background:var(--surface);padding:2px 18px}
.summary div{display:flex;justify-content:space-between;gap:16px;padding:13px 0;font-size:15px;border-bottom:1px solid var(--line)}
.summary div:last-child{border-bottom:0;font-weight:600}
.summary span:first-child{color:var(--ink-2)}
.summary span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.check{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;background:var(--surface);transition:background .2s,color .2s}
.row[aria-pressed="true"] .check{background:var(--ink);color:#fff}
.ticks-list{display:flex;flex-direction:column;gap:10px;margin-top:24px;font-size:14px;line-height:1.4}
.ticks-list div{display:flex;gap:10px}
.small{font-size:11px;line-height:1.5;color:var(--ink-3);margin-top:22px}

/* pay sheet */
.paywrap{position:absolute;inset:0;z-index:6}
.paywrap .scrim{position:absolute;inset:0;background:rgba(0,0,0,.32);animation:fade .3s both}
.pay{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));border-radius:30px;background:#fff;padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 40px rgba(0,0,0,.18);animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.pay .line{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.pay .line span:first-child{color:var(--ink-2)}
.pay .total{display:flex;justify-content:space-between;font-size:22px;font-weight:600;letter-spacing:-.02em;padding-top:4px}
.paybtn{height:54px;border:0;border-radius:14px;background:#000;color:#fff;font-size:17px;font-weight:600}
.state{height:54px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px}

/* confirmation, booking, thanks */
.timeline{list-style:none;margin:36px 0 0;padding:0}
.timeline li{display:flex;gap:16px}
.timeline .rail{display:flex;flex-direction:column;align-items:center}
.timeline .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);margin-top:4px}
.timeline .dot.done{background:var(--ink)}
.timeline .bar{flex:1;width:1px;background:var(--line-2);margin:6px 0}
.timeline .txt{padding-bottom:24px;display:flex;flex-direction:column;gap:3px}
.timeline .txt b{font-size:16px;font-weight:500}
.receipt{margin-top:28px;padding:18px;border-radius:18px;background:var(--surface);display:flex;gap:14px;align-items:center}
.receipt img,.receipt .mono{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--ink)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.day{height:72px;border:1px solid var(--line-2);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:background .2s,color .2s}
.day small{font-size:12px;color:var(--ink-2)}
.day b{font-size:20px;font-weight:500}
.day[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.day[aria-pressed="true"] small{color:rgba(255,255,255,.75)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.time{height:48px;border:1px solid var(--line-2);border-radius:12px;background:#fff;font-size:15px}
.time[aria-pressed="true"]{border:1.5px solid var(--ink);font-weight:600}
.meddy{display:flex;gap:14px;align-items:center;margin-top:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none}
.appt{margin-top:32px;border-radius:20px;background:var(--surface);padding:22px;display:flex;gap:20px}
.appt .date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;flex:none;border-right:1px solid #e3e0dc;padding-right:18px}
.appt .date b{font-size:36px;font-weight:400;letter-spacing:-.04em;line-height:1.05}
.prep div{padding:16px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45}
.bubble{margin-top:26px;display:flex;gap:10px;align-items:flex-end}
.bubble .l{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.bubble .b{background:var(--bubble);border-radius:20px 20px 20px 6px;padding:12px 15px;font-size:15px;line-height:1.42}

@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.98)}}
@keyframes enter{from{opacity:0;transform:translateY(14px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes grow{from{opacity:.4;transform:scale(1.06)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.06) translateY(-1%)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<header class="site-nav">
  <div class="wordmark">MMA SALON</div>
  <nav aria-label="Site"><a href="https://www.mmasalon.com/balayage-miami" target="_top">Color</a><a href="https://www.mmasalon.com/hair-extensions-miami" target="_top">Extensions</a><a href="https://www.mmasalon.com/book" target="_top">Book</a></nav>
</header>
<main class="site" id="studio">
  <div>
    <div class="eyebrow">Luxury hair extensions &#xb7; Miami Beach</div>
    <h1>Longer. Fuller. Invisible.</h1>
    <p>Seamless hair, matched to your color and placed by hand. See it on your selfie before you sit.</p>
    <button class="pill" type="button" data-open>See it on me</button>
  </div>

let segP = null;
const b64bytes = s => Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0));
function getSeg(){
  if (!segP) segP = (async () => {
    const base = new URL('./vision/', location.href).href;
    const v = await import(base + 'vision_bundle.mjs');
    const files = await v.FilesetResolver.forVisionTasks(base + 'wasm');
    const opts = buf => ({ baseOptions: { modelAssetBuffer: buf, delegate: 'CPU' }, runningMode: 'IMAGE', outputCategoryMask: false, outputConfidenceMasks: true });
    const hairBuf = b64bytes(await (await fetch(base + 'hair_segmenter.b64.txt')).text());
    const hair = await v.ImageSegmenter.createFromOptions(files, opts(hairBuf));
    let multi = null;   // hair, face skin, body skin and clothes: tells true hair from skin of the same tone
    try {
      const parts = await Promise.all(['multiclass-1.b64.txt','multiclass-2.b64.txt'].map(async f => (await fetch(base + f)).text()));
      multi = await v.ImageSegmenter.createFromOptions(files, opts(b64bytes(parts.join(''))));
    } catch (e) { console.warn('multiclass model unavailable', e); }
    return { hair, multi };
  })();
  return segP;
}

  const g = c.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(v, 0, 0);
  const url = c.toDataURL('image/jpeg', .92); stopCamera(); S.cam = ''; makeLook(url);
}
async function makeLook(selfie){
  S.selfie = selfie; S.compare = 'after'; S.analyzing = true; render();
  const started = Date.now();
  try { PHOTO = await preparePhoto(selfie || 'img/sample.jpg'); S.engine = PHOTO.hairShare > .01 ? 'on' : 'nohair'; }
  catch (e) { console.warn('try-on engine', e); S.engine = 'off'; PHOTO = await preparePhoto0(selfie || 'img/sample.jpg'); }
  let m = null; try { if (S.engine === 'on') m = await matchShades(PHOTO); } catch (e) { console.warn('match', e); }
  await new Promise(r => setTimeout(r, Math.max(0, 1800 - (Date.now() - started))));
  S.analyzing = false;
  if (m) { S.match = m.list; S.reading = m.reading; S.shade = m.list[0].code; S.fam = m.list[0].fam; }
  go('shade');
}
async function preparePhoto0(src){            // fallback: photo without a hair mask
  const img = await loadImg(src); const k = Math.min(1, 1100 / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.round(img.naturalWidth*k), h = Math.round(img.naturalHeight*k);
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); g.drawImage(img, 0, 0, w, h);
  return { w, h, orig: g.getImageData(0, 0, w, h), mask: new Float32Array(w*h), cdf: new Float32Array(256), Y: null, Ymid: null };
}
