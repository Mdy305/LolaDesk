<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Calendar — LolaDesk</title><link rel="stylesheet" href="app.css"/>
<style>
/* ═══════════════════════════════════════════════════════════════
   Calendar OS — Apple-grade schedule surface
   Week strip · Week / Day / Agenda views · service-colored cards
   with client avatars and status pills · Apple sheet modal
   ═══════════════════════════════════════════════════════════════ */
:root{--spring:cubic-bezier(.22,1,.36,1);--spring-snap:cubic-bezier(.3,1.4,.5,1)}

/* ── Week strip (date rail) ── */
.week-strip{display:flex;gap:8px;margin:0 0 18px}
.wday{flex:1;min-width:0;text-align:center;padding:12px 4px 10px;border:.5px solid var(--border);border-radius:16px;background:var(--surface);backdrop-filter:blur(20px);cursor:pointer;transition:all .25s var(--spring);position:relative;overflow:hidden}
.wday:hover{border-color:var(--border2);transform:translateY(-1px)}
.wday .wd{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-weight:600;margin-bottom:5px}
.wday .wn{font-size:21px;font-weight:300;letter-spacing:-.02em;color:var(--text)}
.wday .wc{font-size:10px;color:var(--text3);margin-top:3px;height:12px}
.wday.today{border-color:rgba(242,242,244,.45);background:linear-gradient(180deg,rgba(242,242,244,.08),rgba(242,242,244,.02))}
.wday.today .wn{color:var(--accent);text-shadow:0 0 18px rgba(242,242,244,.35)}
.wday.today::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px rgba(242,242,244,.6)}
.wday.sel{border-color:var(--border2)}
.wday .wd-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(242,242,244,.7);margin-left:4px;vertical-align:middle}
@media(max-width:760px){.wday{padding:9px 2px 8px}.wday .wn{font-size:17px}.wday .wc{display:none}}

/* ── View switcher ── */
.view-switch{display:inline-flex;gap:2px;background:var(--surface);border:.5px solid var(--border);border-radius:999px;padding:3px;backdrop-filter:blur(20px)}
.view-switch button{border:0;background:transparent;color:var(--text2);font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:999px;cursor:pointer;transition:all .2s var(--spring)}
.view-switch button.on{background:var(--accent);color:#10140a;box-shadow:0 4px 14px rgba(242,242,244,.25)}

/* ── Calendar grid ── */
/* Phone: the header never widens the page; every control is thumb-sized. */
@media(max-width:760px){
  .cal-nav,.cal-links{flex-wrap:wrap;row-gap:8px}
  .cal-links{width:100%}
  .cal-links .primary{flex:1 1 100%;min-height:44px;order:-1}
  .view-switch button{min-height:36px}
}
.cal-wrap{background:var(--surface);border:.5px solid var(--border);border-radius:20px;overflow:auto;min-height:520px;box-shadow:0 22px 60px rgba(0,0,0,.3)}
.cal-grid{display:grid;min-width:700px}
.cal-corner{position:sticky;top:0;left:0;z-index:20;background:var(--bg2);border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);height:64px}
.cal-head{position:sticky;top:0;z-index:10;background:var(--bg2);border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);height:64px;padding:14px 12px}
.cal-head .nm{font-weight:600;font-size:13px}
.cal-head .ro{font-size:11px;color:var(--text3);margin-top:2px}
.cal-time{position:sticky;left:0;z-index:5;background:var(--surface);border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);height:64px;padding:6px 8px;text-align:right;font-size:10.5px;color:var(--text3)}
.cal-slot{border-right:.5px solid var(--border);border-bottom:.5px solid var(--border);height:64px;position:relative;cursor:pointer;transition:background .15s}
.cal-slot:hover{background:rgba(242,242,244,.04)}
.cal-slot:hover::after{content:"+ book";position:absolute;top:6px;left:8px;font-size:10px;color:var(--accent);font-weight:500;letter-spacing:.04em}

/* ── Appointment card ── */
.appt{position:absolute;left:5px;right:5px;border-radius:12px;padding:7px 9px;font-size:11px;line-height:1.35;cursor:pointer;overflow:hidden;border-left:3px solid var(--svc,var(--accent));background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));backdrop-filter:blur(10px);z-index:4;transition:transform .18s var(--spring),box-shadow .18s var(--spring);animation:apptIn .35s var(--spring-snap) both}
@keyframes apptIn{from{opacity:0;transform:scale(.96) translateY(3px)}to{opacity:1;transform:none}}
.appt:hover{box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:10;transform:translateY(-1px)}
.appt .at{font-size:9.5px;color:var(--text3);display:flex;align-items:center;gap:5px}
.appt .svc{font-weight:600;color:var(--text);font-size:11.5px;margin:2px 0 1px;display:flex;align-items:center;gap:6px}
.appt .cli{font-size:10.5px;color:var(--text2);display:flex;align-items:center;gap:6px}
.appt .ca{width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--svc,var(--accent)),#1a1a1a);display:inline-flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:700;color:#080808;flex-shrink:0}
.appt .st{margin-left:auto;font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px}
.appt .st.confirmed{background:rgba(242,242,244,.14);color:var(--accent)}
.appt .st.completed{background:rgba(255,255,255,.1);color:var(--text2)}
.appt .st.pending{background:rgba(255,179,64,.14);color:var(--warning)}
.appt .st.cancelled{background:rgba(255,115,105,.14);color:var(--danger)}
.appt .st.in_progress{background:rgba(96,165,250,.14);color:var(--info)}
.appt .st.no_show{background:rgba(255,115,105,.2);color:var(--danger)}
.appt.no_show{opacity:.6;border-left-color:var(--danger)}
.svc-list{display:flex;flex-direction:column;gap:2px;max-height:168px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.svc-opt{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px}
.svc-opt:hover{background:rgba(255,255,255,.04)}
.svc-opt input{accent-color:var(--accent)}
.svc-nm{flex:1}
.svc-meta{color:var(--text3);font-size:11px}
.svc-summary{font-size:11px;color:var(--accent);margin-top:6px;min-height:14px}
.appt.cancelled{opacity:.45;border-left-color:var(--danger)}
.appt.completed{opacity:.6}

/* ── Now line ── */
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:8;pointer-events:none}
.now-line::before{content:'';position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* ── Blocked time (lunch, breaks, days off) ── */
.cal-block{position:absolute;left:5px;right:5px;border-radius:12px;padding:7px 9px;font-size:10.5px;line-height:1.35;cursor:pointer;overflow:hidden;z-index:5;color:var(--text2);border:1px dashed rgba(255,159,10,.35);background:repeating-linear-gradient(45deg,rgba(255,159,10,.10),rgba(255,159,10,.10) 6px,rgba(255,159,10,.03) 6px,rgba(255,159,10,.03) 12px);backdrop-filter:blur(8px);transition:transform .18s var(--spring),box-shadow .18s var(--spring);animation:apptIn .35s var(--spring-snap) both}
.cal-block:hover{box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:10;transform:translateY(-1px)}
.cal-block .bk-t{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.cal-block .bk-n{font-weight:600;color:var(--text);font-size:11px;margin-top:1px}
.cal-block:hover .bk-x{display:inline}
.bk-x{display:none;margin-left:5px;color:var(--danger);font-weight:700}
.wk-block{display:inline-flex;align-items:center;gap:5px;margin:6px 8px 2px;padding:4px 8px;border-radius:8px;border:1px dashed rgba(255,159,10,.35);background:rgba(255,159,10,.08);color:var(--text2);font-size:10px;cursor:pointer}
.wk-block:hover{color:var(--warning)}
.block-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:.5px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.block-btn:hover{border-color:rgba(255,159,10,.4);color:var(--warning)}
.bk-day-off{color:var(--warning);font-size:10px;font-weight:650}

/* ── Week view ── */
.week-grid{display:grid;min-width:760px}
.wk-day{border-right:.5px solid var(--border);min-height:440px;position:relative}
.wk-day-head{position:sticky;top:0;z-index:6;background:var(--bg2);border-bottom:.5px solid var(--border);padding:12px 10px;display:flex;align-items:baseline;gap:7px;backdrop-filter:blur(20px)}
.wk-day-head .wn{font-size:17px;font-weight:300}
.wk-day-head .wd{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.wk-day.today .wk-day-head{border-bottom-color:rgba(242,242,244,.4)}
.wk-day.today .wk-day-head .wn{color:var(--accent)}
.wk-appt{margin:8px 8px 6px;padding:8px 10px;border-radius:12px;border-left:3px solid var(--svc,var(--accent));background:rgba(255,255,255,.045);cursor:pointer;transition:transform .18s var(--spring);animation:apptIn .35s var(--spring-snap) both}
.wk-appt:hover{transform:translateY(-1px);background:rgba(255,255,255,.07)}
.wk-appt .t{font-size:10px;color:var(--text3)}
.wk-appt .n{font-size:12px;font-weight:600;margin:1px 0}
.wk-appt .c{font-size:10.5px;color:var(--text2)}
.wk-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--text3);font-size:11.5px;pointer-events:none}

/* ── Agenda view ── */
.agenda{display:flex;flex-direction:column}
.ag-item{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:.5px solid var(--border);cursor:pointer;transition:background .15s;animation:apptIn .4s var(--spring) both}
.ag-item:hover{background:rgba(255,255,255,.03)}
.ag-item .ag-t{width:64px;font-size:12.5px;font-weight:600;color:var(--text);flex-shrink:0}
.ag-item .ag-t small{display:block;font-size:10px;color:var(--text3);font-weight:400}
.ag-item .ag-cli{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.ag-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--svc,var(--accent)),#2a2a2a);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#080808;flex-shrink:0}
.ag-item .ag-name{font-size:14px;font-weight:600;color:var(--text)}
.ag-item .ag-meta{font-size:12px;color:var(--text2);margin-top:1px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-item .ag-amt{margin-left:auto;font-size:14px;font-weight:600;color:var(--text);flex-shrink:0}
.ag-item .ag-amt small{display:block;font-size:9.5px;color:var(--text3);font-weight:400;text-align:right}

/* ── Modal / Apple sheet ── */
.mw{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(18px);display:grid;align-items:end;justify-items:center;z-index:100;padding:0;opacity:0;transition:opacity .22s ease;pointer-events:none}
@media(min-width:640px){.mw{align-items:center;padding:20px}}
.mw.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg2);border:.5px solid var(--border);border-top-left-radius:28px;border-top-right-radius:28px;padding:14px 24px calc(20px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:88vh;overflow-y:auto;transform:translateY(40px) scale(.98);transition:transform .3s var(--spring)}
@media(min-width:640px){.modal{border-radius:24px;padding:26px;max-height:90vh;transform:translateY(14px) scale(.98)}}
.mw.open .modal{transform:none}
.modal .grab{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);margin:2px auto 16px}
@media(min-width:640px){.modal .grab{display:none}}
.modal-kicker{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:rgba(242,242,244,.75);margin-bottom:6px;font-weight:600}
.modal h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.modal .msub{font-size:12.5px;color:var(--text3);margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.fld input,.fld select,.fld textarea{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;font-family:inherit;width:100%;transition:border-color .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:rgba(242,242,244,.5);box-shadow:0 0 0 3px rgba(242,242,244,.07)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.macts{display:flex;gap:10px;margin-top:8px}
.macts button{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:650;cursor:pointer;border:none;transition:transform .12s var(--spring)}
.macts button:active{transform:scale(.97)}
.macts .ghost{background:transparent;border:.5px solid var(--border);color:var(--text2)}
.macts .primary{background:var(--accent);color:#10140a;box-shadow:0 4px 16px rgba(242,242,244,.25)}
.macts .primary:hover{background:var(--accent2)}
.macts .danger{background:transparent;border:.5px solid rgba(255,115,105,.35);color:var(--danger)}
.mstatus{font-size:12px;color:var(--text3);margin-top:10px;min-height:16px}
.mstatus.err{color:var(--danger)}
.detail-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(255,255,255,.05);font-size:13.5px}
.detail-row .dr-l{width:86px;color:var(--text3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
.detail-row .dr-v{color:var(--text);font-weight:500}
.detail-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#565658);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#080808}

/* Empty */
.empty-cal{padding:80px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:2}
.empty-cal a{color:var(--accent2);text-decoration:none}
.empty-cal a:hover{text-decoration:underline}

/* ── Waitlist ── */
.wl-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:.5px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s}
.wl-btn:hover{border-color:rgba(242,242,244,.35);color:var(--text)}
.wl-badge{min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:#10140a;font-size:10px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.wl-badge.zero{background:rgba(255,255,255,.1);color:var(--text3)}
.wl-list{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto}
.wl-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:.5px solid var(--border);border-radius:14px;background:var(--surface);animation:apptIn .3s var(--spring-snap) both}
.wl-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--info),#1a1a1a);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#080808;flex-shrink:0}
.wl-info{flex:1;min-width:0}
.wl-name{font-size:13.5px;font-weight:650;color:var(--text)}
.wl-meta{font-size:11.5px;color:var(--text3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-acts{display:flex;gap:8px;flex-shrink:0}
.wl-offer{padding:8px 13px;border-radius:10px;border:none;background:var(--accent);color:#10140a;font-size:12px;font-weight:650;cursor:pointer;font-family:inherit;transition:transform .12s var(--spring)}
.wl-offer:hover{transform:translateY(-1px)}
.wl-rm{width:28px;height:28px;border-radius:9px;border:none;background:rgba(255,255,255,.06);color:var(--text3);font-size:12px;cursor:pointer;font-family:inherit}
.wl-rm:hover{color:var(--danger);background:rgba(255,115,105,.12)}
/* ── Day grid internals (salon-time columns, drag, lanes) ── */
.cal-times{position:sticky;left:0;z-index:6;background:var(--surface)}
.day-col{position:relative;border-right:.5px solid var(--border);cursor:pointer}
.day-col .cal-slot{border-right:0;cursor:pointer}
.day-col.unassigned{background:repeating-linear-gradient(0deg,transparent 0 63px,rgba(255,255,255,.015) 63px 64px)}
.cal-head.unassigned .nm{color:var(--text2);font-style:italic}
.off-hours{position:absolute;left:0;right:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,rgba(0,0,0,.34) 0 7px,rgba(0,0,0,.22) 7px 14px)}
.off-hours span{position:absolute;top:6px;left:8px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);font-weight:700}
.appt .proc{position:absolute;left:0;right:0;z-index:-1;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 5px,rgba(255,255,255,.02) 5px 10px);border-top:1px dashed rgba(255,255,255,.14);border-bottom:1px dashed rgba(255,255,255,.14);pointer-events:none}
.appt .proc span{position:absolute;right:6px;bottom:2px;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.wk-appt .badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.appt .cli .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.appt .cli .badges{margin-left:auto;display:inline-flex;gap:3px;flex:none}
.appt .rs-h{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;touch-action:none}
.appt .rs-h::after{content:'';position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:3px;background:rgba(255,255,255,.18);opacity:0;transition:opacity .15s}
.appt:hover .rs-h::after{opacity:1}
.appt.dragging{z-index:40;opacity:.92;box-shadow:0 16px 40px rgba(0,0,0,.6);transition:none;cursor:grabbing;animation:none}
.appt.drag-bad{outline:2px solid var(--danger);outline-offset:1px}
.appt.saving{opacity:.55;pointer-events:none}
.appt .st.checked_in,.st.checked_in{background:rgba(48,209,88,.14);color:#30d158}
.st{font-size:8.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:999px;background:rgba(242,242,244,.14);color:var(--accent);white-space:nowrap}
.st.pending{background:rgba(255,179,64,.14);color:var(--warning)}.st.cancelled,.st.no_show{background:rgba(255,115,105,.16);color:var(--danger)}
.st.in_progress{background:rgba(96,165,250,.14);color:var(--info)}.st.completed{background:rgba(255,255,255,.1);color:var(--text2)}
.wk-appt .st{margin-left:4px}
.appt-st .st{font-size:9px;padding:3px 9px;letter-spacing:.08em}
.src,.dep{display:inline-flex;align-items:center;font-size:8.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:999px;border:.5px solid var(--border2);color:var(--text2);white-space:nowrap}
.src.lola{color:#ccff00;border-color:rgba(204,255,0,.35);background:rgba(204,255,0,.06)}
.src.web{color:var(--info);border-color:rgba(90,200,250,.3)}
.src.ext{color:var(--text3);border-style:dashed}
.dep.ok{color:#30d158;border-color:rgba(48,209,88,.35)}.dep.due{color:var(--warning);border-color:rgba(255,179,64,.35)}.dep.mut{color:var(--text3)}
.ext-appt{position:absolute;border-radius:12px;padding:6px 9px;font-size:10.5px;line-height:1.35;overflow:hidden;z-index:3;color:var(--text2);background:repeating-linear-gradient(135deg,rgba(150,150,160,.14) 0 6px,rgba(150,150,160,.08) 6px 12px);border:1px solid rgba(160,160,170,.25);border-left:3px solid #6b6b73;cursor:default}
.ext-appt .at{font-size:9.5px;color:var(--text3)}
.ext-appt .ex-p{font-weight:650;color:var(--text2);text-transform:capitalize;margin-top:1px}
.ext-appt .ex-n{font-size:9.5px;color:var(--text3)}
.wk-appt.ext,.ag-item.ext{opacity:.7;border-left-color:#6b6b73;background:rgba(150,150,160,.06);cursor:default}
.wk-appt.no_show{opacity:.6;border-left-color:var(--danger)}
.drag-tip{position:fixed;z-index:9999;pointer-events:none;background:rgba(20,20,22,.95);border:.5px solid var(--border2);color:var(--text);font-size:11.5px;font-weight:600;padding:6px 10px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

<script>
const SLOT_H=64,UNASSIGNED='__none';
// Grid range in salon-local minutes — recomputed per day from the staff's
// working hours (earliest start → latest end), widened to fit any booking.
let START=8,END=21,RANGE={s:8*60,e:21*60};
// `cursor` carries the SELECTED SALON-LOCAL CALENDAR DATE as a browser-local
// midnight, so isoDay(cursor) is that date key. It is never used as an instant.
let cursor=new Date();cursor.setHours(0,0,0,0);
let VIEW=(()=>{try{return localStorage.getItem('lola_cal_view')||'week';}catch(e){return 'week';}})();
let STATE={bookings:[],services:[],staff:[],start:null,days:7,blocked_slots:[],external:[]};
let CTX={hours:{start_min:8*60,end_min:21*60},schedules:[],time_off:[],external:[],can_override:true};
let STAFF_FILTER=(()=>{try{return localStorage.getItem('lola_cal_staff')||'';}catch(e){return '';}})();
let MOBILE_COL=0;
const MQ=window.matchMedia?window.matchMedia('(max-width:760px)'):{matches:false,addEventListener(){}};
function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||'';}
function hdr(){return{'Content-Type':'application/json',Authorization:'Bearer '+token()};}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isoDay(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function curKey(){return isoDay(cursor);}
function setCursorKey(key){cursor=new Date(key+'T00:00:00');}
// ── Salon time ────────────────────────────────────────────────────────────
// Everything on this page is in the SALON's timezone (booking_settings.timezone),
// never the browser's: an owner checking the calendar from Los Angeles sees the
// New York salon's 2 PM as 2 PM, and a time she types is New York time.
let SALON_TZ='America/New_York';
function setTz(tz){if(!tz)return;try{new Intl.DateTimeFormat('en-US',{timeZone:tz});SALON_TZ=tz;}catch(e){}}
function localDayKey(d){try{return new Intl.DateTimeFormat('en-CA',{timeZone:SALON_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d);}catch{return isoDay(d);}}
function todayKey(){return localDayKey(new Date());}
function salonParts(v){const p={};try{new Intl.DateTimeFormat('en-US',{timeZone:SALON_TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v)).forEach(x=>{p[x.type]=x.value;});}catch(e){}return {key:p.year+'-'+p.month+'-'+p.day,min:(Number(p.hour)%24)*60+Number(p.minute)};}
function salonMin(v){return salonParts(v).min;}
function fmtT(v){try{return new Intl.DateTimeFormat('en-US',{timeZone:SALON_TZ,hour:'numeric',minute:'2-digit'}).format(new Date(v));}catch(e){return '';}}
function fmtWhen(v){try{return new Intl.DateTimeFormat('en-US',{timeZone:SALON_TZ,weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(v));}catch(e){return '';}}
// A date KEY rendered as a calendar date (UTC noon — immune to the browser zone).
function fmtKey(key,opts){return new Date(key+'T12:00:00Z').toLocaleDateString([],{...opts,timeZone:'UTC'});}
function keyDow(key){return new Date(key+'T12:00:00Z').getUTCDay();}
function addDaysKey(key,n){const [y,m,d]=key.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10);}
function mondayOf(key){return addDaysKey(key,-((keyDow(key)+6)%7));}
function hhmm(min){min=Math.max(0,Math.min(1439,Math.round(min)));return String(Math.floor(min/60)).padStart(2,'0')+':'+String(min%60).padStart(2,'0');}
function minLabel(min){const h=Math.floor(min/60)%24,m=min%60,ap=h>=12?'PM':'AM';return (h%12||12)+(m?':'+String(m).padStart(2,'0'):'')+' '+ap;}
function fmtDur(mins){if(!mins)return '60 min';if(mins>=60)return (mins/60>=10?Math.round(mins/60):(mins/60).toFixed(1).replace(/\.0$/,''))+'h';return mins+'m';}
function spanMin(b){return Math.round((new Date(b.end_time)-new Date(b.start_time))/60000)||(b.service?.duration_minutes||60);}
function toMin(t){const[h,m]=String(t).split(':').map(Number);return h*60+(m||0);}
function blockLabel(b){const allDay=!b.start_time&&!b.end_time;const t=b.start_time&&b.end_time?(' · '+b.start_time.slice(0,5)+'–'+b.end_time.slice(0,5)):'';return (allDay?'Day off':(b.reason||'Blocked'))+t;}
function initials(name){return String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function svcColor(id){if(!id)return 'var(--accent)';const pal=['var(--accent)','var(--info)','var(--warning)','#bf5af2','var(--danger)','#30d158','#64d2ff','var(--warning)'];let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return pal[h%pal.length];}
function toast(msg,type){if(window.LolaUX)window.LolaUX.toast(msg,{type:type||'success',duration:type==='error'?5200:3600});}
function clientName(c){if(!c)return 'Client';return c.name||[c.first_name,c.last_name].filter(Boolean).join(' ')||'Client';}
function clientPhone(c){if(!c)return '';const p=c.phone||c.phone_number||'';return String(p).includes(':')?'':p;}
const STATUS_LABEL={pending:'pending',confirmed:'confirmed',checked_in:'arrived',in_progress:'in service',completed:'completed',no_show:'no-show',cancelled:'cancelled'};
function stClass(s){s=String(s||'confirmed');return STATUS_LABEL[s]?s:'confirmed';}
function stPill(s){const c=stClass(s);return '<span class="st '+c+'">'+STATUS_LABEL[c]+'</span>';}
// Where the booking came from: Lola (phone/SMS/chat), the website, the owner, or the salon's own platform.
const PROVIDERS=/square|vagaro|boulevard|fresha|mindbody|google|zapier|cal_platform|calendly|acuity|glossgenius|booksy|schedulicity|mangomint|external/i;
function srcInfo(b){
  const s=String(b.source||'').toLowerCase();
  if(b.external_provider&&!/^(dashboard|owner|lola|voice|sms|widget|public_widget|website)$/.test(s)&&PROVIDERS.test(s+' '+b.external_provider))return {k:'ext',l:String(b.external_provider).replace(/_/g,' ')};
  if(/^(lola|voice|phone|call|sms|text|whatsapp|instagram|messenger|chat|ai|assistant|telnyx|vapi)/.test(s))return {k:'lola',l:'Lola'};
  if(/widget|website|web|online|link|google_reserve|public/.test(s))return {k:'web',l:'Website'};
  if(!s||/dashboard|owner|manual|pos|desk|calendar|walk/.test(s))return {k:'own',l:'Owner'};
  if(PROVIDERS.test(s))return {k:'ext',l:s.replace(/_/g,' ')};
  return {k:'own',l:s.replace(/_/g,' ')};
}
function srcBadge(b){const i=srcInfo(b);return '<span class="src '+i.k+'" title="Source: '+esc(i.l)+'">'+esc(i.l)+'</span>';}
function depPill(b){
  const d=String(b.deposit_status||'').toLowerCase();if(!d||d==='none'||d==='not_required')return '';
  const cls=/paid|kept|captured|succeeded/.test(d)?'ok':(/refund|released|void/.test(d)?'mut':'due');
  const lbl=cls==='ok'?'Deposit paid':(cls==='due'?'Deposit due':'Deposit '+d.replace(/_/g,' '));
  return '<span class="dep '+cls+'" title="Deposit: '+esc(d)+'">'+esc(lbl)+'</span>';
}
function provName(p){p=String(p||'External').replace(/_/g,' ');return p.charAt(0).toUpperCase()+p.slice(1);}
function isLive(b){return b&&b.status!=='cancelled';}
function staffById(id){return STATE.staff.find(s=>s.id===id)||null;}
function visibleStaff(){return STAFF_FILTER&&STATE.staff.some(s=>s.id===STAFF_FILTER)?STATE.staff.filter(s=>s.id===STAFF_FILTER):STATE.staff;}
function passesFilter(staffId){return !STAFF_FILTER||!STATE.staff.some(s=>s.id===STAFF_FILTER)||staffId===STAFF_FILTER;}
function canOverride(){return CTX.can_override!==false;}
function confirmDialog(opts){if(window.LolaUX)return window.LolaUX.confirm(opts);return Promise.resolve(window.confirm((opts.title||'')+'\n'+(opts.message||'')));}

async function getJSON(url){const r=await fetch(url,{headers:hdr()});const d=await r.json().catch(()=>({ok:false,error:'Bad response'}));return d;}
// Owner actions: book / move / status through /api/calendar-owner. A real
// double-booking of the same stylist comes back needs_confirmation → one
// clear "Book anyway" question → resent with force.
async function ownerPost(payload,{confirmTitle='Double-book this stylist?'}={}){
  const send=async(force)=>{
    try{const r=await fetch('/api/calendar-owner',{method:'POST',headers:hdr(),body:JSON.stringify({...payload,override:canOverride(),force:!!force})});return await r.json();}
    catch(e){return {ok:false,error:'Connection problem — nothing was saved.'};}
  };
  let d=await send(false);
  if(d&&!d.ok&&d.needs_confirmation){
    const go=await confirmDialog({title:confirmTitle,message:(d.error||'That stylist is already booked then.')+' Book it anyway?',confirmLabel:'Book anyway',danger:true});
    if(!go)return {ok:false,dismissed:true};
    d=await send(true);
  }
  return d||{ok:false,error:'Failed'};
}

async function loadContext(dateKey,days){
  try{
    const d=await getJSON('/api/calendar-owner?action=context'+(dateKey?'&date='+dateKey:'')+'&days='+(days||1));
    if(d&&d.ok){CTX=d;setTz(d.timezone);return d;}
  }catch(e){}
  return null;
}
async function load(){
  const sub=document.getElementById('calSub');
  document.getElementById('calDate').textContent=fmtKey(curKey(),{weekday:'long',month:'long',day:'numeric'});
  const isWeek=VIEW==='week';
  const startKey=isWeek?mondayOf(curKey()):curKey();
  sub.textContent=isWeek?'Loading week...':'Loading...';
  try{
    const [d]=await Promise.all([
      getJSON(isWeek?'/api/calendar?action=week&date='+startKey+'&days=7':'/api/calendar?action=day&date='+startKey),
      loadContext(startKey,isWeek?7:1)
    ]);
    if(!d.ok)throw new Error(d.error||'Failed');
    setTz(d.timezone||d.settings?.timezone);
    STATE={bookings:d.bookings||[],services:d.services||[],staff:d.staff||[],start:startKey,days:isWeek?(d.days||7):1,blocked_slots:d.blocked_slots||[],external:CTX.external||[]};
    renderStaffFilter();
    render();
  }catch(e){document.getElementById('calGrid').innerHTML='<div class="empty-cal">'+esc(e.message)+'</div>';sub.textContent='Error';}
}
function workMinutesFor(staffId,key){
  const s=(CTX.schedules||[]).find(x=>x.staff_id===staffId&&Number(x.day_of_week)===keyDow(key));
  return s?Math.max(0,toMin(s.end_time)-toMin(s.start_time)):0;
}
function render(){
  const {bookings,staff}=STATE;
  const sub=document.getElementById('calSub');
  renderWeekStrip();
  const active=bookings.filter(b=>isLive(b)&&b.status!=='no_show'&&passesFilter(b.staff_id));
  const rev=active.reduce((s,b)=>s+Number(b.total_amount||0),0);
  const mins=active.reduce((s,b)=>s+spanMin(b),0);
  const keys=VIEW==='week'?Array.from({length:7},(_,i)=>addDaysKey(STATE.start||curKey(),i)):[curKey()];
  const vis=visibleStaff();
  let cap=0;vis.forEach(s=>keys.forEach(k=>{cap+=workMinutesFor(s.id,k);}));
  if(!cap&&vis.length)cap=vis.length*keys.length*((CTX.hours?.end_min||1260)-(CTX.hours?.start_min||480));
  const working=(CTX.schedules||[]).length?vis.filter(s=>keys.some(k=>workMinutesFor(s.id,k)>0)).length:vis.length;
  document.getElementById('kCount').textContent=active.length;
  document.getElementById('kRev').textContent='$'+rev.toLocaleString();
  document.getElementById('kStaff').textContent=working;
  document.getElementById('kUtil').textContent=cap?Math.min(100,Math.round(mins/cap*100))+'%':'—';
  sub.textContent=active.length+' booking'+(active.length===1?'':'s')+' · '+staff.length+' staff · '+SALON_TZ.replace(/_/g,' ');
  if(VIEW==='agenda')return renderAgenda();
  if(VIEW==='day')return renderDay();
  return renderWeek();
}
function renderWeekStrip(){
  const strip=document.getElementById('weekStrip');
  const start=mondayOf(curKey()),today=todayKey();
  let html='';
  for(let i=0;i<7;i++){
    const k=addDaysKey(start,i);
    const count=STATE.bookings.filter(b=>isLive(b)&&passesFilter(b.staff_id)&&localDayKey(new Date(b.start_time))===k).length;
    html+='<div class="wday'+(k===today?' today':'')+(k===curKey()?' sel':'')+'" onclick="pickDay(\''+k+'\')">'
      +'<div class="wd">'+fmtKey(k,{weekday:'short'})+(k===today?'<span class="wd-dot"></span>':'')+'</div>'
      +'<div class="wn">'+Number(k.slice(8))+'</div><div class="wc">'+fmtKey(k,{month:'short'})+(count?' · '+count:'')+'</div></div>';
  }
  strip.innerHTML=html;
  strip.style.display='flex';
}
function renderStaffFilter(){
  const sel=document.getElementById('stfFilter');if(!sel)return;
  sel.innerHTML='<option value="">All stylists</option>'+STATE.staff.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===STAFF_FILTER?' selected':'')+'>'+esc(s.name)+'</option>').join('');
  sel.style.display=STATE.staff.length>1?'':'none';
}
function setStaffFilter(v){STAFF_FILTER=v||'';MOBILE_COL=0;try{localStorage.setItem('lola_cal_staff',STAFF_FILTER);}catch(e){}render();}
function pickDay(iso){setCursorKey(iso);if(VIEW==='week'){setView('day');return;}load();}
function loadDayWithBlocks(iso){setCursorKey(iso);VIEW='day';document.querySelectorAll('#viewSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.v==='day'));load();}
function setView(v){
  VIEW=v;try{localStorage.setItem('lola_cal_view',v);}catch(e){}
  document.querySelectorAll('#viewSwitch button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  load();
}
document.querySelectorAll('#viewSwitch button').forEach(b=>b.onclick=()=>setView(b.dataset.v));

/* ── Day view: stylist columns on the salon's own clock ── */
let DAYCOLS=[];
function dayItems(){
  const key=curKey();
  const bk=STATE.bookings.filter(b=>isLive(b)&&localDayKey(new Date(b.start_time))===key);
  const ex=(STATE.external||[]).filter(x=>localDayKey(new Date(x.starts_at))===key);
  return {bk,ex};
}
function itemSpan(startIso,endIso){
  const p=salonParts(startIso),s=p.key===curKey()?p.min:0;
  const e=Math.min(24*60,s+Math.max(5,Math.round((new Date(endIso)-new Date(startIso))/60000)));
  return {s,e};
}
// Overlapping appointments sit side by side (lanes), never on top of each other.
function layoutLanes(items){
  items.sort((a,b)=>a.s-b.s||b.e-a.e);
  let group=[],groupEnd=-1;
  const flush=()=>{const n=group.reduce((m,i)=>Math.max(m,i.lane+1),1);group.forEach(i=>{i.lanes=n;});group=[];groupEnd=-1;};
  for(const it of items){
    if(group.length&&it.s>=groupEnd)flush();
    const used=new Set(group.filter(g=>g.e>it.s).map(g=>g.lane));
    let l=0;while(used.has(l))l++;
    it.lane=l;group.push(it);groupEnd=Math.max(groupEnd,it.e);
  }
  if(group.length)flush();
  return items;
}
function placeLane(el,it){
  const n=it.lanes||1,i=it.lane||0;
  el.style.left='calc(5px + (100% - 10px) * '+(i/n)+')';

function renderDay(){
  const {staff,services}=STATE;
  const g=document.getElementById('calGrid');
  const sw=document.getElementById('stfSwitch');
  if(!staff.length){g.innerHTML='<div class="empty-cal">No active team members yet.<br><a href="team.html">Add your team</a> to start booking.</div>';document.getElementById('calSub').textContent='No staff';sw.innerHTML='';return;}
  if(!services.length){g.innerHTML='<div class="empty-cal">No services yet.<br><a href="services.html">Add your services</a> to start booking.</div>';document.getElementById('calSub').textContent='No services';sw.innerHTML='';return;}
  const key=curKey();
  const {bk,ex}=dayItems();
  const known=new Set(staff.map(s=>s.id));
  const colOf=id=>(id&&known.has(id))?id:UNASSIGNED;
  let cols=visibleStaff().map(s=>({id:s.id,name:s.name,role:s.role||'Stylist'}));
  if(bk.some(b=>colOf(b.staff_id)===UNASSIGNED)||ex.some(x=>colOf(x.staff_id)===UNASSIGNED))cols.push({id:UNASSIGNED,name:'Unassigned',role:'No stylist yet'});
  // Phone: one stylist at a time with a switcher.
  if(MQ.matches&&cols.length>1){
    MOBILE_COL=Math.max(0,Math.min(MOBILE_COL,cols.length-1));
    sw.innerHTML=cols.map((c,i)=>'<button class="'+(i===MOBILE_COL?'on':'')+'" onclick="MOBILE_COL='+i+';renderDay()">'+esc(c.name)+'</button>').join('');
    sw.style.display='flex';
    cols=[cols[MOBILE_COL]];
  }else{sw.innerHTML='';sw.style.display='none';}
  DAYCOLS=cols;
  // Range: earliest staff start → latest end that day, widened to fit every item.
  const sch=(CTX.schedules||[]).filter(s=>Number(s.day_of_week)===keyDow(key));
  let rs=sch.length?Math.min(...sch.map(s=>toMin(s.start_time))):(CTX.hours?.start_min??480);
  let re=sch.length?Math.max(...sch.map(s=>toMin(s.end_time))):(CTX.hours?.end_min??1260);
  const spans=[...bk.map(b=>itemSpan(b.start_time,b.end_time)),...ex.map(x=>itemSpan(x.starts_at,x.ends_at))];
  spans.forEach(sp=>{rs=Math.min(rs,sp.s);re=Math.max(re,sp.e);});
  const nowP=salonParts(new Date());
  if(nowP.key===key){rs=Math.min(rs,nowP.min);re=Math.max(re,nowP.min+30);}
  rs=Math.max(0,Math.floor(rs/60)*60);re=Math.min(24*60,Math.ceil(re/60)*60);if(re-rs<120)re=Math.min(24*60,rs+120);
  RANGE={s:rs,e:re};START=rs/60;END=re/60;
  const hours=(re-rs)/60,H=hours*SLOT_H;
  g.style.gridTemplateColumns='64px repeat('+cols.length+',minmax('+(MQ.matches?'0':'160px')+',1fr))';
  g.style.minWidth=MQ.matches?'0':'';
  let html='<div class="cal-corner"></div>';
  cols.forEach(c=>{
    const off=c.id!==UNASSIGNED&&(CTX.schedules||[]).length&&!sch.some(s=>s.staff_id===c.id);
    html+='<div class="cal-head'+(c.id===UNASSIGNED?' unassigned':'')+'"><div class="nm">'+esc(c.name)+'</div><div class="ro">'+(off?'<span class="bk-day-off">Off today</span>':esc(c.role))+'</div></div>';
  });
  html+='<div class="cal-times">';
  for(let h=0;h<hours;h++)html+='<div class="cal-time">'+minLabel(rs+h*60)+'</div>';
  html+='</div>';
  cols.forEach(c=>{
    html+='<div class="day-col'+(c.id===UNASSIGNED?' unassigned':'')+'" data-col="'+esc(c.id)+'" style="height:'+H+'px">';
    for(let h=0;h<hours;h++)html+='<div class="cal-slot" data-staff="'+esc(c.id)+'" data-hour="'+(rs/60+h)+'"></div>';
    html+='</div>';
  });
  g.innerHTML=html;
  const colEl=id=>g.querySelector('.day-col[data-col="'+(window.CSS&&CSS.escape?CSS.escape(id):id)+'"]');
  const top=m=>(m-rs)/60*SLOT_H;
  // Off-hours shading from staff schedules (and approved time off).
  if((CTX.schedules||[]).length)cols.forEach(c=>{
    if(c.id===UNASSIGNED)return;
    const col=colEl(c.id);if(!col)return;
    const s=sch.find(x=>x.staff_id===c.id);
    const shade=(a,b,label)=>{if(b<=a)return;const el=document.createElement('div');el.className='off-hours';el.style.top=top(a)+'px';el.style.height=(b-a)/60*SLOT_H+'px';if(label)el.innerHTML='<span>'+esc(label)+'</span>';col.appendChild(el);};
    if(!s)shade(rs,re,'Off');
    else{shade(rs,Math.max(rs,toMin(s.start_time)));shade(Math.min(re,toMin(s.end_time)),re);}
  });
  (CTX.time_off||[]).forEach(t=>{
    const col=colEl(t.staff_id);if(!col)return;
    const a=salonParts(t.start_time),b=salonParts(t.end_time);
    const s=a.key<key?rs:(a.key===key?a.min:null),e=b.key>key?re:(b.key===key?b.min:null);
    if(s==null||e==null||e<=s)return;
    const el=document.createElement('div');el.className='off-hours';el.style.top=top(Math.max(rs,s))+'px';el.style.height=(Math.min(re,e)-Math.max(rs,s))/60*SLOT_H+'px';el.innerHTML='<span>'+esc(t.reason||'Time off')+'</span>';col.appendChild(el);
  });
  // Blocked time — lunch, breaks, days off. A block with no stylist covers everyone.
  (STATE.blocked_slots||[]).filter(b=>String(b.blocked_date)===key).forEach(b=>{
    const targets=b.staff_id?[b.staff_id]:cols.filter(c=>c.id!==UNASSIGNED).map(c=>c.id);
    targets.forEach(sid=>{
      const col=colEl(sid);if(!col)return;
      const sMin=b.start_time?toMin(b.start_time):rs,eMin=b.end_time?toMin(b.end_time):re;
      const el=document.createElement('div');
      el.className='cal-block';
      el.style.cssText='top:'+top(Math.max(rs,sMin))+'px;height:'+Math.max(24,(Math.min(re,eMin)-Math.max(rs,sMin))/60*SLOT_H-5)+'px';
      const allDay=!b.start_time&&!b.end_time;
      el.innerHTML='<div class="bk-t">'+(allDay?'Day off':'Blocked')+'<span class="bk-x" title="Remove block">✕</span></div><div class="bk-n">'+esc(b.reason||'No reason')+'</div>';
      el.title=blockLabel(b)+(b.staff_id?(' — '+((staffById(b.staff_id)||{}).name||'')):' — everyone');
      el.onclick=ev=>{ev.stopPropagation();deleteBlock(b);};
      col.appendChild(el);
    });
  });
  // Appointments (+ the salon platform's, read-only), lane-laid per column.
  const perCol=new Map(cols.map(c=>[c.id,[]]));
  bk.forEach(b=>{const k=colOf(b.staff_id);if(perCol.has(k))perCol.get(k).push({kind:'b',b,...itemSpan(b.start_time,b.end_time)});});
  ex.forEach(x=>{const k=colOf(x.staff_id);if(perCol.has(k))perCol.get(k).push({kind:'x',x,...itemSpan(x.starts_at,x.ends_at)});});
  perCol.forEach((items,cid)=>{
    const col=colEl(cid);if(!col)return;
    layoutLanes(items).forEach(it=>{
      const h=Math.max(26,(it.e-it.s)/60*SLOT_H-5);
      if(it.kind==='x'){
        const x=it.x,el=document.createElement('div');
        el.className='ext-appt';el.style.top=top(it.s)+'px';el.style.height=h+'px';placeLane(el,it);
        el.title=(x.provider||'Platform')+' appointment (read-only) · '+fmtT(x.starts_at)+'–'+fmtT(x.ends_at);
        el.innerHTML='<div class="at">'+fmtT(x.starts_at)+' · '+fmtDur(it.e-it.s)+'</div><div class="ex-p">'+esc(provName(x.provider))+'</div><div class="ex-n">Booked on their platform</div>';
        el.onclick=ev=>{ev.stopPropagation();toast(provName(x.provider||'Platform')+' appointment '+fmtT(x.starts_at)+'–'+fmtT(x.ends_at)+' — edit it in '+(x.provider?provName(x.provider):'that platform')+'.');};
        col.appendChild(el);return;
      }
      const b=it.b,color=svcColor(b.service_id),dur=it.e-it.s;
      const el=document.createElement('div');
      el.className='appt '+stClass(b.status);el.dataset.bookingId=b.id||'';el.dataset.start=b.start_time||'';
      el.style.cssText='top:'+top(it.s)+'px;height:'+h+'px;--svc:'+color;placeLane(el,it);
      // Processing time (color developing): a lighter middle band the stylist can sell.
      const sv=b.service||{};const a1=Number(sv.active_duration_1_min||0),pr=Number(sv.processing_duration_min||0),a2=Number(sv.active_duration_2_min||0);
      let proc='';
      if(pr>0&&Math.abs(a1+pr+a2-dur)<=1)proc='<div class="proc" style="top:'+(a1/dur*100)+'%;height:'+(pr/dur*100)+'%"><span>processing</span></div>';
      el.innerHTML=proc+'<div class="at">'+fmtT(b.start_time)+' · '+fmtDur(dur)+stPill(b.status)+'</div>'
        +'<div class="svc"><span class="ca" style="background:'+color+'">'+esc(initials(clientName(b.client)))+'</span>'+esc(b.service?.name||'Appointment')+'</div>'
        +'<div class="cli"><span class="cn">'+esc(clientName(b.client))+(b.client?.is_vip?' <span style="color:var(--accent)">★</span>':'')+'</span><span class="badges">'+srcBadge(b)+depPill(b)+'</span></div>'
        +'<div class="rs-h" title="Drag to change the end time"></div>';
      el.onclick=ev=>{ev.stopPropagation();if(DRAG_JUST_ENDED)return;showDetail(b);};
      attachDrag(el,b,it,cid);
      col.appendChild(el);
    });
  });
  // Click empty grid → book that stylist at that quarter hour (salon time).
  g.querySelectorAll('.day-col').forEach(col=>{
    col.addEventListener('click',ev=>{
      if(ev.target.closest('.appt,.cal-block,.ext-appt'))return;
      const y=ev.clientY-col.getBoundingClientRect().top;
      const m=rs+Math.floor(y/SLOT_H*60/15)*15;
      quickBook(col.dataset.col===UNASSIGNED?'':col.dataset.col,m);
    });
  });
  if(nowP.key===key&&nowP.min>rs&&nowP.min<re){
    g.querySelectorAll('.day-col').forEach(col=>{const nl=document.createElement('div');nl.className='now-line';nl.style.top=top(nowP.min)+'px';col.appendChild(nl);});
  }
}

/* ── Drag to move (time + stylist) and drag to resize, salon-time aware ── */
let DRAG=null,DRAG_JUST_ENDED=false;
const SNAP=5;
function dragTip(text,bad,x,y){
  let t=document.getElementById('dragTip');
  if(!t){t=document.createElement('div');t.id='dragTip';t.className='drag-tip';document.body.appendChild(t);}
  if(text==null){t.remove();return;}
  t.textContent=text;t.classList.toggle('bad',!!bad);t.style.left=(x+14)+'px';t.style.top=(y+14)+'px';
}
function clashesIn(colId,s,e,selfId){
  if(colId===UNASSIGNED)return [];
  const key=curKey();
  const out=[];
  STATE.bookings.forEach(b=>{if(b.id===selfId||!isLive(b)||b.status==='no_show'||b.staff_id!==colId||localDayKey(new Date(b.start_time))!==key)return;const sp=itemSpan(b.start_time,b.end_time);if(sp.s<e&&s<sp.e)out.push(clientName(b.client));});
  (STATE.external||[]).forEach(x=>{if(x.staff_id!==colId||localDayKey(new Date(x.starts_at))!==key)return;const sp=itemSpan(x.starts_at,x.ends_at);if(sp.s<e&&s<sp.e)out.push(x.provider||'platform');});
  return out;
}
function attachDrag(el,b,it,colId){
  el.addEventListener('pointerdown',ev=>{
    if(ev.button!==0||b.status==='cancelled')return;
    const resize=ev.target.classList.contains('rs-h');
    // Touch: a tap opens the sheet and a swipe scrolls; the resize handle still drags.
    if(ev.pointerType==='touch'&&!resize)return;
    const col=el.parentElement;
    DRAG={el,b,resize,x0:ev.clientX,y0:ev.clientY,s0:it.s,dur:it.e-it.s,col0:colId,colRect:col.getBoundingClientRect(),moved:false,target:colId,ns:it.s,nd:it.e-it.s};
    try{el.setPointerCapture(ev.pointerId);}catch(e){}
    ev.preventDefault();
  });
  el.addEventListener('pointermove',ev=>{
    const D=DRAG;if(!D||D.el!==el)return;
    const dx=ev.clientX-D.x0,dy=ev.clientY-D.y0;
    if(!D.moved&&Math.hypot(dx,dy)<4)return;
    D.moved=true;el.classList.add('dragging');
    const dMin=Math.round(dy/SLOT_H*60/SNAP)*SNAP;
    if(D.resize){
      D.nd=Math.max(15,Math.min(RANGE.e-D.s0,D.dur+dMin));
      el.style.height=Math.max(26,D.nd/60*SLOT_H-5)+'px';
      const bad=clashesIn(D.col0,D.s0,D.s0+D.nd,b.id);
      el.classList.toggle('drag-bad',bad.length>0);
      dragTip('Ends '+minLabel(D.s0+D.nd)+' · '+fmtDur(D.nd)+(bad.length?' · overlaps '+bad[0]:''),bad.length,ev.clientX,ev.clientY);
      return;
    }
    D.ns=Math.max(RANGE.s,Math.min(RANGE.e-SNAP,D.s0+dMin));
    let target=D.col0,tRect=D.colRect;
    const hit=(document.elementsFromPoint?document.elementsFromPoint(ev.clientX,ev.clientY):[]).find(n=>n.classList&&n.classList.contains('day-col'));
    if(hit){target=hit.dataset.col;tRect=hit.getBoundingClientRect();}
    D.target=target;
    el.style.transform='translate('+(tRect.left-D.colRect.left)+'px,'+((D.ns-D.s0)/60*SLOT_H)+'px)';
    const bad=clashesIn(target,D.ns,D.ns+D.dur,b.id);
    el.classList.toggle('drag-bad',bad.length>0);
    const who=target===UNASSIGNED?'Unassigned':((staffById(target)||{}).name||'');
    dragTip(minLabel(D.ns)+(who?' · '+who:'')+(bad.length?' · overlaps '+bad[0]:''),bad.length,ev.clientX,ev.clientY);
  });
  const finish=async(ev,cancelled)=>{
    const D=DRAG;if(!D||D.el!==el)return;
    DRAG=null;dragTip(null);
    if(!D.moved)return;
    DRAG_JUST_ENDED=true;setTimeout(()=>{DRAG_JUST_ENDED=false;},0);
    if(cancelled){render();return;}
    const payload={action:'move',booking_id:b.id};
    if(D.resize){
      if(D.nd===D.dur){render();return;}
      Object.assign(payload,{date:curKey(),time:hhmm(D.s0),duration_min:D.nd});
    }else{
      if(D.ns===D.s0&&D.target===D.col0){render();return;}
      Object.assign(payload,{date:curKey(),time:hhmm(D.ns),staff_id:D.target===UNASSIGNED?null:D.target});
    }
    el.classList.add('saving');
    const d=await ownerPost(payload,{confirmTitle:'Overlap another appointment?'});
    if(!d.ok){if(!d.dismissed)toast(d.error||'Could not move the appointment.','error');render();return;}
    toast(D.resize?'Now ends '+minLabel(D.s0+D.nd)+'.':'Moved to '+minLabel(D.ns)+(D.target!==D.col0?' with '+((staffById(D.target)||{}).name||'Unassigned'):'')+'.');
    if(d.warnings&&d.warnings.length)setTimeout(()=>toast('Heads up: '+d.warnings.join(' ')),400);
    await load();
  };
  el.addEventListener('pointerup',ev=>finish(ev,false));
  el.addEventListener('pointercancel',ev=>finish(ev,true));
}

let SUGG_SEQ=0;
async function loadSuggest(){
  const box=document.getElementById('bkSuggest');if(!box)return;
  const ids=svcSel();
  if(!ids.length){box.innerHTML='<span class="sugg-empty">Pick a service to see open times</span>';return;}
  const date=document.getElementById('bkDate').value||curKey();
  const staff=document.getElementById('bkStaff').value;
  const seq=++SUGG_SEQ;
  box.innerHTML='<span class="sugg-empty">Finding open times…</span>';
  try{
    const d=await getJSON('/api/calendar-owner?action=suggest&service_ids='+encodeURIComponent(ids.join(','))+'&date='+date+(staff?'&staff_id='+encodeURIComponent(staff):''));
    if(seq!==SUGG_SEQ)return;
    if(!d.ok||!(d.slots||[]).length){box.innerHTML='<span class="sugg-empty">No open times that day — you can still book any time as the owner.</span>';return;}
    box.innerHTML=d.slots.map((s,i)=>'<button type="button" data-i="'+i+'">'+esc(s.label||s.time)+(staff?'':'<small>'+esc(s.staff_name||'')+'</small>')+'</button>').join('');

      document.getElementById('bkTime').value=s.time;document.getElementById('bkDate').value=s.date;
      if(!staff&&s.staff_id)document.getElementById('bkStaff').value=s.staff_id;
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn));
    });

async function saveBooking(){
  const st=document.getElementById('mstatus');st.textContent='Saving...';st.className='mstatus';
  const name=document.getElementById('bkClient').value.trim();
  const phone=document.getElementById('bkPhone').value.trim();
  const svcIds=svcSel();
  const staffId=document.getElementById('bkStaff').value;
  const date=document.getElementById('bkDate').value||curKey();
  const time=document.getElementById('bkTime').value||'10:00';
  const notes=document.getElementById('bkNotes').value.trim();
  const walkIn=BK.walkIn;BK.walkIn=false;
  if(!name&&!phone&&!BK.client&&!walkIn){st.textContent='Please enter or pick a client.';st.className='mstatus err';return;}
  if(!svcIds.length){st.textContent='Pick at least one service.';st.className='mstatus err';return;}
  // Repeat modes: '1' = none; 'w6' = weekly x6, 'b4' = bi-weekly x4, 'm12' = monthly x12.
  const rv=String((document.getElementById('bkRepeat')||{}).value||'1');
  const rm=/^([wbm])(\d+)$/.exec(rv);
  const repeat=rm?{rule:{w:'weekly',b:'biweekly',m:'monthly'}[rm[1]],count:parseInt(rm[2],10)}:null;
  const btn=document.getElementById('bkSave');if(btn)btn.disabled=true;
  try{
    const d=await ownerPost({action:'book',service_ids:svcIds,staff_id:staffId||null,date,time,
      client_id:BK.client?.id||null,client_name:BK.client?null:(name||null),client_phone:BK.client?null:(phone||null),
      notes:notes||null,repeat,walk_in:walkIn});
    if(!d.ok){if(d.dismissed){st.textContent='';return;}st.textContent=d.error||'Failed';st.className='mstatus err';return;}
    closeModal();
    const ruleLabel={weekly:'weekly',biweekly:'bi-weekly',monthly:'monthly'}[(d.series||{}).rule]||'recurring';
    toast(d.series?('Series created — '+d.series.total+' '+ruleLabel+' appointments'+(d.series.sms_sent?', one confirmation text sent.':'.')):(walkIn?'Walk-in booked.':'Booking confirmed — Lola will text the client.'),'success');
    if(d.warnings&&d.warnings.length)setTimeout(()=>toast('Heads up: '+[...new Set(d.warnings)].slice(0,3).join(' ')),500);
    if(WL.lastPrefill){const pid=WL.lastPrefill.id;WL.lastPrefill=null;fetch('/api/calendar',{method:'POST',headers:hdr(),body:JSON.stringify({action:'waitlist_remove',id:pid,status:'offered'})}).catch(()=>{});}
    if(date!==curKey()){setCursorKey(date);}
    await load();loadWaitlist();
  }catch(e){st.textContent=e.message||'Something went wrong.';st.className='mstatus err';}
  finally{if(btn)btn.disabled=false;}
}

async function saveBlock(){
  const st=document.getElementById('mstatus');st.textContent='Blocking…';st.className='mstatus';
  const staffId=document.getElementById('bkBlockStaff').value;
  const date=document.getElementById('bkBlockDate').value;
  const start=document.getElementById('bkBlockStart').value;
  const end=document.getElementById('bkBlockEnd').value;
  const reason=document.getElementById('bkBlockReason').value.trim()||'Blocked';
  if(!date){st.textContent='Pick a date.';st.className='mstatus err';return;}
  if(start&&end&&toMin(end)<=toMin(start)){st.textContent='End time must be after start time (or leave both empty for an all-day block).';st.className='mstatus err';return;}
  try{
    const r=await fetch('/api/salon',{method:'POST',headers:hdr(),body:JSON.stringify({resource:'block',staff_id:staffId,date,start_time:start||null,end_time:end||null,reason})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Failed');
    closeModal();toast('Time blocked.');await load();
  }catch(e){st.textContent=e.message||'Something went wrong.';st.className='mstatus err';}
}

// Status changes go through /api/calendar-owner → the canonical update
// (status history, no-show fee void, client texts) — never a bare row write.
const STATUS_TOAST={confirmed:'Confirmed.',checked_in:'Checked in — client has arrived.',in_progress:'Service started.',completed:'Marked completed.',no_show:'Marked no-show.',cancelled:'Cancelled.'};
async function setStatus(id,status){
  const prev=findBooking(id);
  try{
    const r=await fetch('/api/calendar-owner',{method:'POST',headers:hdr(),body:JSON.stringify({action:'status',booking_id:id,status})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Failed');
    toast(prev&&(prev.status==='completed'||prev.status==='no_show')&&status==='confirmed'?'Reopened.':(STATUS_TOAST[status]||'Updated.'),'success');
    await load();showDetail(id);
  }catch(e){toast(e.message||'Could not update status.','error');}
}
async function loadNotes(bookingId){
  const el=document.getElementById('bkNotesList');if(!el)return;
  try{
    const d=await getJSON('/api/calendar?action=booking_notes&booking_id='+encodeURIComponent(bookingId));
    if(!d.ok)throw new Error(d.error||'Failed');
    el.innerHTML=d.notes.length?d.notes.map(n=>'<div style="border-left:2px solid var(--line);padding-left:10px"><div style="color:var(--text3);font-size:10px">'+esc(n.author||'Staff')+' · '+esc(fmtWhen(n.created_at))+'</div><div>'+esc(n.content)+'</div></div>').join(''):'<div style="color:var(--text3)">No notes yet.</div>';
  }catch(e){el.innerHTML='<div style="color:var(--text3)">Notes unavailable.</div>';}
}
async function addNote(bookingId){
  const inp=document.getElementById('bkNote');const text=(inp.value||'').trim();
  if(!text)return;
  inp.value='';
  try{
    const r=await fetch('/api/salon',{method:'POST',headers:hdr(),body:JSON.stringify({resource:'note',booking_id:bookingId,content:text,author:'Owner'})});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||'Failed');
    loadNotes(bookingId);
  }catch(e){toast(e.message||'Could not add note.','error');}
}
/* ── Reschedule (salon time; status kept as-is; series: this or this + following) ── */
function openReschedule(id){
  const b=findBooking(id);if(!b)return;
  const p=salonParts(b.start_time);
  openModal('Reschedule','Move '+clientName(b.client)+' to a new time (salon time). The appointment keeps its status.',
    '<div class="row2"><div class="fld"><label>New date</label><input id="rsDate" type="date" value="'+p.key+'"/></div>'
    +'<div class="fld"><label>New time</label><input id="rsTime" type="time" step="300" value="'+hhmm(p.min)+'"/></div></div>'
    +'<div class="row2"><div class="fld"><label>Staff</label><select id="rsStaff"></select></div>'
    +'<div class="fld"><label>Length</label><input id="rsDur" type="number" min="5" step="5" value="'+spanMin(b)+'"/></div></div>'
    +(b.series_id?'<div class="fld"><label>Apply to</label><select id="rsScope"><option value="this">This appointment only</option><option value="following">This and following in the series</option></select></div>':'')
    +'<div class="macts"><button class="ghost" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveReschedule(\''+esc(id)+'\')">Move appointment</button></div>'
    +'<div class="mstatus" id="mstatus"></div>');
  const sel=document.getElementById('rsStaff');
  sel.innerHTML=STATE.staff.map(s=>'<option value="'+esc(s.id)+'"'+(s.id===b.staff_id?' selected':'')+'>'+esc(s.name)+'</option>').join('')+'<option value=""'+(b.staff_id?'':' selected')+'>Unassigned</option>';
}
async function saveReschedule(id){
  const st=document.getElementById('mstatus');st.textContent='Moving...';st.className='mstatus';
  const date=document.getElementById('rsDate').value,time=document.getElementById('rsTime').value;
  const staffId=document.getElementById('rsStaff').value;
  const dur=parseInt(document.getElementById('rsDur').value,10);
  const scope=(document.getElementById('rsScope')||{}).value||'this';
  if(!date||!time){st.textContent='Pick a date and time.';st.className='mstatus err';return;}
  const d=await ownerPost({action:'move',booking_id:id,date,time,staff_id:staffId||null,duration_min:dur>0?dur:undefined,series_scope:scope});
  if(!d.ok){if(d.dismissed){st.textContent='';return;}st.textContent=d.error||'Failed';st.className='mstatus err';return;}
  closeModal();
  toast(d.series_moved?('Moved — '+(d.series_moved+1)+' appointments in the series.'):'Appointment moved.');
  if(d.warnings&&d.warnings.length)setTimeout(()=>toast('Heads up: '+d.warnings.join(' ')),400);
  if(date!==curKey()&&VIEW!=='week')setCursorKey(date);
  await load();
}
function cancelBooking(id){
  const b=findBooking(id);if(!b)return;
  const doCancel=()=>{
    const st=document.getElementById('mstatus');
    fetch('/api/calendar',{method:'POST',headers:hdr(),body:JSON.stringify({action:'cancel',booking_id:id,channel:'dashboard',reason:'client_request'})})
      .then(r=>r.json()).then(d=>{
        if(!d.ok)throw new Error(d.error||'Failed');
        closeModal();
        if(d.waitlist_matches&&d.waitlist_matches.count){
          toast(d.waitlist_matches.count+' client'+(d.waitlist_matches.count===1?' is':'s are')+' on the waitlist for this service — offer the freed slot.','success');
        }else{toast('Booking cancelled — client notified.','success');}
        load();loadWaitlist();
      }).catch(e=>{if(st){st.textContent=e.message;st.className='mstatus err';}else toast(e.message,'error');});
  };
  confirmDialog({title:'Cancel this booking?',message:clientName(b.client)+' · '+(b.service?.name||'Appointment')+' — this frees the slot and texts the client.',confirmLabel:'Cancel booking',cancelLabel:'Keep it',danger:true}).then(ok=>{if(ok)doCancel();});
}
// ── Series scope handling ──────────────────────────────────────────────
// A series occurrence offers this / this-and-following / all; backing out of
// the dialog (Keep / backdrop / Esc → false) does NOTHING. A plain booking
// cancels directly after its own confirmation.
function seriesCancelChoice(id){
  const b=findBooking(id);if(!b)return;
  if(!b.series_id){cancelBooking(id);return;}
  const st=document.getElementById('mstatus');
  const doCancel=(scope)=>{
    fetch('/api/calendar',{method:'POST',headers:hdr(),body:JSON.stringify({action:'cancel',booking_id:id,series_scope:scope,channel:'dashboard',reason:'client_request'})})
      .then(r=>r.json()).then(d=>{
        if(!d.ok)throw new Error(d.error||'Failed');
        closeModal();
        toast(scope==='this'?('Occurrence cancelled — the rest of the series stands.'):((d.cancelled_count||'All')+' occurrences cancelled ('+(scope==='all'?'entire series':'this + following')+').'),'success');
        load();loadWaitlist();
      }).catch(e=>{if(st){st.textContent=e.message;st.className='mstatus err';}else toast(e.message,'error');});
  };
  if(window.LolaUX){
    window.LolaUX.confirm({title:'Cancel series',message:'This appointment is part of a recurring series. Cancel just this one, this one and every later one, or the whole series?',confirmLabel:'This occurrence only',cancelLabel:'Keep',danger:true,extraButtons:[
      {label:'This + following',value:'following',danger:true},
      {label:'Entire series',value:'all',danger:true}
    ]}).then((scope)=>{
      if(scope===false||scope==null)return; // backed out — nothing is cancelled
      if(scope==='following'||scope==='all')return doCancel(scope);
      if(scope===true)return doCancel('this');
    });
  }else{
    const v=prompt('Cancel scope — type: this / following / all','this');
    if(!v)return; const sc=v.trim().toLowerCase();
    if(sc==='following'||sc==='all'||sc==='this')doCancel(sc);
  }
}

function nav(dir){
  setCursorKey(addDaysKey(curKey(),VIEW==='week'?dir*7:dir));
  load();
}
function goToday(){setCursorKey(todayKey());load();}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!document.querySelector('.lola-dialog-layer'))closeModal();
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'');
  if(typing||document.querySelector('.mw.open')||e.metaKey||e.ctrlKey)return;
  if(e.key==='ArrowRight')nav(1);
  if(e.key==='ArrowLeft')nav(-1);
});
(MQ.addEventListener?MQ.addEventListener.bind(MQ):(t,f)=>MQ.addListener&&MQ.addListener(f))('change',()=>{if(VIEW==='day')render();});
(async()=>{
  try{await window.LolaAuth.ready;}catch(e){return;}
  // The salon's "today", not the browser's: an owner in LA at 10 PM is already
  // looking at tomorrow in New York.
  const ctx=await loadContext(null,1);
  setCursorKey(ctx&&ctx.date?ctx.date:todayKey());
  load();loadWaitlist();
})();
