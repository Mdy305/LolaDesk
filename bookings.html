<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookings — LolaDesk</title><link rel="stylesheet" href="app.css">
<style>
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap}.date-nav{display:flex;align-items:center;gap:10px}.date-title{font-size:28px;font-weight:600}.cal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:auto}.cal-grid{display:grid;min-width:800px}.head,.time,.slot{border-right:1px solid var(--border);border-bottom:1px solid var(--border)}.head{padding:14px;position:sticky;top:0;background:#111;z-index:3;text-align:center}.time{padding:8px;color:var(--text3);font-size:11px;text-align:right}.slot{height:72px;position:relative}.appt{position:absolute;left:5px;right:5px;border:1px solid var(--pink);background:var(--pink-dim);border-radius:10px;padding:8px;overflow:hidden;z-index:2}.appt b{display:block;font-size:12px}.appt span{font-size:10px;color:var(--text2)}.empty-state{padding:50px;text-align:center;color:var(--text3)}.modal-wrap{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:20px}.modal-wrap.open{display:flex}.modal{width:min(520px,100%);background:#111;border:1px solid var(--border);border-radius:24px;padding:24px}.modal h2{margin-bottom:18px}.field{margin-bottom:12px}.field label{display:block;color:var(--text3);font-size:11px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status{font-size:12px;color:var(--text3);margin-top:12px}
</style></head>
<body data-page="bookings"><div class="app"><main class="main">
<div class="topbar"><div class="page-head"><h1 class="page-title">Bookings</h1><p class="page-sub">One calendar. Lola, web booking and your team use the same data.</p></div><button class="btn btn-primary" onclick="openModal()">+ New booking</button></div>
<div class="toolbar"><div class="date-nav"><button class="btn btn-ghost" onclick="moveDay(-1)">‹</button><button class="btn btn-ghost" onclick="today()">Today</button><button class="btn btn-ghost" onclick="moveDay(1)">›</button><div class="date-title" id="dateTitle"></div></div><div id="syncState" class="pill mono">Loading…</div></div>
<div class="kpis"><div class="kpi"><div class="kpi-val" id="kCount">0</div><div class="kpi-label">Appointments</div></div><div class="kpi"><div class="kpi-val" id="kRevenue">$0</div><div class="kpi-label">Booked revenue</div></div><div class="kpi"><div class="kpi-val" id="kStaff">0</div><div class="kpi-label">Active staff</div></div><div class="kpi"><div class="kpi-val pink" id="kServices">0</div><div class="kpi-label">Services</div></div></div>
<div class="cal"><div id="calendar"></div></div>
</main></div>
<div class="modal-wrap" id="modal"><div class="modal"><h2>New booking</h2><div class="field"><label>Client name</label><input id="clientName" placeholder="Client name"></div><div class="row"><div class="field"><label>Phone</label><input id="clientPhone" placeholder="+1…"></div><div class="field"><label>Email</label><input id="clientEmail" type="email"></div></div><div class="row"><div class="field"><label>Service</label><select id="service"></select></div><div class="field"><label>Stylist</label><select id="staff"></select></div></div><div class="row"><div class="field"><label>Date</label><input id="bookDate" type="date"></div><div class="field"><label>Time</label><input id="bookTime" type="time" value="12:00"></div></div><div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveBooking()">Book appointment</button></div><div class="status" id="modalStatus"></div></div></div>
<script src="auth-guard.js"></script><script src="sidebar.js"></script>
<script>
let cursor=new Date();cursor.setHours(0,0,0,0);let STATE={bookings:[],staff:[],services:[]};
function token(){return localStorage.getItem('loladesk_token')||''}function headers(){return {'Authorization':'Bearer '+token(),'Content-Type':'application/json'}}function dkey(d){return d.toISOString().slice(0,10)}function fmt(d){return d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}function money(n){return '$'+Number(n||0).toLocaleString()}
async function load(){document.getElementById('syncState').textContent='Syncing…';try{const r=await fetch('/api/calendar-manager?action=day&date='+encodeURIComponent(cursor.toISOString()),{headers:headers()});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'Unable to load calendar');STATE=j;render();document.getElementById('syncState').textContent='Live database';document.getElementById('syncState').className='pill pink'}catch(e){document.getElementById('syncState').textContent='Data error';document.getElementById('calendar').innerHTML='<div class="empty-state">'+e.message+'</div>'}}
function render(){document.getElementById('dateTitle').textContent=fmt(cursor);document.getElementById('kCount').textContent=STATE.bookings.filter(x=>x.status!=='cancelled').length;document.getElementById('kRevenue').textContent=money(STATE.bookings.filter(x=>x.status!=='cancelled').reduce((s,x)=>s+Number(x.price||0),0));document.getElementById('kStaff').textContent=STATE.staff.length;document.getElementById('kServices').textContent=STATE.services.length;const staff=STATE.staff.length?STATE.staff:[{id:'unassigned',name:'Unassigned'}];const start=12,end=20;let html='<div class="cal-grid" style="grid-template-columns:70px repeat('+staff.length+',minmax(170px,1fr))"><div class="head"></div>';staff.forEach(s=>html+='<div class="head"><b>'+esc(s.name)+'</b><div style="font-size:10px;color:var(--text3)">'+esc(s.role||'')+'</div></div>');for(let h=start;h<end;h++){html+='<div class="time">'+new Date(2000,0,1,h).toLocaleTimeString([], {hour:'numeric'})+'</div>';staff.forEach(s=>{const items=STATE.bookings.filter(b=>b.status!=='cancelled'&&(s.id==='unassigned'?!b.staffId:b.staffId===s.id)&&new Date(b.startsAt).getHours()===h);html+='<div class="slot">'+items.map(b=>{const m=new Date(b.startsAt).getMinutes();const top=(m/60)*72;const height=Math.max(38,(Number(b.durationMin||60)/60)*72-6);return '<div class="appt" style="top:'+top+'px;height:'+height+'px" title="'+esc(b.client)+' — '+esc(b.service)+'"><b>'+esc(b.client)+'</b><span>'+esc(b.service)+(b.stylist?' · '+esc(b.stylist):'')+'</span></div>'}).join('')+'</div>'})}html+='</div>';document.getElementById('calendar').innerHTML=html;fillSelectors()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function moveDay(n){cursor.setDate(cursor.getDate()+n);load()}function today(){cursor=new Date();cursor.setHours(0,0,0,0);load()}
function fillSelectors(){document.getElementById('service').innerHTML='<option value="">Select service</option>'+STATE.services.map(s=>'<option value="'+s.id+'" data-duration="'+(s.duration_minutes||60)+'" data-price="'+(s.price||0)+'">'+esc(s.name)+' — '+money(s.price)+'</option>').join('');document.getElementById('staff').innerHTML='<option value="">Any stylist</option>'+STATE.staff.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')}
function openModal(){document.getElementById('modal').classList.add('open');document.getElementById('bookDate').value=dkey(cursor);document.getElementById('modalStatus').textContent=''}function closeModal(){document.getElementById('modal').classList.remove('open')}
async function saveBooking(){const svc=document.getElementById('service'),opt=svc.options[svc.selectedIndex];const date=document.getElementById('bookDate').value,time=document.getElementById('bookTime').value;if(!document.getElementById('clientName').value||!date||!time){document.getElementById('modalStatus').textContent='Client, date and time are required.';return}const starts=new Date(date+'T'+time+':00');const body={action:'book',client_name:document.getElementById('clientName').value,client_phone:document.getElementById('clientPhone').value,client_email:document.getElementById('clientEmail').value,service_id:svc.value||null,staff_id:document.getElementById('staff').value||null,starts_at:starts.toISOString(),duration_min:Number(opt?.dataset.duration||60),price:Number(opt?.dataset.price||0),source:'dashboard'};document.getElementById('modalStatus').textContent='Booking…';const r=await fetch('/api/calendar-manager',{method:'POST',headers:headers(),body:JSON.stringify(body)});const j=await r.json();if(!r.ok){document.getElementById('modalStatus').textContent=j.error||'Booking failed';return}closeModal();cursor=new Date(starts);cursor.setHours(0,0,0,0);await load()}
load();
</script><script src="app.js"></script></body></html>
