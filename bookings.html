<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Calendar — LolaDesk</title><link rel="stylesheet" href="app.css"/>
<style>
.cal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}.cal-title h1{font-size:32px;letter-spacing:-.04em}.cal-title p{color:var(--text3);font-size:13px;margin-top:4px}.date-nav{display:flex;gap:8px;align-items:center}.date-nav button{height:38px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:12px}.calendar{border:1px solid var(--border);border-radius:20px;overflow:auto;background:var(--surface);min-height:520px}.grid{display:grid;min-width:760px}.corner,.staff-head{position:sticky;top:0;z-index:3;background:var(--bg2);border-bottom:1px solid var(--border);height:72px}.corner{left:0;z-index:4;border-right:1px solid var(--border)}.staff-head{padding:14px;border-right:1px solid var(--border)}.staff-name{font-weight:600}.staff-role{font-size:11px;color:var(--text3)}.time{position:sticky;left:0;z-index:2;background:var(--bg2);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;font-size:10px;color:var(--text3);text-align:right}.slot{height:72px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;cursor:pointer}.slot:hover{background:rgba(204,255,0,.035)}.booking{position:absolute;left:5px;right:5px;top:5px;min-height:58px;border-radius:12px;background:rgba(204,255,0,.1);border:1px solid rgba(204,255,0,.28);padding:8px;z-index:1;overflow:hidden}.booking strong{display:block;font-size:12px}.booking span{display:block;font-size:10px;color:var(--text2);margin-top:2px}.empty{padding:80px 30px;text-align:center;color:var(--text3)}.modal-wrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(12px);z-index:100;padding:20px}.modal-wrap.open{display:flex}.modal{width:min(520px,100%);background:var(--bg2);border:1px solid var(--border);border-radius:24px;padding:24px}.modal h2{font-size:23px;margin-bottom:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}.field input,.field select{height:42px;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);padding:0 12px}.actions{display:flex;gap:10px;margin-top:18px}.status{font-size:12px;color:var(--text3);margin-top:12px;min-height:18px}.toolbar-links{display:flex;gap:8px}.toolbar-links a{font-size:12px;padding:9px 12px;border:1px solid var(--border);border-radius:11px;color:var(--text2)}@media(max-width:760px){.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body data-page="bookings"><div class="app"><main class="main">
<div class="cal-head"><div class="cal-title"><h1 id="dateTitle">Calendar</h1><p id="dateSub">Live tenant schedule</p></div><div class="toolbar-links"><a href="team.html">Team</a><a href="booking-settings.html">Booking settings</a></div><div class="date-nav"><button onclick="moveDay(-1)">‹</button><button onclick="today()">Today</button><button onclick="moveDay(1)">›</button><button class="btn btn-primary" onclick="openBooking()">New booking</button></div></div>
<div class="calendar"><div class="grid" id="grid"><div class="empty">Loading calendar…</div></div></div>
</main></div>
<div class="modal-wrap" id="modal"><div class="modal"><h2 id="modalTitle">New booking</h2><div class="fields">
<div class="field full"><label>Client name</label><input id="clientName" autocomplete="name"/></div>
<div class="field"><label>Phone</label><input id="clientPhone" autocomplete="tel"/></div><div class="field"><label>Email</label><input id="clientEmail" autocomplete="email"/></div>
<div class="field"><label>Service</label><select id="service"></select></div><div class="field"><label>Team member</label><select id="staff"></select></div>
<div class="field"><label>Date</label><input id="bookDate" type="date"/></div><div class="field"><label>Time</label><input id="bookTime" type="time" step="900"/></div>
<div class="field full"><label>Notes</label><input id="notes"/></div></div>
<div class="actions"><button class="btn btn-primary" onclick="saveBooking()">Confirm booking</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button></div><div class="status" id="status"></div></div></div>
<script src="auth-guard.js"></script><script src="lola-data.js"></script><script src="sidebar.js"></script>
<script>
let cursor=new Date();cursor.setHours(0,0,0,0);let state={staff:[],services:[],bookings:[],clients:[],settings:{}};const START=8,END=21;
function token(){return window.LolaAuth?.token||localStorage.getItem('loladesk_token')||''}function isoDay(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt={}){if(window.LolaAuth?.ready)await window.LolaAuth.ready;const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token(),...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j}
async function load(){document.getElementById('dateTitle').textContent=cursor.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});document.getElementById('dateSub').textContent='Loading live schedule…';try{const [day,clients]=await Promise.all([api('/api/calendar?action=day&date='+encodeURIComponent(isoDay(cursor))),LolaData.load('clients')]);state={...state,...day,clients:clients?.clients||[]};document.getElementById('dateSub').textContent=`${state.bookings.length} booking${state.bookings.length===1?'':'s'} · ${state.staff.length} active team member${state.staff.length===1?'':'s'}`;render()}catch(e){document.getElementById('grid').innerHTML='<div class="empty">Calendar unavailable: '+esc(e.message)+'</div>';document.getElementById('dateSub').textContent='Could not load tenant calendar'}}
function render(){const g=document.getElementById('grid');if(!state.staff.length){g.innerHTML='<div class="empty">No active team members yet. Add your team first.</div>';return}g.style.gridTemplateColumns=`72px repeat(${state.staff.length},minmax(170px,1fr))`;let h='<div class="corner"></div>'+state.staff.map(s=>`<div class="staff-head"><div class="staff-name">${esc(s.name)}</div><div class="staff-role">${esc(s.role||'Team member')}</div></div>`).join('');for(let hr=START;hr<END;hr++){h+=`<div class="time">${new Date(2000,0,1,hr).toLocaleTimeString([],{hour:'numeric'})}</div>`;for(const s of state.staff)h+=`<div class="slot" data-staff="${s.id}" data-hour="${hr}" onclick="quickBook('${s.id}',${hr})"></div>`}g.innerHTML=h;for(const b of state.bookings){const s=state.staff.find(x=>x.id===b.staff_id);if(!s)continue;const d=new Date(b.start_time);const hr=d.getHours();if(hr<START||hr>=END)continue;const slot=g.querySelector(`.slot[data-staff="${s.id}"][data-hour="${hr}"]`);if(!slot)continue;const svc=state.services.find(x=>x.id===b.service_id);const client=state.clients.find(x=>x.id===b.client_id);const el=document.createElement('div');el.className='booking';el.innerHTML=`<strong>${esc(client?.name||'Client')}</strong><span>${esc(svc?.name||'Appointment')} · ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</span>`;el.onclick=(ev)=>{ev.stopPropagation();openDetail(b)};slot.appendChild(el)}}
function fillSelects(){service.innerHTML=state.services.map(x=>`<option value="${x.id}">${esc(x.name)}${x.price!=null?' · $'+Number(x.price).toLocaleString():''}</option>`).join('');staff.innerHTML=state.staff.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}
function openBooking(staffId='',hour=12){fillSelects();modalTitle.textContent='New booking';bookDate.value=isoDay(cursor);bookTime.value=String(hour).padStart(2,'0')+':00';if(staffId)staff.value=staffId;status.textContent='';modal.classList.add('open')}
function quickBook(staffId,hour){openBooking(staffId,hour)}function closeModal(){modal.classList.remove('open')}
async function saveBooking(){status.textContent='Saving…';const svc=state.services.find(x=>x.id===service.value);const starts=new Date(bookDate.value+'T'+bookTime.value+':00');try{const out=await api('/api/calendar',{method:'POST',body:JSON.stringify({action:'book',channel:'dashboard',client_name:clientName.value.trim(),client_phone:clientPhone.value.trim(),client_email:clientEmail.value.trim(),service_id:service.value,staff_id:staff.value,starts_at:starts.toISOString(),total_amount:svc?.price??0,notes:notes.value.trim()})});if(!out.ok)throw new Error(out.error||out.needs||'Booking could not be created');closeModal();await load()}catch(e){status.textContent=e.message}}
function openDetail(b){const svc=state.services.find(x=>x.id===b.service_id);const client=state.clients.find(x=>x.id===b.client_id);if(confirm(`${client?.name||'Client'}\n${svc?.name||'Appointment'}\n${new Date(b.start_time).toLocaleString()}\n\nCancel this booking?`))cancelBooking(b.id)}async function cancelBooking(id){try{await api('/api/calendar',{method:'POST',body:JSON.stringify({action:'cancel',booking_id:id,channel:'dashboard'})});await load()}catch(e){alert(e.message)}}
function moveDay(n){cursor.setDate(cursor.getDate()+n);load()}function today(){cursor=new Date();cursor.setHours(0,0,0,0);load()}load();
</script></body></html>
