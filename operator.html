<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Operator — LolaDesk</title><link rel="stylesheet" href="app.css"><style>body{background:#080909;color:#f7f8f2}.wrap{max-width:1180px;margin:0 auto;padding:30px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:22px}.score{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#d8ff45 0 45%,#1a210d 46% 100%);color:#090a06;font-size:30px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#121410;border:1px solid rgba(216,255,69,.13);border-radius:18px;padding:18px}.metric{font-size:30px;font-weight:700;margin-top:9px}.muted{color:#9ca18d;font-size:12px}.channels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.channel{padding:15px;border-radius:14px;background:#0d0f0b;border:1px solid #252a1d}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;background:#6f7664}.on .dot{background:#d8ff45;box-shadow:0 0 14px #d8ff45}.list{margin-top:14px}.row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid #23271d}.danger{color:#ff8178}.ok{color:#d8ff45}@media(max-width:820px){.grid,.channels{grid-template-columns:1fr 1fr}.hero{flex-direction:column}.wrap{padding:18px}}@media(max-width:520px){.grid,.channels{grid-template-columns:1fr}}</style></head><body><script src="auth-guard.js"></script><script src="sidebar.js"></script><main class="wrap"><section class="hero"><div><div class="muted">LOLA LIVE OPERATIONS</div><h1>Operator Mission Control</h1><p class="muted">One truthful view of voice, text, intelligence and infrastructure. No simulated “active” states.</p></div><div class="score" id="score">—</div></section><section class="grid"><div class="card"><div class="muted">STATUS</div><div class="metric" id="status">Loading</div></div><div class="card"><div class="muted">CALLS · 24H</div><div class="metric" id="calls">—</div></div><div class="card"><div class="muted">ANSWERED · 24H</div><div class="metric" id="answered">—</div></div><div class="card"><div class="muted">MESSAGES · 24H</div><div class="metric" id="messages">—</div></div></section><section class="card" style="margin-top:14px"><h2>Live channels</h2><div class="channels" id="channels"></div></section><section class="grid" style="margin-top:14px"><div class="card" style="grid-column:span 2"><h2>Infrastructure</h2><div class="list" id="config"></div></div><div class="card" style="grid-column:span 2"><h2>Telemetry</h2><div class="list" id="telemetry"></div></div></section></main><script>const token=localStorage.getItem('loladesk_token')||'';const esc=s=>String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));function row(a,b,good=true){return `<div class="row"><span>${esc(a)}</span><strong class="${good?'ok':'danger'}">${esc(b)}</strong></div>`}async function load(){const r=await fetch('/api/operator-health',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load');score.textContent=d.score;status.textContent=d.status.replace('_',' ').toUpperCase();calls.textContent=d.telemetry.calls_24h;answered.textContent=d.telemetry.answered_24h;messages.textContent=d.telemetry.messages_24h;channels.innerHTML=Object.entries(d.channels).map(([k,v])=>`<div class="channel ${v?'on':''}"><span class="dot"></span><strong>${esc(k.replace('_',' '))}</strong><div class="muted">${v?'Operational':'Not verified'}</div></div>`).join('');config.innerHTML=d.config.map(x=>row(x.name,x.configured?'Configured':'Missing',x.configured)).join('');telemetry.innerHTML=row('Lola number',d.tenant.phone_number||'Not assigned',!!d.tenant.phone_number)+row('Failed calls',d.telemetry.failures_24h,d.telemetry.failures_24h===0)+row('Last call',d.telemetry.last_call_age_minutes==null?'No recent call':d.telemetry.last_call_age_minutes+' min ago',d.telemetry.last_call_age_minutes!=null)+row('Last message',d.telemetry.last_message_age_minutes==null?'No recent message':d.telemetry.last_message_age_minutes+' min ago',d.telemetry.last_message_age_minutes!=null)}load().catch(e=>{status.textContent='OFFLINE';telemetry.innerHTML=row('Error',e.message,false)});setInterval(load,30000);</script></body></html>
